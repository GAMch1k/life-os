    restart: unless-stopped

  backup:
    image: ${LIFE_OS_IMAGE_REGISTRY:-ghcr.io/gamch1k}/life-os-backup:${LIFE_OS_VERSION:?Set LIFE_OS_VERSION in .env to the Life OS release to run, such as v0.1.0-preview.1}
    environment:
      SERVICE_NAME: backup
      PORT: 8080
      BACKUP_DATABASE_URL: postgres://lifeos_backup@postgres:5432/?sslmode=disable
      BACKUP_DATABASE_PASSWORD: ${LIFE_OS_BACKUP_DB_PASSWORD:-}
      BACKUP_DATABASES_FILE: /etc/lifeos/postgres/service-databases.conf
      BACKUP_DIR: /backups
      BACKUP_TIME: ${LIFE_OS_BACKUP_TIME:-03:15}
      LIFE_OS_TIMEZONE: ${LIFE_OS_TIMEZONE:-UTC}
      BACKUP_KEEP_DAILY: ${LIFE_OS_BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${LIFE_OS_BACKUP_KEEP_WEEKLY:-4}
      BACKUP_KEEP_MONTHLY: ${LIFE_OS_BACKUP_KEEP_MONTHLY:-12}
      BACKUP_KEEP_FAILED_DAYS: ${LIFE_OS_BACKUP_KEEP_FAILED_DAYS:-3}
      BACKUP_RESTORE_CHECK_DAY: ${LIFE_OS_BACKUP_RESTORE_CHECK_DAY:-sunday}
      BACKUP_INBOX_MEDIA_DIR: /media/inbox
    volumes:
      - type: bind
        source: ${LIFE_OS_BACKUP_DIR:?Set LIFE_OS_BACKUP_DIR in .env to the existing host directory for backups}
        target: /backups
      - type: volume
        source: inbox-media
        target: /media/inbox
        read_only: true
        volume:
          nocopy: true
    tmpfs:
      - /var/lib/postgresql
    user: ${LIFE_OS_BACKUP_RUNTIME_UID:-1000}
    group_add:
      - ${LIFE_OS_INBOX_MEDIA_GID:-101}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - '8080'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    stop_grace_period: 30s

  host-health:
    image: ${LIFE_OS_IMAGE_REGISTRY:-ghcr.io/gamch1k}/life-os-host-health:${LIFE_OS_VERSION:?Set LIFE_OS_VERSION in .env to the Life OS release to run, such as v0.1.0-preview.1}
    environment:
      SERVICE_NAME: host-health
      PORT: 8080
      HOST_HEALTH_DISKS: root=/host,docker=/host-docker
      HOST_HEALTH_DOCKER_URL: http://host-health-docker:8080
      HOST_HEALTH_CGROUP_DIR: /host-cgroup
      HOST_HEALTH_MEMORY_WARNING_PERCENT: ${LIFE_OS_HOST_HEALTH_MEMORY_WARNING_PERCENT:-15}
      HOST_HEALTH_MEMORY_WARNING_SAMPLES: ${LIFE_OS_HOST_HEALTH_MEMORY_WARNING_SAMPLES:-3}
      HOST_HEALTH_MEMORY_PROBLEM_PERCENT: ${LIFE_OS_HOST_HEALTH_MEMORY_PROBLEM_PERCENT:-7}
      HOST_HEALTH_DISK_WARNING_GIB: ${LIFE_OS_HOST_HEALTH_DISK_WARNING_GIB:-10}
      HOST_HEALTH_DISK_WARNING_PERCENT: ${LIFE_OS_HOST_HEALTH_DISK_WARNING_PERCENT:-10}
      HOST_HEALTH_DISK_PROBLEM_GIB: ${LIFE_OS_HOST_HEALTH_DISK_PROBLEM_GIB:-3}
      HOST_HEALTH_LOAD_WARNING_PER_CPU: ${LIFE_OS_HOST_HEALTH_LOAD_WARNING_PER_CPU:-1}
      HOST_HEALTH_RESTART_LOOP_COUNT: ${LIFE_OS_HOST_HEALTH_RESTART_LOOP_COUNT:-3}
      HOST_HEALTH_RESTART_LOOP_MINUTES: ${LIFE_OS_HOST_HEALTH_RESTART_LOOP_MINUTES:-15}
      HOST_HEALTH_UNHEALTHY_MINUTES: ${LIFE_OS_HOST_HEALTH_UNHEALTHY_MINUTES:-5}
      HOST_HEALTH_IGNORE_PROJECTS: ${LIFE_OS_HOST_HEALTH_IGNORE_PROJECTS:-lifeos-verify}
    volumes:
      - type: bind
        source: /
        target: /host
        read_only: true
        bind:
          recursive: disabled
      - type: bind
        source: ${LIFE_OS_DOCKER_ROOT:-/var/lib/docker}
        target: /host-docker
        read_only: true
        bind:
          recursive: disabled
      - type: bind
        source: ${LIFE_OS_DOCKER_CGROUP_DIR:-/sys/fs/cgroup/system.slice}
        target: /host-cgroup
        read_only: true
        bind:
          recursive: disabled
    user: 65534:65534
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - '8080'
    networks:
      - backend
      - host-docker
    restart: unless-stopped

  host-health-docker:
    image: ${LIFE_OS_IMAGE_REGISTRY:-ghcr.io/gamch1k}/life-os-host-health:${LIFE_OS_VERSION:?Set LIFE_OS_VERSION in .env to the Life OS release to run, such as v0.1.0-preview.1}
    entrypoint:
      - /service
      - docker-gateway
    environment:
      PORT: 8080
      DOCKER_GATEWAY_SOCKET: /var/run/docker.sock
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
    user: 65534:${LIFE_OS_DOCKER_GID:-999}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - '8080'
    networks:
      - host-docker
    restart: unless-stopped

  mcp:
    image: ${LIFE_OS_IMAGE_REGISTRY:-ghcr.io/gamch1k}/life-os-mcp:${LIFE_OS_VERSION:?Set LIFE_OS_VERSION in .env to the Life OS release to run, such as v0.1.0-preview.1}
    environment:
      SERVICE_NAME: mcp
      PORT: 8080
      FINANCE_SERVICE_URL: http://finance:8080
      TASKS_SERVICE_URL: http://tasks:8080
      INBOX_SERVICE_URL: http://inbox:8080
      CALENDAR_SERVICE_URL: http://calendar:8080
      FOOD_SERVICE_URL: http://food:8080
      RECIPE_IMPORT_SERVICE_URL: http://recipe-import:8080
      ACTIVITY_SERVICE_URL: http://activity:8080
      LIFE_OS_TIMEZONE: ${LIFE_OS_TIMEZONE:-UTC}
    expose:
      - '8080'
    depends_on:
      finance:
        condition: service_started
      tasks:
        condition: service_started
      inbox:
        condition: service_started
      calendar:
        condition: service_started
      food:
        condition: service_started
      recipe-import:
        condition: service_started
    networks:
      - backend
    restart: unless-stopped

  processor:
    image: ${LIFE_OS_IMAGE_REGISTRY:-ghcr.io/gamch1k}/life-os-processor:${LIFE_OS_VERSION:?Set LIFE_OS_VERSION in .env to the Life OS release to run, such as v0.1.0-preview.1}
    environment:
      MCP_SERVICE_URL: http://mcp:8080/mcp
      INBOX_SERVICE_URL: http://inbox:8080
      LIFE_OS_CODEX_WORKDIR: /workspace
      LIFE_OS_CODEX_MODEL: ${LIFE_OS_CODEX_MODEL:-gpt-5.6-luna}
      LIFE_OS_CODEX_REASONING_EFFORT: ${LIFE_OS_CODEX_REASONING_EFFORT:-medium}
      LIFE_OS_PROCESSOR_POLL_MILLIS: ${LIFE_OS_PROCESSOR_POLL_MILLIS:-1000}
      INBOX_CONTEXT_MINUTES: ${LIFE_OS_INBOX_CONTEXT_MINUTES:-20}
      LIFE_OS_PROCESSOR_HEALTH_PORT: 8081
      LIFE_OS_CODEX_TIMEOUT_SECONDS: ${LIFE_OS_CODEX_TIMEOUT_SECONDS:-300}
      LIFE_OS_CODEX_MAX_CONCURRENCY: ${LIFE_OS_CODEX_MAX_CONCURRENCY:-1}
      LIFE_OS_PROCESSOR_STALE_AFTER_SECONDS: ${LIFE_OS_PROCESSOR_STALE_AFTER_SECONDS:-120}
      LIFE_OS_IDEAS_TIME: ${LIFE_OS_IDEAS_TIME:-16:00}
      LIFE_OS_IDEAS_WEB_SEARCH: ${LIFE_OS_IDEAS_WEB_SEARCH:-disabled}
      LIFE_OS_AI_CATEGORIES: ${LIFE_OS_AI_CATEGORIES:-on}
      LIFE_OS_AI_BUDGET_PLANS: ${LIFE_OS_AI_BUDGET_PLANS:-on}
      LIFE_OS_AI_BUDGET_PLAN_MONTHLY: ${LIFE_OS_AI_BUDGET_PLAN_MONTHLY:-on}
      LIFE_OS_TIMEZONE: ${LIFE_OS_TIMEZONE:-UTC}
      TZ: ${LIFE_OS_TIMEZONE:-UTC}
      CODEX_HOME: /tmp/lifeos-codex
    volumes:
      - type: bind
        source: ${LIFE_OS_CODEX_HOME_HOST_PATH:?Set LIFE_OS_CODEX_HOME_HOST_PATH in .env to your existing local Codex home}
        target: /run/lifeos-codex-source
        read_only: true
    tmpfs:
      - /tmp
      - /var/lib/lifeos/codex
      - /workspace:size=128m,mode=1777
    expose:
      - '8081'
    depends_on:
      mcp:
        condition: service_started
      inbox:
        condition: service_started
      tasks:
        condition: service_started
      calendar:
        condition: service_started
      finance:
        condition: service_started
      food:
        condition: service_started
      recipe-import:
        condition: service_started
    networks:
      - backend
    restart: unless-stopped
    user: ${LIFE_OS_CODEX_RUNTIME_UID:?Set LIFE_OS_CODEX_RUNTIME_UID in .env to the UID which owns the local Codex session}
    stop_grace_period: 30s
    mem_limit: ${LIFE_OS_PROCESSOR_MEMORY:-1536m}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8081/ready
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  whisper:
    image: ${LIFE_OS_IMAGE_REGISTRY:-ghcr.io/gamch1k}/life-os-whisper:${LIFE_OS_VERSION:?Set LIFE_OS_VERSION in .env to the Life OS release to run, such as v0.1.0-preview.1}
    environment:
      WHISPER_MODEL_PATH: ${LIFE_OS_WHISPER_MODEL_PATH:-/models/ggml-small.bin}
      WHISPER_MODEL_URL: ${LIFE_OS_WHISPER_MODEL_URL:-https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.bin}
      WHISPER_THREADS: ${LIFE_OS_WHISPER_THREADS:-2}
      WHISPER_MAX_CONCURRENCY: ${LIFE_OS_WHISPER_MAX_CONCURRENCY:-1}
      WHISPER_MAX_AUDIO_BYTES: ${LIFE_OS_WHISPER_MAX_AUDIO_BYTES:-26214400}
    volumes:
      - whisper-models:/models
    expose:
      - '8080'
    networks:
      - backend
    restart: unless-stopped
    cpus: ${LIFE_OS_WHISPER_CPUS:-2.0}
    mem_limit: ${LIFE_OS_WHISPER_MEMORY:-2g}
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/ready
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 2m

  voice-migrate:
    image: ${LIFE_OS_IMAGE_REGISTRY:-ghcr.io/gamch1k}/life-os-migrate:${LIFE_OS_VERSION:?Set LIFE_OS_VERSION in .env to the Life OS release to run, such as v0.1.0-preview.1}
    command:
      - -path
      - /migrations/voice
      - -database
      - postgres://voice_user:${LIFE_OS_VOICE_DB_PASSWORD}@postgres:5432/voice_db?sslmode=disable
      - up
    depends_on:
      postgres-provision:
        condition: service_completed_successfully
    networks:
      - backend
    restart: 'no'

  voice:
    image: ${LIFE_OS_IMAGE_REGISTRY:-ghcr.io/gamch1k}/life-os-voice:${LIFE_OS_VERSION:?Set LIFE_OS_VERSION in .env to the Life OS release to run, such as v0.1.0-preview.1}
    environment:
      SERVICE_NAME: voice
      PORT: 8080
      DATABASE_URL: postgres://voice_user:${LIFE_OS_VOICE_DB_PASSWORD}@postgres:5432/voice_db?sslmode=disable
      VOICE_STORAGE_DIR: /var/lib/lifeos/voice
      VOICE_RETENTION_HOURS: ${LIFE_OS_VOICE_RETENTION_HOURS:-168}
      VOICE_MAX_UPLOAD_BYTES: ${LIFE_OS_VOICE_MAX_UPLOAD_BYTES:-26214400}
      ACTIVITY_SERVICE_URL: http://activity:8080
    volumes:
      - voice-audio:/var/lib/lifeos/voice
    expose:
      - '8080'
    depends_on:
      voice-migrate:
        condition: service_completed_successfully
    networks:
      - backend
    restart: unless-stopped

  voice-worker:
    image: ${LIFE_OS_IMAGE_REGISTRY:-ghcr.io/gamch1k}/life-os-voice:${LIFE_OS_VERSION:?Set LIFE_OS_VERSION in .env to the Life OS release to run, such as v0.1.0-preview.1}
    entrypoint:
      - /worker
    environment:
      SERVICE_NAME: voice-worker
      DATABASE_URL: postgres://voice_user:${LIFE_OS_VOICE_DB_PASSWORD}@postgres:5432/voice_db?sslmode=disable
      VOICE_STORAGE_DIR: /var/lib/lifeos/voice
      VOICE_RETENTION_HOURS: ${LIFE_OS_VOICE_RETENTION_HOURS:-168}
      INBOX_SERVICE_URL: http://inbox:8080
      WHISPER_SERVICE_URL: http://whisper:8080
      ACTIVITY_SERVICE_URL: http://activity:8080
      VOICE_WORKER_POLL_MILLIS: ${LIFE_OS_VOICE_WORKER_POLL_MILLIS:-1000}
      VOICE_WORKER_MAX_ATTEMPTS: ${LIFE_OS_VOICE_WORKER_MAX_ATTEMPTS:-3}
      VOICE_WORKER_LEASE_SECONDS: ${LIFE_OS_VOICE_WORKER_LEASE_SECONDS:-120}
      VOICE_WORKER_RETRY_BACKOFF_SECONDS: ${LIFE_OS_VOICE_WORKER_RETRY_BACKOFF_SECONDS:-60}
    volumes:
      - voice-audio:/var/lib/lifeos/voice
    depends_on:
      voice-migrate:
        condition: service_completed_successfully
      inbox:
        condition: service_started
      whisper:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  gateway:
    image: ${LIFE_OS_IMAGE_REGISTRY:-ghcr.io/gamch1k}/life-os-gateway:${LIFE_OS_VERSION:?Set LIFE_OS_VERSION in .env to the Life OS release to run, such as v0.1.0-preview.1}
    environment:
      NGINX_ENVSUBST_FILTER: ^LIFE_OS_
      LIFE_OS_PUBLIC_HOSTNAME: ${LIFE_OS_PUBLIC_HOSTNAME:-}
      LIFE_OS_GATEWAY_BIND_ADDRESS: ${LIFE_OS_GATEWAY_BIND_ADDRESS:-127.0.0.1}
    volumes:
      - type: bind
        source: ${LIFE_OS_ANDROID_RELEASES_DIR:-${HOME}/life-os.android}
        target: /srv/android
        read_only: true
        bind:
          create_host_path: true
    ports:
      - ${LIFE_OS_GATEWAY_BIND_ADDRESS:-127.0.0.1}:${LIFE_OS_GATEWAY_PORT:-3000}:80
    depends_on:
      dashboard:
        condition: service_started
      finance:
        condition: service_started
      tasks:
        condition: service_started
      inbox:
        condition: service_started
      calendar:
        condition: service_started
      mcp:
        condition: service_started
      voice:
        condition: service_started
      activity:
        condition: service_started
      notifications:
        condition: service_started
      banking:
        condition: service_started
      google-calendar:
        condition: service_started
      calendar-feeds:
        condition: service_started
      food:
        condition: service_started
      recipe-import:
        condition: service_started
    networks:
      - backend
      - edge
    restart: unless-stopped

  ntfy:
    image: ${LIFE_OS_NTFY_IMAGE:-binwiederhier/ntfy:v2.37.2@sha256:1875ddcf815c8a3c981d6d78c67a93452d0abba79b1ab9520b1f5f5238902bd7}
    profiles:
      - ntfy
    command:
      - serve
    environment:
      NTFY_BASE_URL: ${LIFE_OS_NTFY_PUBLIC_URL:-}
      NTFY_AUTH_USERS: lifeos-publisher:${LIFE_OS_NTFY_PUBLISHER_PASSWORD_HASH:-}:user,lifeos-phone:${LIFE_OS_NTFY_PHONE_PASSWORD_HASH:-}:user
      NTFY_AUTH_ACCESS: lifeos-publisher:${LIFE_OS_NTFY_TOPIC:-lifeos}:write-only,lifeos-phone:${LIFE_OS_NTFY_TOPIC:-lifeos}:read-only
      NTFY_AUTH_TOKENS: lifeos-publisher:${LIFE_OS_NTFY_PUBLISHER_TOKEN:-}:notifications-service
      NTFY_LISTEN_HTTP: :80
      NTFY_BEHIND_PROXY: 'true'
      NTFY_PROXY_FORWARDED_HEADER: CF-Connecting-IP
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_CACHE_DURATION: 12h
      NTFY_AUTH_FILE: /var/lib/ntfy/user.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_ENABLE_SIGNUP: 'false'
      NTFY_ENABLE_LOGIN: 'false'
      NTFY_ENABLE_RESERVATIONS: 'false'
      NTFY_WEB_ROOT: disable
      NTFY_VISITOR_REQUEST_LIMIT_BURST: '60'
      NTFY_VISITOR_REQUEST_LIMIT_REPLENISH: 5s
      NTFY_VISITOR_SUBSCRIPTION_LIMIT: '10'
      NTFY_VISITOR_MESSAGE_DAILY_LIMIT: '500'
      NTFY_LOG_LEVEL: info
    volumes:
      - ntfy-data:/var/lib/ntfy
    expose:
      - '80'
    networks:
      - notify-edge
      - notify-internal
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:80/v1/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  cloudflared:
    image: ${LIFE_OS_CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2026.10.7@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba}
    profiles:
      - cloudflare
    command:
      - tunnel
      - --metrics
      - 127.0.0.1:20241
      - --management-diagnostics=false
      - run
    environment:
      TUNNEL_TOKEN: ${LIFE_OS_CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      gateway:
        condition: service_started
    networks:
      - edge
      - notify-edge
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - cloudflared
        - tunnel
        - --metrics
        - 127.0.0.1:20241
        - ready
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  backend:
    name: lifeos-backend
    driver: bridge

  edge:
    name: lifeos-edge
    driver: bridge
    ipam:
      config:
        - subnet: 10.255.249.0/29

  notify-edge:
    name: lifeos-notify-edge
    driver: bridge
    ipam:
      config:
        - subnet: 10.255.249.16/29

  notify-internal:
    name: lifeos-notify-internal
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.255.249.32/29

  host-docker:
    name: lifeos-host-docker
    driver: bridge
    internal: true

volumes:
  postgres-data:
    name: lifeos-postgres-data

  whisper-models:
    name: lifeos-whisper-models

  voice-audio:
    name: lifeos-voice-audio

  inbox-media:
    name: lifeos-inbox-media

  ntfy-data:
    name: lifeos-ntfy-data
