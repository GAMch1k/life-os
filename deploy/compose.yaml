    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LIFE_OS_POSTGRES_DB:-postgres}
      POSTGRES_USER: ${LIFE_OS_POSTGRES_USER:?Set LIFE_OS_POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${LIFE_OS_POSTGRES_PASSWORD:?Set LIFE_OS_POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  postgres-provision:
    image: ${LIFE_OS_IMAGE_REGISTRY:-ghcr.io/gamch1k}/life-os-postgres-provision:${LIFE_OS_VERSION:?Set LIFE_OS_VERSION in .env to the Life OS release to run, such as v0.1.0-preview.1}
    environment:
      PGHOST: postgres
      PGPASSWORD: ${LIFE_OS_POSTGRES_PASSWORD:?Set LIFE_OS_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${LIFE_OS_POSTGRES_DB:-postgres}
      POSTGRES_USER: ${LIFE_OS_POSTGRES_USER:?Set LIFE_OS_POSTGRES_USER in .env}
      LIFE_OS_FINANCE_DB_PASSWORD: ${LIFE_OS_FINANCE_DB_PASSWORD:-}
      LIFE_OS_TASKS_DB_PASSWORD: ${LIFE_OS_TASKS_DB_PASSWORD:-}
      LIFE_OS_INBOX_DB_PASSWORD: ${LIFE_OS_INBOX_DB_PASSWORD:-}
      LIFE_OS_CALENDAR_DB_PASSWORD: ${LIFE_OS_CALENDAR_DB_PASSWORD:-}
      LIFE_OS_VOICE_DB_PASSWORD: ${LIFE_OS_VOICE_DB_PASSWORD:-}
      LIFE_OS_ACTIVITY_DB_PASSWORD: ${LIFE_OS_ACTIVITY_DB_PASSWORD:-}
      LIFE_OS_NOTIFICATIONS_DB_PASSWORD: ${LIFE_OS_NOTIFICATIONS_DB_PASSWORD:-}
      LIFE_OS_BANKING_DB_PASSWORD: ${LIFE_OS_BANKING_DB_PASSWORD:-}
