      LIFE_OS_FOOD_DB_PASSWORD: ${LIFE_OS_FOOD_DB_PASSWORD:-}
      LIFE_OS_BACKUP_DB_PASSWORD: ${LIFE_OS_BACKUP_DB_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    restart: 'no'
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  finance-migrate:
    image: ${LIFE_OS_IMAGE_REGISTRY:-ghcr.io/gamch1k}/life-os-migrate:${LIFE_OS_VERSION:?Set LIFE_OS_VERSION in .env to the Life OS release to run, such as v0.1.0-preview.1}
