# Disposable verification overlay. It uses isolated Docker resource names and
# publishes no host ports, so it can validate a clean migration path without
# touching a developer's running stack or persistent data.
name: lifeos-verify

services:
  postgres:
    ports: !reset []
  finance:
    image: lifeos-finance:latest
    ports: !reset []
  tasks:
    image: lifeos-tasks:latest
    ports: !reset []
  inbox:
    image: lifeos-inbox:latest
    ports: !reset []
  calendar:
    image: lifeos-calendar:latest
    ports: !reset []
  # Never the owner's ZAW feed (tools/verify-compose blanks it and refuses a
  # plan that sets it): it would mix their real waste calendar into tests.
  calendar-feeds:
    image: lifeos-calendar-feeds:latest
    ports: !reset []
    environment:
      LIFE_OS_ZAW_ICS_URL: ""
  activity:
    image: lifeos-activity:latest
    ports: !reset []
  notifications:
    image: lifeos-notifications:latest
    ports: !reset []
  # Never the owner's bank: no Enable Banking credentials, an empty key, and
  # an API address that resolves nowhere (tools/verify-compose refuses a
  # plan with any of them set). Browser tests stub the bank in the page.
  banking:
    image: lifeos-banking:latest
    ports: !reset []
    environment:
      LIFE_OS_ENABLE_BANKING_APP_ID: ""
      LIFE_OS_BANKING_TOKEN_KEY: ""
      ENABLE_BANKING_API_URL: "http://enablebanking.invalid"
    volumes: !override
      - type: bind
        source: /dev/null
        target: /run/secrets/enablebanking.pem
        read_only: true
  dashboard:
    image: lifeos-dashboard:latest
    ports: !reset []
  # Evaluates the status but notifies nothing, so the browser suite's
  # notification counts stay its own.
  monitor:
    image: lifeos-monitor:latest
    environment:
      NOTIFICATIONS_SERVICE_URL: ""
  mcp:
    image: lifeos-mcp:latest
  processor:
    image: lifeos-processor:latest
  whisper:
    image: lifeos-whisper:latest
  voice:
    image: lifeos-voice:latest
  voice-worker:
    image: lifeos-voice-worker:latest
  gateway:
    ports: !override ["127.0.0.1:13001:80"]

networks:
  backend:
    name: lifeos-verify-backend
  edge:
    name: lifeos-verify-edge
    ipam:
      config: !override
        - subnet: 10.255.249.8/29
  notify-edge:
    name: lifeos-verify-notify-edge
    ipam:
      config: !override
        - subnet: 10.255.249.24/29
  notify-internal:
    name: lifeos-verify-notify-internal
    ipam:
      config: !override
        - subnet: 10.255.249.40/29

volumes:
  postgres-data:
    name: lifeos-verify-postgres-data
  whisper-models:
    name: lifeos-verify-whisper-models
  voice-audio:
    name: lifeos-verify-voice-audio
  ntfy-data:
    name: lifeos-verify-ntfy-data
