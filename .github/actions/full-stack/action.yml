# The full-stack tests (docs/operations/ci.md#full-stack-tests): builds every
# image once (docker compose build: lifeos-<service>, as on a server), then
# runs the smokes and the browser suite (without the @codex tests) against
# those images on the disposable verification stack. CI's full-stack job and
# the release (release.yml, which then scans and publishes these very images)
# both run it, after actions/checkout. It needs no secret and signs in to no
# AI. Every smoke runs, even after another one failed; the step fails when one
# did, and a failed run's compose logs and Playwright report are uploaded.
# With modules: core it tests the core alone, as a fresh install runs it
# (docs/architecture/modules.md): only the core's images, no optional module
# on the verification stack, and no workaround for names that resolve slowly.
name: Full-stack tests
description: Build every image, then run the smokes and the browser suite on the verification stack.

inputs:
  node-version:
    description: The Node.js version for Playwright (the Dashboard image's).
    required: true
  modules:
    description: >-
      all: every optional module the verification stack runs (all but the
      Cloudflare connector and ntfy), every image built; core: the core alone.
    required: false
    default: all

runs:
  using: composite
  steps:
    - name: Show the runner
      shell: bash
      env:
        MODULES: ${{ inputs.modules }}
      run: |
        case "$MODULES" in
          # The verification stack's Whisper reads the model from the Actions
          # cache (LIFE_OS_WHISPER_MODELS_DIR, set below) instead of
          # downloading it at every start.
          all) echo "LIFE_OS_VERIFY_OVERLAYS=tools/fixtures/whisper-models.compose.yaml" >>"$GITHUB_ENV" ;;
          # tools/verify-compose: an empty list is the core alone.
          core) echo "LIFE_OS_VERIFY_MODULES=" >>"$GITHUB_ENV" ;;
          *) echo "::error::modules is all or core, not $MODULES"; exit 1 ;;
        esac
        echo "PLAYWRIGHT_HTML_OPEN=never" >>"$GITHUB_ENV"
        echo "Modules: $MODULES"
        echo "$(nproc) CPUs"
        free -h
        df -h /
        docker version --format 'Docker {{.Server.Version}}'
        docker compose version
    # The runner's systemd-resolved answers SERVFAIL for a single-label name
    # it does not know, such as a service that is not running, and the
    # Alpine (musl) images wait 10 s on SERVFAIL before they give up. Home
    # probes such services (the processor, which never starts here, and
    # those make life-smoke leaves out), and those waits filled Node's DNS
    # threads until the Dashboard's requests to running services timed out
    # too. With single-label names sent upstream, the answer is NXDOMAIN at
    # once, as on a usual host. The core-only run leaves the runner's
    # resolver as it is: with only the core on, nothing may look up a service
    # that is not there (BUG-50).
    - name: Answer unknown service names at once
      if: inputs.modules != 'core'
      shell: bash
      run: |
        sudo mkdir -p /etc/systemd/resolved.conf.d
        printf '[Resolve]\nResolveUnicastSingleLabel=yes\n' | sudo tee /etc/systemd/resolved.conf.d/lifeos-ci.conf
        sudo systemctl restart systemd-resolved
    # Throwaway passwords, no integration, and an empty Codex home: no
    # secret and no AI sign-in. Never uploaded or committed.
    - name: Write a throwaway .env
      shell: bash
      run: tools/ci-env "$RUNNER_TEMP/lifeos-ci"

    # Whisper runs only with the voice module.
    - name: Find the Whisper model
      if: inputs.modules != 'core'
      id: whisper
      shell: bash
      run: |
        url=$(sed -n 's/^LIFE_OS_WHISPER_MODEL_URL=//p' .env | tail -n 1)
        model=$(sed -n 's/^LIFE_OS_WHISPER_MODEL_PATH=//p' .env | tail -n 1)
        file=${model##*/}
        if [[ -z "$url" || "$model" != "/models/$file" ]]; then
          echo "::error file=.env.example::The Whisper model must be a file in /models with a download URL (LIFE_OS_WHISPER_MODEL_PATH, LIFE_OS_WHISPER_MODEL_URL)."
          exit 1
        fi
        {
          echo "url=$url"
          echo "file=$file"
          echo "key=whisper-model-$file-$(printf '%s' "$url" | sha256sum | cut -c 1-16)"
        } >>"$GITHUB_OUTPUT"
        echo "LIFE_OS_WHISPER_MODELS_DIR=$RUNNER_TEMP/whisper-models" >>"$GITHUB_ENV"
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.modules != 'core'
      id: whisper-cache
      with:
        path: ${{ runner.temp }}/whisper-models
        key: ${{ steps.whisper.outputs.key }}
    - name: Download the Whisper model
      if: inputs.modules != 'core' && steps.whisper-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        MODEL_URL: ${{ steps.whisper.outputs.url }}
        MODEL_FILE: ${{ steps.whisper.outputs.file }}
      run: |
        mkdir -p "$LIFE_OS_WHISPER_MODELS_DIR"
        curl --fail --silent --show-error --location --retry 3 --output "$LIFE_OS_WHISPER_MODELS_DIR/$MODEL_FILE.part" "$MODEL_URL"
        mv "$LIFE_OS_WHISPER_MODELS_DIR/$MODEL_FILE.part" "$LIFE_OS_WHISPER_MODELS_DIR/$MODEL_FILE"
    # Saved at once, so a failed run keeps it too.
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.modules != 'core' && steps.whisper-cache.outputs.cache-hit != 'true'
      with:
        path: ${{ runner.temp }}/whisper-models
        key: ${{ steps.whisper.outputs.key }}
    # Whisper runs as nobody.
    - if: inputs.modules != 'core'
      shell: bash
      run: chmod 755 "$LIFE_OS_WHISPER_MODELS_DIR" && chmod 644 "$LIFE_OS_WHISPER_MODELS_DIR"/* && ls -l "$LIFE_OS_WHISPER_MODELS_DIR"

    # Composite steps have no timeout-minutes: timeout(1) bounds each long
    # step instead.
    # Every module's (COMPOSE_PROFILES names them all; .env, as the
    # release's .env.example, has the core alone), as the release publishes
    # every image; the core-only run builds the core's.
    - name: Build the images
      id: build
      shell: bash
      env:
        MODULES: ${{ inputs.modules }}
      run: |
        . tools/lib/modules.bash
        profiles=$(IFS=,; printf '%s' "${module_ids[*]}")
        [[ "$MODULES" != core ]] || profiles=
        COMPOSE_PROFILES=$profiles timeout --kill-after=1m 30m docker compose build --pull

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: apps/dashboard/package-lock.json
    - shell: bash
      run: npm ci --prefix apps/dashboard --no-audit --no-fund
    - name: Install Playwright's Chromium and Firefox
      id: playwright
      shell: bash
      working-directory: apps/dashboard
      # The browsers' system packages come through apt. On 2026-11-11 the
      # Ubuntu mirrors' names stopped resolving on the runners for hours
      # (Azure's first, then Ubuntu's own), and apt retried them for 45
      # minutes. Then the browsers install without them: the runner image
      # has the libraries its own Chrome and Firefox need, and the browser
      # suite fails if one is missing.
      run: |
        if timeout 20 getent hosts archive.ubuntu.com >/dev/null; then
          if ! timeout 20 getent hosts azure.archive.ubuntu.com >/dev/null; then
            echo '::warning::azure.archive.ubuntu.com does not resolve: apt uses the next mirror'
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          fi
          if timeout 15m npx playwright install --with-deps chromium firefox; then
            exit 0
          fi
        fi
        echo "::warning::apt could not install the browsers' system packages: the browsers install without them"
        timeout 10m npx playwright install chromium firefox

    # Each smoke brings the verification stack (tools/verify-compose,
    # project lifeos-verify) up and removes it again; LIFE_OS_VERIFY_LOGS_DIR
    # keeps its containers' logs. Every smoke runs, even after another failed.
    - name: Core and Dashboard smokes (make life-smoke)
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      shell: bash
      env:
        LIFE_OS_VERIFY_LOGS_DIR: ${{ runner.temp }}/compose-logs/life-smoke
      run: timeout --kill-after=1m 10m make life-smoke
    - name: End-to-end core smoke (tools/smoke-e2e)
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      shell: bash
      env:
        LIFE_OS_VERIFY_LOGS_DIR: ${{ runner.temp }}/compose-logs/smoke-e2e
      run: timeout --kill-after=1m 10m tools/smoke-e2e
    - name: Database isolation on a clean database (make verify-clean-db)
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      shell: bash
      env:
        LIFE_OS_VERIFY_LOGS_DIR: ${{ runner.temp }}/compose-logs/verify-clean-db
      run: timeout --kill-after=1m 10m make verify-clean-db
    - name: Idempotent replays (tools/smoke-action-idempotency)
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      shell: bash
      env:
        LIFE_OS_VERIFY_LOGS_DIR: ${{ runner.temp }}/compose-logs/smoke-action-idempotency
      run: timeout --kill-after=1m 10m tools/smoke-action-idempotency
    - name: The gateway follows recreated services (tools/smoke-gateway-recreate)
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      shell: bash
      env:
        LIFE_OS_VERIFY_LOGS_DIR: ${{ runner.temp }}/compose-logs/smoke-gateway-recreate
      run: timeout --kill-after=1m 10m tools/smoke-gateway-recreate
    - name: Accounts end to end (tools/smoke-accounts)
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      shell: bash
      env:
        LIFE_OS_VERIFY_LOGS_DIR: ${{ runner.temp }}/compose-logs/smoke-accounts
      run: timeout --kill-after=1m 10m tools/smoke-accounts
    - name: Voice worker crash recovery (tools/smoke-voice-lease-recovery)
      if: ${{ !cancelled() && steps.build.outcome == 'success' && inputs.modules != 'core' }}
      shell: bash
      env:
        LIFE_OS_VERIFY_LOGS_DIR: ${{ runner.temp }}/compose-logs/smoke-voice-lease-recovery
      run: timeout --kill-after=1m 10m tools/smoke-voice-lease-recovery
    # Without the tests that need the real Codex (@codex).
    - name: Browser suite (tools/browser-e2e)
      if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.playwright.outcome == 'success' }}
      shell: bash
      env:
        LIFE_OS_VERIFY_LOGS_DIR: ${{ runner.temp }}/compose-logs/browser-e2e
      run: timeout --kill-after=1m 30m tools/browser-e2e --grep-invert @codex --reporter=list,html

    # Before the upload, so that the logs of a stack a failed smoke left up
    # are kept too.
    - name: Tear down the verification stack
      if: always()
      shell: bash
      env:
        LIFE_OS_VERIFY_LOGS_DIR: ${{ runner.temp }}/compose-logs/left-up
      run: |
        if [[ -f .env ]]; then LIFE_OS_VERIFY_OVERLAYS='' ./tools/verify-compose down --volumes --remove-orphans; fi
        docker rm --force lifeos-verify-ip-hold >/dev/null 2>&1 || true
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: failure()
      with:
        name: compose-logs${{ inputs.modules == 'core' && '-core' || '' }}
        path: ${{ runner.temp }}/compose-logs/
        retention-days: 7
        if-no-files-found: ignore
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: failure()
      with:
        name: playwright${{ inputs.modules == 'core' && '-core' || '' }}
        path: |
          apps/dashboard/test-results/
          apps/dashboard/playwright-report/
        retention-days: 7
        if-no-files-found: ignore
