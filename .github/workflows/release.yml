# Releases (docs/operations/releases.md). A pushed v* tag builds every image
# once, runs the full-stack tests against those images, and scans them with
# Trivy; then it publishes them as ghcr.io/gamch1k/life-os-<name>:<tag> (and
# the moving tag: preview for a -preview.N release, latest for a stable one),
# signs each with cosign (keyless, GitHub's OIDC token), attests its build
# provenance and its SBOM, and creates the GitHub Release with the install
# bundle (compose.yaml, .env.example, setup.sh, SHA256SUMS).
#
# Every other run is a dry run: it builds, tests, and scans the images and
# assembles the bundle, and publishes, signs, and releases nothing. It runs
# by hand (Actions → Release → Run workflow) and on a branch push that
# changes the release's own files. Images never come from a pull request, a
# fork, or anywhere but a tag of GAMch1k/life-os.
name: Release

on:
  push:
    tags: ["v*"]
    branches: ["**", "!dependabot/**"]
    # GitHub does not apply paths to tags: every v* tag runs.
    paths:
      - .github/workflows/release.yml
      - .github/actions/full-stack/**
      - .github/trivy-allowlist.yaml
      - tools/build-install-bundle
      - tools/scan-images
  workflow_dispatch:

permissions:
  contents: read

# A newer push replaces a branch's dry run; a release always runs to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  # The images' platforms, each built and tested on a runner of its own
  # (amd64: ubuntu-24.04, arm64: ubuntu-24.04-arm). Adding arm64 is this
  # line: '["amd64", "arm64"]'.
  RELEASE_PLATFORMS: '["amd64"]'
  REGISTRY: ghcr.io/gamch1k
  # As ci.yml: Node as the Dashboard's image (node:22-alpine).
  NODE_VERSION: "22"
  NEXT_TELEMETRY_DISABLED: "1"
  # Trivy, the release binary, checked against its SHA-256.
  TRIVY_VERSION: 0.76.2
  TRIVY_SHA256_AMD64: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
  TRIVY_SHA256_ARM64: ab9d51f86e6a5fb936f605faff6b593ac51bc378fff4d3e8b9d58358b9c367c3

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan the release
    # Never in a fork: its images are not Life OS's.
    if: github.repository == 'GAMch1k/life-os'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      moving-tag: ${{ steps.plan.outputs.moving-tag }}
      platforms: ${{ steps.plan.outputs.platforms }}
      images: ${{ steps.images.outputs.images }}
      sboms: ${{ steps.images.outputs.sboms }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide what this run releases
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [[ "$EVENT" == push && "$REF_TYPE" == tag ]]; then
            version=$REF_NAME
            if [[ ! "$version" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Tag ${version} is not a release version such as v0.1.0 or v0.1.0-preview.1 (docs/operations/releases.md)."
              exit 1
            fi
            publish=true
          else
            version=v0.0.0-dry-run.$RUN_NUMBER
            publish=false
          fi
          # One version for the whole stack. A -preview.N release also moves
          # preview, a stable one latest; other pre-releases move nothing.
          case "$version" in
            *-preview.*) prerelease=true moving=preview ;;
            *-*) prerelease=true moving= ;;
            *) prerelease=false moving=latest ;;
          esac
          {
            echo "version=$version"
            echo "publish=$publish"
            echo "prerelease=$prerelease"
            echo "moving-tag=$moving"
            echo "platforms=$(jq -c . <<<"$RELEASE_PLATFORMS")"
          } >>"$GITHUB_OUTPUT"
          echo "### ${version}: $([[ $publish == true ]] && echo release || echo dry run, nothing is published)" >>"$GITHUB_STEP_SUMMARY"
      - name: Check deploy/compose.yaml is current (tools/build-install-bundle --check)
        run: tools/build-install-bundle --check
      - name: List the images
        id: images
        run: |
          images=$(tools/build-install-bundle --images | jq -R -s -c 'split("\n") | map(select(length > 0) | split(" ") | {local: .[0], name: .[1]})')
          echo "images=$images" >>"$GITHUB_OUTPUT"
          # The SBOM attestations: every image on every platform.
          echo "sboms=$(jq -c --argjson platforms "$RELEASE_PLATFORMS" '[.[] as $image | $platforms[] | $image + {platform: .}]' <<<"$images")" >>"$GITHUB_OUTPUT"
          jq -r '.[] | "- `\(.local)` → `\(.name)`"' <<<"$images" >>"$GITHUB_STEP_SUMMARY"
      - name: Assemble the install bundle
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          PUBLISH: ${{ steps.plan.outputs.publish }}
        run: |
          allow=()
          [[ "$PUBLISH" == true ]] || allow=(--allow-missing-setup)
          tools/build-install-bundle --assets "$RUNNER_TEMP/bundle" --version "$VERSION" "${allow[@]}"
          (cd "$RUNNER_TEMP/bundle" && sha256sum --check SHA256SUMS && ls -la)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: ${{ runner.temp }}/bundle/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  build:
    name: Build, test, and scan (${{ matrix.platform }})
    needs: plan
    strategy:
      matrix:
        platform: ${{ fromJSON(needs.plan.outputs.platforms) }}
    runs-on: ${{ matrix.platform == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    # CI's full-stack job takes 14 to 19 minutes; the scan and the image
    # archive add about 10.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Exactly CI's full-stack job: these images, tested.
      - uses: ./.github/actions/full-stack
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Trivy
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          case "$PLATFORM" in
            amd64) asset=Linux-64bit sha256=$TRIVY_SHA256_AMD64 ;;
            arm64) asset=Linux-ARM64 sha256=$TRIVY_SHA256_ARM64 ;;
            *) echo "::error::No Trivy for ${PLATFORM}"; exit 1 ;;
          esac
          archive="$RUNNER_TEMP/trivy.tar.gz"
          curl -fsSL --retry 3 -o "$archive" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_${asset}.tar.gz"
          echo "${sha256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" trivy
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      # Once, with retries: the registries that serve it rate-limit at times.
      - name: Download Trivy's vulnerability database
        run: |
          for attempt in 1 2 3 4 5; do
            trivy image --download-db-only --quiet && exit 0
            echo "::warning::Trivy's database download failed (attempt ${attempt}); retrying"
            sleep $((attempt * 20))
          done
          exit 1
      - name: Scan the images (tools/scan-images)
        env:
          IMAGES: ${{ needs.plan.outputs.images }}
          TRIVY_SKIP_DB_UPDATE: "true"
        run: |
          mapfile -t locals < <(jq -r '.[].local' <<<"$IMAGES")
          tools/scan-images --sbom-dir "$RUNNER_TEMP/sboms" "${locals[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sboms-${{ matrix.platform }}
          path: ${{ runner.temp }}/sboms/
          retention-days: 7
          if-no-files-found: error

      # The tested images themselves, to the publish job: it has the write
      # access this job has not.
      - name: Save the images
        if: needs.plan.outputs.publish == 'true'
        env:
          IMAGES: ${{ needs.plan.outputs.images }}
        run: |
          mapfile -t locals < <(jq -r '.[].local' <<<"$IMAGES")
          mkdir -p "$RUNNER_TEMP/images"
          for image in "${locals[@]}"; do
            printf '%s %s\n' "$image" "$(docker image inspect --format '{{.Id}}' "$image")"
          done >"$RUNNER_TEMP/images/ids.txt"
          docker save "${locals[@]}" | zstd -T0 -6 -o "$RUNNER_TEMP/images/images.tar.zst"
          ls -la "$RUNNER_TEMP/images"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.plan.outputs.publish == 'true'
        with:
          name: release-images-${{ matrix.platform }}
          path: ${{ runner.temp }}/images/
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  publish:
    name: Publish and sign the images
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digests: ${{ steps.push.outputs.digests }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      MOVING_TAG: ${{ needs.plan.outputs.moving-tag }}
      IMAGES: ${{ needs.plan.outputs.images }}
      PLATFORMS: ${{ needs.plan.outputs.platforms }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-images-*
          path: ${{ runner.temp }}/images
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: ${{ runner.temp }}/bundle
      - name: Sign in to ghcr.io
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
      # Each platform's tested images, loaded one platform at a time (their
      # local names are the same) and pushed as <version>-<platform>; then
      # <version> (and the moving tag) becomes the index of every platform.
      - name: Push the images
        id: push
        run: |
          mapfile -t platforms < <(jq -r '.[]' <<<"$PLATFORMS")
          for platform in "${platforms[@]}"; do
            dir="$RUNNER_TEMP/images/release-images-$platform"
            zstd -dc "$dir/images.tar.zst" | docker load --quiet
            while read -r local id; do
              actual=$(docker image inspect --format '{{.Id}}' "$local")
              if [[ "$actual" != "$id" ]]; then
                echo "::error::${local} for ${platform} is ${actual}, not the tested ${id}"
                exit 1
              fi
            done <"$dir/ids.txt"
            while IFS=$'\t' read -r local name; do
              docker tag "$local" "$REGISTRY/$name:$VERSION-$platform"
              docker push --quiet "$REGISTRY/$name:$VERSION-$platform"
            done < <(jq -r '.[] | [.local, .name] | @tsv' <<<"$IMAGES")
            jq -r '.[].local' <<<"$IMAGES" | xargs docker image rm --force >/dev/null
          done
          digests='{}'
          echo '| Image | Digest |' >>"$GITHUB_STEP_SUMMARY"
          echo '| --- | --- |' >>"$GITHUB_STEP_SUMMARY"
          while read -r name; do
            tags=(--tag "$REGISTRY/$name:$VERSION")
            [[ -z "$MOVING_TAG" ]] || tags+=(--tag "$REGISTRY/$name:$MOVING_TAG")
            sources=()
            for platform in "${platforms[@]}"; do sources+=("$REGISTRY/$name:$VERSION-$platform"); done
            docker buildx imagetools create "${tags[@]}" "${sources[@]}"
            digest=$(docker buildx imagetools inspect "$REGISTRY/$name:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
            [[ "$digest" == sha256:* ]] || { echo "::error::No digest for ${name}"; exit 1; }
            digests=$(jq -c --arg name "$name" --arg digest "$digest" '. + {($name): $digest}' <<<"$digests")
            printf '%s  %s\n' "${digest#sha256:}" "$REGISTRY/$name" >>"$RUNNER_TEMP/subjects.txt"
            echo "| \`$REGISTRY/$name:$VERSION\` | \`$digest\` |" >>"$GITHUB_STEP_SUMMARY"
          done < <(jq -r '.[].name' <<<"$IMAGES")
          echo "digests=$digests" >>"$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/subjects.txt"

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      # Keyless: the certificate names this workflow and the tag; the
      # signature goes to the registry and the transparency log (Rekor).
      # --recursive signs each platform's image under the index too.
      - name: Sign the images (cosign)
        env:
          DIGESTS: ${{ steps.push.outputs.digests }}
        run: |
          mapfile -t references < <(jq -r --arg registry "$REGISTRY" 'to_entries[] | "\($registry)/\(.key)@\(.value)"' <<<"$DIGESTS")
          cosign sign --yes --recursive "${references[@]}"
      # One attestation for every image (its subjects), kept by GitHub:
      # gh attestation verify oci://… -R GAMch1k/life-os finds it.
      - name: Attest the images' build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/subjects.txt
      # And the bundle's files: gh attestation verify compose.yaml -R GAMch1k/life-os.
      - name: Attest the install bundle's build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/bundle/compose.yaml
            ${{ runner.temp }}/bundle/.env.example
            ${{ runner.temp }}/bundle/setup.sh
      - name: Sign out of ghcr.io
        if: always()
        run: docker logout ghcr.io

  sbom:
    name: Attest the SBOM of ${{ matrix.image.name }} (${{ matrix.image.platform }})
    needs: [plan, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.sboms) }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-sboms-${{ matrix.image.platform }}
          path: ${{ runner.temp }}/sboms
      - name: Sign in to ghcr.io
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
      # Trivy's CycloneDX SBOM of the tested image, attested to the
      # published one (the platform's SBOM, on the version's digest), kept
      # by GitHub and pushed to the registry beside the image.
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ matrix.image.name }}
          subject-digest: ${{ fromJSON(needs.publish.outputs.digests)[matrix.image.name] }}
          sbom-path: ${{ runner.temp }}/sboms/${{ matrix.image.local }}.cdx.json
          push-to-registry: true
      - name: Sign out of ghcr.io
        if: always()
        run: docker logout ghcr.io

  release:
    name: Create the GitHub Release
    needs: [plan, publish, sbom]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
      PLATFORMS: ${{ needs.plan.outputs.platforms }}
      DIGESTS: ${{ needs.publish.outputs.digests }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: ${{ runner.temp }}/bundle
      # ghcr.io makes a new package private or public by its own rules, and
      # no API changes it (docs/operations/releases.md#package-visibility).
      # An image anyone can pull answers an anonymous token request.
      - name: Check every image is public
        id: visibility
        run: |
          private=()
          while read -r name; do
            token=$(curl -fsS "https://ghcr.io/token?scope=repository:${REGISTRY#ghcr.io/}/${name}:pull" | jq -r '.token // empty' || true)
            if [[ -z "$token" ]] || ! curl -fsS -o /dev/null \
                -H "Authorization: Bearer $token" \
                -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
                "https://ghcr.io/v2/${REGISTRY#ghcr.io/}/${name}/manifests/${VERSION}"; then
              private+=("$name")
            fi
          done < <(jq -r 'keys[]' <<<"$DIGESTS")
          if ((${#private[@]})); then
            {
              echo "### Private packages: the release stays a draft"
              echo "Make each public (Package settings → Danger Zone → Change visibility → Public), then publish the draft release:"
              for name in "${private[@]}"; do
                echo "- [${name}](https://github.com/users/GAMch1k/packages/container/${name}/settings)"
              done
            } >>"$GITHUB_STEP_SUMMARY"
            echo "::warning::${#private[@]} package(s) are private: ${private[*]}. The release is created as a draft; see the run's summary."
            echo "draft=true" >>"$GITHUB_OUTPUT"
          else
            echo "draft=false" >>"$GITHUB_OUTPUT"
          fi
      - name: Write the release notes
        run: |
          platforms=$(jq -r 'map("linux/" + .) | join(", ")' <<<"$PLATFORMS")
          {
            cat <<EOF
          > [!WARNING]
          > **Early preview. Life OS has no login of its own yet:** anyone who can reach it can read and change everything in it. Run it only behind a VPN (such as WireGuard or Tailscale) or an access proxy (such as Cloudflare Access), keep the gateway on 127.0.0.1 or a VPN address (\`LIFE_OS_GATEWAY_BIND_ADDRESS\`), and never expose it to the internet.

          ## Install

          Download \`compose.yaml\`, \`.env.example\`, \`setup.sh\`, and \`SHA256SUMS\` into an empty directory, then:

          \`\`\`sh
          sha256sum --check SHA256SUMS
          ./setup.sh
          docker compose up -d
          \`\`\`

          \`setup.sh\` writes \`.env\` with generated passwords and keys and this version (\`LIFE_OS_VERSION=${VERSION}\`). See [docs/install](https://github.com/${GH_REPO}/tree/${VERSION}/docs/install).

          ## Images

          One version for the whole stack, ${platforms}, from \`${REGISTRY}\`. Each is signed with cosign (keyless) and has build provenance and an SBOM attestation.

          | Image | Digest |
          | --- | --- |
          EOF
            jq -r --arg registry "$REGISTRY" --arg version "$VERSION" 'to_entries[] | "| `\($registry)/\(.key):\($version)` | `\(.value)` |"' <<<"$DIGESTS"
            cat <<EOF

          ## Verify

          \`\`\`sh
          cosign verify ${REGISTRY}/life-os-tasks:${VERSION} \\
            --certificate-identity-regexp '^https://github.com/GAMch1k/life-os/' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          gh attestation verify oci://${REGISTRY}/life-os-tasks:${VERSION} -R GAMch1k/life-os
          gh attestation verify oci://${REGISTRY}/life-os-tasks:${VERSION} -R GAMch1k/life-os --predicate-type https://cyclonedx.org/bom
          gh attestation verify compose.yaml -R GAMch1k/life-os
          \`\`\`

          [How releases are made and checked](https://github.com/${GH_REPO}/blob/${VERSION}/docs/operations/releases.md).

          ## In this preview

          - Every module runs. The integrations (AI processing with Codex or Claude Code, bank sync, Google Calendar, push through ntfy, the Cloudflare Tunnel) stay off until they are configured in \`.env\`. Switching modules on and off comes in a later preview.
          - Without a Codex sign-in (or Claude Code's token, with \`./setup.sh claude\`) the AI processor stops at start, and Docker starts it again about once a minute; \`docker compose stop processor\` stops it until AI processing is set up.
          - Voice downloads its Whisper model (about 466 MB) on its first start.
          - Server health reads the host: the Docker socket (through a read-only gateway of its own), and \`/\` and Docker's data directory, read-only.
          - ${platforms} only.
          EOF
          } >"$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >>"$GITHUB_STEP_SUMMARY"
      - name: Create the release
        env:
          DRAFT: ${{ steps.visibility.outputs.draft }}
        run: |
          flags=(--verify-tag --title "Life OS ${VERSION}" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes)
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease --latest=false); fi
          if [[ "$DRAFT" == true ]]; then flags+=(--draft); fi
          cd "$RUNNER_TEMP/bundle"
          gh release create "$VERSION" "${flags[@]}" compose.yaml .env.example setup.sh SHA256SUMS
