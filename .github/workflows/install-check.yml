# The install check (docs/operations/releases.md#the-install-check): installs
# a published release on a clean runner exactly as docs/install/README.md
# says, from the release's four files alone (compose.yaml, .env.example,
# setup.sh, SHA256SUMS): no checkout of the repository in the install
# directory, nothing built, the images pulled from ghcr.io. Then it waits for
# the stack and runs the smokes that work against an installed Life OS,
# through its gateway on 127.0.0.1:3000.
#
# release.yml runs it after every release that is not a draft. By hand:
# Actions → Install check → Run workflow (an empty version installs the
# newest release), or gh workflow run install-check.yml -f version=<tag>.
#
# P20-01 (optional modules) is in no release yet, so every module runs here:
# the integrations stay off, as they are until configured. Once a release has
# the module switches, the setup step below installs with the core modules
# only, and the container check expects no container of a module that is off.
name: Install check

on:
  # TEMPORARY (P20-07 development): workflow_dispatch needs the file on the
  # default branch. Removed before the merge.
  push:
    branches: [p20-07-install-check]
  workflow_dispatch:
    inputs:
      version:
        description: The release to install, such as v0.1.0-preview.5 (empty for the newest release)
        type: string
        default: ""
  workflow_call:
    inputs:
      version:
        description: The release to install, such as v0.1.0-preview.5
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  install:
    name: Install ${{ inputs.version || 'the newest release' }} from its release files
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      # gh attestation verify, as the install docs suggest.
      attestations: read
    # No LIFE_OS_* variable at the job level: Compose takes one from the
    # environment over .env, and the install must run on its own .env.
    env:
      GATEWAY: http://127.0.0.1:3000
      # As the install docs' example of a run without questions.
      INSTALL_TIMEZONE: Europe/Berlin
    steps:
      - name: Pick the release
        id: release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ -z "$VERSION" ]]; then
            # The newest release that is published: pre-releases count.
            VERSION=$(gh api "repos/$GH_REPO/releases?per_page=20" --jq '[.[] | select(.draft | not)][0].tag_name // empty')
          fi
          if [[ ! "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'${VERSION}' is not a release version such as v0.1.0-preview.5."
            exit 1
          fi
          echo "version=$VERSION" >>"$GITHUB_OUTPUT"
          echo "url=https://github.com/$GH_REPO/releases/download/$VERSION" >>"$GITHUB_OUTPUT"
          echo "### Install check of [${VERSION}](https://github.com/$GH_REPO/releases/tag/$VERSION)" >>"$GITHUB_STEP_SUMMARY"
          # The install directory, as in the install docs.
          echo "INSTALL_DIR=$HOME/life-os" >>"$GITHUB_ENV"
      - name: Show the runner
        run: |
          echo "$(nproc) CPUs"
          free -h
          df -h /
          docker version --format 'Docker {{.Server.Version}}'
          docker compose version
      # A quirk of GitHub's runners, not of the install (as CI's full-stack
      # job, docs/operations/ci.md#full-stack-tests): their systemd-resolved
      # answers SERVFAIL for a single-label name it does not know, such as
      # the processor while Docker restarts it, and the Alpine images wait
      # 10 s on SERVFAIL, until the Dashboard's other requests time out too.
      # A usual host answers NXDOMAIN at once, as this makes the runner do.
      - name: Answer unknown service names at once
        run: |
          sudo mkdir -p /etc/systemd/resolved.conf.d
          printf '[Resolve]\nResolveUnicastSingleLabel=yes\n' | sudo tee /etc/systemd/resolved.conf.d/lifeos-ci.conf
          sudo systemctl restart systemd-resolved

      # docs/install/README.md, Quick start, steps 1 to 4, in an empty
      # directory. The same requests as the docs, with retries: this may run
      # a minute after the release is created.
      - name: Download the release (Quick start, step 1)
        env:
          release: ${{ steps.release.outputs.url }}
        run: |
          mkdir "$INSTALL_DIR" && cd "$INSTALL_DIR"
          for file in compose.yaml setup.sh SHA256SUMS; do curl -fsSLO --retry 5 --retry-all-errors "$release/$file"; done
          # GitHub serves .env.example as default.env.example
          curl -fsSL --retry 5 --retry-all-errors -o .env.example "$release/default.env.example"
          ls -la
      - name: Check the download (step 2)
        env:
          VERSION: ${{ steps.release.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$INSTALL_DIR"
          sha256sum -c SHA256SUMS
          for file in setup.sh compose.yaml .env.example; do
            gh attestation verify "$file" -R "$GITHUB_REPOSITORY" >/dev/null
            echo "$file: build provenance verified"
          done
          # Only the release's files: nothing of the repository.
          if [[ "$(find . -mindepth 1 -maxdepth 1 -printf '%P\n' | sort)" != "$(printf '%s\n' .env.example SHA256SUMS compose.yaml setup.sh | sort)" ]]; then
            echo "::error::The install directory holds more than the four release files."
            exit 1
          fi
          if grep -Eq '^[[:space:]]+build:' compose.yaml; then
            echo "::error::The release's compose.yaml builds images; it must only run the published ones."
            exit 1
          fi
          if ! grep -qx "LIFE_OS_VERSION=$VERSION" .env.example; then
            echo "::error::The release's .env.example does not name ${VERSION}."
            exit 1
          fi
      # Without questions, as docs/install/README.md#without-questions says:
      # every question takes its default, the timezone from the environment.
      # P20-01: once the release has the module switches, set the core
      # modules only here.
      - name: Set up (step 3, ./setup.sh --yes)
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          cd "$INSTALL_DIR"
          chmod +x setup.sh
          LIFE_OS_TIMEZONE=$INSTALL_TIMEZONE ./setup.sh --yes
          # What it wrote, never a value but these.
          [[ "$(stat -c %a .env)" == 600 ]] || { echo "::error::.env is not mode 600"; exit 1; }
          grep -qx "LIFE_OS_VERSION=$VERSION" .env || { echo "::error::.env does not run ${VERSION}"; exit 1; }
          grep -qx "LIFE_OS_TIMEZONE=$INSTALL_TIMEZONE" .env || { echo "::error::.env does not have the timezone ${INSTALL_TIMEZONE}"; exit 1; }
          [[ -d backups && -d codex-home && -z "$(ls -A codex-home)" ]] || { echo "::error::setup.sh did not create backups/ and an empty codex-home/"; exit 1; }
      - name: Start it (step 4, ./setup.sh up)
        id: up
        timeout-minutes: 20
        run: |
          cd "$INSTALL_DIR"
          ./setup.sh up 2>&1 | tee "$RUNNER_TEMP/setup-up.log"
          # up waits until the gateway and the core services answer, and says
          # so; it ends without an error when they never do.
          if ! grep -qx 'Life OS answers.' "$RUNNER_TEMP/setup-up.log"; then
            echo "::error::./setup.sh up ended before Life OS answered."
            exit 1
          fi

      # Every service runs (healthy where it has a health check), every
      # one-shot job ended with 0, and every service Compose lists has its
      # container. The processor is the one exception, checked on its own.
      - name: Wait for every service
        id: services
        run: |
          cd "$INSTALL_DIR"
          deadline=$((SECONDS + 600))
          declare -A seen
          while true; do
            problems=()
            seen=()
            while IFS='|' read -r service state health exit_code; do
              [[ -n "$service" ]] || continue
              seen[$service]=1
              case $service in
                processor) ;;
                postgres-provision | *-migrate)
                  [[ "$state" == exited && "$exit_code" == 0 ]] || problems+=("$service: $state (exit $exit_code)") ;;
                *)
                  if [[ "$state" != running ]]; then
                    problems+=("$service: $state")
                  elif [[ -n "$health" && "$health" != healthy ]]; then
                    problems+=("$service: $health")
                  fi
                  ;;
              esac
            done < <(docker compose ps --all --format '{{.Service}}|{{.State}}|{{.Health}}|{{.ExitCode}}')
            while read -r service; do
              [[ -n "${seen[$service]:-}" ]] || problems+=("$service: no container")
            done < <(docker compose config --services)
            ((${#problems[@]})) || break
            if ((SECONDS >= deadline)); then
              printf '::error::Not running after 10 minutes: %s\n' "${problems[@]}"
              exit 1
            fi
            sleep 5
          done
          docker compose ps --all --format 'table {{.Service}}\t{{.State}}\t{{.Status}}'
      # Without a Codex sign-in, the processor's entrypoint stops at every
      # start ("missing Codex authentication", exit 78) and Docker starts it
      # again, as the release notes say. That is expected here, so it does not
      # fail the job; the processor failing any other way does.
      - name: The processor waits for an AI sign-in
        id: processor
        run: |
          cd "$INSTALL_DIR"
          if ! docker compose config --services | grep -qx processor; then
            echo "No processor in this install: AI processing is off."
            exit 0
          fi
          id=$(docker compose ps --all -q processor)
          [[ -n "$id" ]] || { echo "::error::The processor has no container."; exit 1; }
          # A minute, so that it has tried to start at least twice.
          for _ in $(seq 1 12); do
            read -r state health exit_code restarts < <(docker inspect --format '{{.State.Status}} {{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} {{.State.ExitCode}} {{.RestartCount}}' "$id")
            ((restarts < 1)) || break
            sleep 5
          done
          echo "processor: $state, health $health, last exit $exit_code, $restarts restarts"
          docker compose logs --no-color --no-log-prefix processor >"$RUNNER_TEMP/processor.log"
          expected='^missing Codex authentication at /run/lifeos-codex-source/auth\.json: '
          if ! grep -Eq "$expected" "$RUNNER_TEMP/processor.log"; then
            echo "::error::The processor's log does not say that the Codex sign-in is missing:"
            cat "$RUNNER_TEMP/processor.log"
            exit 1
          fi
          if grep -Ev "$expected" "$RUNNER_TEMP/processor.log" | grep -q .; then
            echo "::error::The processor logged more than the missing Codex sign-in:"
            cat "$RUNNER_TEMP/processor.log"
            exit 1
          fi
          if [[ "$health" == healthy ]] || [[ "$state" != running && "$exit_code" != 78 ]]; then
            echo "::error::The processor is ${state} (health ${health}, exit ${exit_code}): without a Codex sign-in it must stop at start with exit 78."
            exit 1
          fi
          echo "As expected without a Codex sign-in: $(sort -u "$RUNNER_TEMP/processor.log" | head -n 1)"
          echo "- The processor stops at start without a Codex sign-in, as expected (exit ${exit_code}, ${restarts} restarts so far)." >>"$GITHUB_STEP_SUMMARY"

      # The gateway keeps to 127.0.0.1 (Life OS has no login) and answers its
      # own hosts only, as tools/smoke-e2e checks on the verification stack.
      - name: The gateway
        id: gateway
        run: |
          cd "$INSTALL_DIR"
          published=$(docker compose port gateway 80)
          [[ "$published" == 127.0.0.1:3000 ]] || { echo "::error::The gateway is published on ${published}, not 127.0.0.1:3000."; exit 1; }
          # The runner's own network address must not reach it.
          address=$(hostname -I | awk '{print $1}')
          if curl -s -o /dev/null --max-time 5 "http://$address:3000/"; then
            echo "::error::The gateway answers on ${address}:3000, not only on 127.0.0.1."
            exit 1
          fi
          for path in / /status /inbox /tasks /calendar /finance /food; do
            curl -fsS -o /dev/null --max-time 30 "$GATEWAY$path" || { echo "::error::$GATEWAY$path does not answer"; exit 1; }
          done
          for host in 127.0.0.1 localhost; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Host: $host" "$GATEWAY/api/tasks/ready" || true)
            [[ "$code" == 200 ]] || { echo "::error::The gateway must answer Host ${host} (got ${code})"; exit 1; }
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: unknown.example' "$GATEWAY/api/tasks/ready" || true)
          [[ "$code" == 000 ]] || { echo "::error::The gateway must not answer Host unknown.example (got ${code})"; exit 1; }
          echo "The gateway listens on 127.0.0.1:3000 only, and answers its own hosts only."

      # The smokes that take a gateway (LIFE_OS_SMOKE_GATEWAY), from the
      # release's own tag. A sparse checkout of those files only, in the
      # workspace: never in the install directory, which keeps to the release
      # files. Every smoke runs, even after another one failed.
      - name: Fetch the smokes of ${{ steps.release.outputs.version }}
        id: smokes
        if: ${{ !cancelled() && steps.up.outcome == 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.release.outputs.version }}
          path: smokes
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/smoke-core-services
            /tools/smoke-dashboard
            /tools/lib/
      - name: Core services smoke (tools/smoke-core-services)
        if: ${{ !cancelled() && steps.smokes.outcome == 'success' }}
        env:
          LIFE_OS_SMOKE_GATEWAY: ${{ env.GATEWAY }}
        run: timeout 5m smokes/tools/smoke-core-services
      - name: Dashboard smoke (tools/smoke-dashboard)
        if: ${{ !cancelled() && steps.smokes.outcome == 'success' }}
        env:
          LIFE_OS_SMOKE_GATEWAY: ${{ env.GATEWAY }}
          # The smoke reads it from .env, which its checkout has not got.
          LIFE_OS_TIMEZONE: ${{ env.INSTALL_TIMEZONE }}
        run: timeout 5m smokes/tools/smoke-dashboard

      # A voice note through the gateway, transcribed by the Whisper model the
      # install downloaded on its first start, lands in Inbox. The recording
      # is whisper.cpp's public sample, as tools/smoke-voice-lease-recovery's.
      - name: A voice note is transcribed
        if: ${{ !cancelled() && steps.up.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          actor=(-H 'X-Life-OS-Actor: dev:install-check')
          audio="$RUNNER_TEMP/jfk.wav"
          curl -fsSL --retry 3 -o "$audio" https://github.com/ggerganov/whisper.cpp/raw/master/samples/jfk.wav
          job_id=$(curl "${actor[@]}" -fsS -F "audio=@$audio;type=audio/wav" -F source=web "$GATEWAY/api/voice/v1/audio-jobs" | jq -r .id)
          state=
          for _ in $(seq 1 120); do
            job=$(curl -fsS "$GATEWAY/api/voice/v1/audio-jobs/$job_id")
            state=$(jq -r .status <<<"$job")
            [[ "$state" != succeeded && "$state" != failed ]] || break
            sleep 2
          done
          [[ "$state" == succeeded ]] || { echo "::error::The voice note's job is ${state}: $(jq -c . <<<"$job")"; exit 1; }
          item_id=$(jq -r .inboxItemId <<<"$job")
          content=$(curl -fsS "$GATEWAY/api/inbox/v1/inbox-items/$item_id" | jq -r .content)
          echo "Inbox: $content"
          grep -qi 'country' <<<"$content" || { echo "::error::The transcript is not the recording's."; exit 1; }

      # A backup, as ./setup.sh update makes one first, into the backups/
      # directory setup.sh created for this user.
      - name: A backup
        if: ${{ !cancelled() && steps.up.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          cd "$INSTALL_DIR"
          docker compose exec -T backup /service now -actor dev:install-check
          files=$(find backups -type f | wc -l)
          ((files > 0)) || { echo "::error::The backup wrote nothing to backups/."; exit 1; }
          find backups -type f -printf '%P %s\n' | sort

      # The Status page's checks (GET /api/status). The processing check
      # stays a problem without an AI sign-in, as expected; no other check
      # may be one.
      - name: The Status page
        if: ${{ !cancelled() && steps.up.outcome == 'success' }}
        run: |
          status=$(curl -fsS --max-time 60 "$GATEWAY/api/status")
          {
            echo "| Status check | State | Summary |"
            echo "| --- | --- | --- |"
            jq -r '.checks[] | "| \(.title) | \(.state) | \(.summary | gsub("\\|"; "/")) |"' <<<"$status"
          } >>"$GITHUB_STEP_SUMMARY"
          jq -r '.checks[] | "\(.id)\t\(.state)\t\(.summary)"' <<<"$status"
          problems=$(jq -r '[.checks[] | select(.state == "problem" and .id != "processing") | .id] | join(", ")' <<<"$status")
          [[ -z "$problems" ]] || { echo "::error::The Status page has problems besides AI processing: ${problems}"; exit 1; }
      - name: ./setup.sh status
        if: ${{ !cancelled() && steps.up.outcome == 'success' }}
        run: cd "$INSTALL_DIR" && ./setup.sh status

      # After the smokes: no service but the processor restarted, so a
      # service that crashed and came back is not missed.
      - name: No service restarted
        if: ${{ !cancelled() && steps.services.outcome == 'success' }}
        run: |
          cd "$INSTALL_DIR"
          restarted=()
          mapfile -t containers < <(docker compose ps --all -q)
          while read -r service restarts; do
            [[ "$service" == processor ]] || ((restarts == 0)) || restarted+=("$service ($restarts)")
          done < <(docker inspect --format '{{index .Config.Labels "com.docker.compose.service"}} {{.RestartCount}}' "${containers[@]}")
          ((${#restarted[@]} == 0)) || { echo "::error::Restarted: ${restarted[*]}"; exit 1; }
          echo "No service restarted (the processor aside)."

      - name: Containers
        if: always()
        run: |
          [[ -f "${INSTALL_DIR:-}/.env" ]] || exit 0
          cd "$INSTALL_DIR"
          docker compose ps --all --format 'table {{.Service}}\t{{.State}}\t{{.Status}}'
      # Never .env: only what Compose and the services printed.
      - name: Collect the logs
        if: failure()
        run: |
          dir="$RUNNER_TEMP/install-logs"
          mkdir -p "$dir"
          cp "$RUNNER_TEMP"/setup-up.log "$RUNNER_TEMP"/processor.log "$dir/" 2>/dev/null || true
          [[ -f "${INSTALL_DIR:-}/.env" ]] || exit 0
          cd "$INSTALL_DIR"
          docker compose ps --all >"$dir/ps.txt" 2>&1 || true
          for service in $(docker compose ps --all --services); do
            docker compose logs --no-color --timestamps "$service" >"$dir/$service.log" 2>&1 || true
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: install-check-logs
          path: ${{ runner.temp }}/install-logs/
          retention-days: 7
          if-no-files-found: ignore
