# TEMPORARY (P20-07 development, removed before the merge): runs the install
# check on this branch's pushes against the published previews, through
# workflow_call as release.yml does. workflow_dispatch would need the file on
# the default branch first.
name: Install check (P20-07 development)

on:
  push:
    branches: [p20-07-install-check]

permissions:
  contents: read

jobs:
  preview-4:
    permissions:
      contents: read
      attestations: read
    uses: ./.github/workflows/install-check.yml
    with:
      version: v0.1.0-preview.4
  preview-5:
    permissions:
      contents: read
      attestations: read
    uses: ./.github/workflows/install-check.yml
    with:
      version: v0.1.0-preview.5
