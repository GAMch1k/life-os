# Weekly version updates (docs/operations/ci.md#dependabot): each ecosystem's
# updates arrive as one grouped pull request, and CI checks each one. No
# ecosystem gets major versions (the owner's decision, 2026-11-10): a major
# upgrade is a ticket of its own. The ignore rules apply to version updates
# only; security updates still come, majors included.
version: 2

updates:
  - package-ecosystem: gomod
    directories:
      - /pkg
      - /services/*
      - /templates/*
      - /tools/fixtures/documents
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /apps/dashboard
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # The Claude Code a source build with LIFE_OS_AI_PROVIDERS=codex,claude and
  # a release's ./setup.sh claude install (services/mcp/claude-code; never in
  # the published images): one pull request bumps both.
  - package-ecosystem: npm
    directory: /services/mcp/claude-code
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 1
    groups:
      claude-code:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # The Dockerfiles' base images, pinned by digest: a rebuilt tag comes as a
  # new digest, in the same pull request as new minor and patch tags.
  - package-ecosystem: docker
    directories:
      - /apps/dashboard
      - /infra/*
      - /services/*
      - /services/mcp/claude-code
      - /services/voice/whisper
      - /templates/*
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    groups:
      docker-images:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # The gateway (infra/nginx) stays on nginx's stable branch (even minor
      # versions): 1.30-alpine's new digests come; a move to the next stable
      # is a ticket.
      - dependency-name: nginx
        update-types: ["version-update:semver-minor"]

  # The images compose.yaml runs as they are (PostgreSQL, cloudflared, ntfy;
  # the ${VAR:-default} defaults too) and the browser tests' fixture nginx,
  # pinned by digest like the Dockerfiles'.
  - package-ecosystem: docker-compose
    directories:
      - /
      - /tools/fixtures
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    groups:
      docker-compose-images:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # The fixture nginx stays on the gateway's stable branch, as above.
      - dependency-name: nginx
        update-types: ["version-update:semver-minor"]
      # Life OS's own images (lifeos-*), built here.
      - dependency-name: "lifeos-*"

  # The workflows' actions, and the shared full-stack steps' (a composite
  # action, which / alone would leave out).
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
