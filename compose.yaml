name: lifeos

services:
  postgres:
    image: ${LIFE_OS_POSTGRES_IMAGE:-postgres:18.6-alpine}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${LIFE_OS_POSTGRES_DB:-postgres}
      POSTGRES_USER: ${LIFE_OS_POSTGRES_USER:?Set LIFE_OS_POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${LIFE_OS_POSTGRES_PASSWORD:?Set LIFE_OS_POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/provision-service-databases.sh:/docker-entrypoint-initdb.d/10-provision-service-databases.sh:ro
      - ./infra/postgres/service-databases.conf:/etc/lifeos/service-databases.conf:ro
      - ./infra/postgres:/opt/lifeos/postgres:ro
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  finance-migrate:
    image: migrate/migrate:v4.18.3
    command: ["-path", "/migrations", "-database", "postgres://finance_user:${LIFE_OS_FINANCE_DB_PASSWORD}@postgres:5432/finance_db?sslmode=disable", "up"]
    volumes: ["./services/finance/db/migrations:/migrations:ro"]
    depends_on: {postgres: {condition: service_healthy}}
    networks: [backend]
    restart: "no"
  finance:
    build: {context: ., dockerfile: services/finance/Dockerfile}
    environment: {SERVICE_NAME: finance, PORT: 8080, DATABASE_URL: "postgres://finance_user:${LIFE_OS_FINANCE_DB_PASSWORD}@postgres:5432/finance_db?sslmode=disable"}
    expose: ["8080"]
    depends_on: {finance-migrate: {condition: service_completed_successfully}}
    networks: [backend]
    restart: unless-stopped

  tasks-migrate:
    image: migrate/migrate:v4.18.3
    command: ["-path", "/migrations", "-database", "postgres://tasks_user:${LIFE_OS_TASKS_DB_PASSWORD}@postgres:5432/tasks_db?sslmode=disable", "up"]
    volumes: ["./services/tasks/db/migrations:/migrations:ro"]
    depends_on: {postgres: {condition: service_healthy}}
    networks: [backend]
    restart: "no"
  tasks:
    build: {context: ., dockerfile: services/tasks/Dockerfile}
    environment: {SERVICE_NAME: tasks, PORT: 8080, DATABASE_URL: "postgres://tasks_user:${LIFE_OS_TASKS_DB_PASSWORD}@postgres:5432/tasks_db?sslmode=disable", ACTIVITY_SERVICE_URL: "http://activity:8080"}
    expose: ["8080"]
    depends_on: {tasks-migrate: {condition: service_completed_successfully}}
    networks: [backend]
    restart: unless-stopped

  inbox-migrate:
    image: migrate/migrate:v4.18.3
    command: ["-path", "/migrations", "-database", "postgres://inbox_user:${LIFE_OS_INBOX_DB_PASSWORD}@postgres:5432/inbox_db?sslmode=disable", "up"]
    volumes: ["./services/inbox/db/migrations:/migrations:ro"]
    depends_on: {postgres: {condition: service_healthy}}
    networks: [backend]
    restart: "no"
  inbox:
    build: {context: ., dockerfile: services/inbox/Dockerfile}
    environment: {SERVICE_NAME: inbox, PORT: 8080, DATABASE_URL: "postgres://inbox_user:${LIFE_OS_INBOX_DB_PASSWORD}@postgres:5432/inbox_db?sslmode=disable", ACTIVITY_SERVICE_URL: "http://activity:8080"}
    expose: ["8080"]
    depends_on: {inbox-migrate: {condition: service_completed_successfully}}
    networks: [backend]
    restart: unless-stopped

  calendar-migrate:
    image: migrate/migrate:v4.18.3
    command: ["-path", "/migrations", "-database", "postgres://calendar_user:${LIFE_OS_CALENDAR_DB_PASSWORD}@postgres:5432/calendar_db?sslmode=disable", "up"]
    volumes: ["./services/calendar/db/migrations:/migrations:ro"]
    depends_on: {postgres: {condition: service_healthy}}
    networks: [backend]
    restart: "no"
  calendar:
    build: {context: ., dockerfile: services/calendar/Dockerfile}
    environment: {SERVICE_NAME: calendar, PORT: 8080, DATABASE_URL: "postgres://calendar_user:${LIFE_OS_CALENDAR_DB_PASSWORD}@postgres:5432/calendar_db?sslmode=disable"}
    expose: ["8080"]
    depends_on: {calendar-migrate: {condition: service_completed_successfully}}
    networks: [backend]
    restart: unless-stopped

  activity-migrate:
    image: migrate/migrate:v4.18.3
    command: ["-path", "/migrations", "-database", "postgres://activity_user:${LIFE_OS_ACTIVITY_DB_PASSWORD}@postgres:5432/activity_db?sslmode=disable", "up"]
    volumes: ["./services/activity/db/migrations:/migrations:ro"]
    depends_on: {postgres: {condition: service_healthy}}
    networks: [backend]
    restart: "no"
  activity:
    build: {context: ., dockerfile: services/activity/Dockerfile}
    environment: {SERVICE_NAME: activity, PORT: 8080, DATABASE_URL: "postgres://activity_user:${LIFE_OS_ACTIVITY_DB_PASSWORD}@postgres:5432/activity_db?sslmode=disable"}
    expose: ["8080"]
    depends_on: {activity-migrate: {condition: service_completed_successfully}}
    networks: [backend]
    restart: unless-stopped

  dashboard:
    build: {context: ., dockerfile: apps/dashboard/Dockerfile}
    environment:
      FINANCE_SERVICE_URL: http://finance:8080
      TASKS_SERVICE_URL: http://tasks:8080
      INBOX_SERVICE_URL: http://inbox:8080
      CALENDAR_SERVICE_URL: http://calendar:8080
      VOICE_SERVICE_URL: http://voice:8080
    expose: ["3000"]
    depends_on:
      finance: {condition: service_started}
      tasks: {condition: service_started}
      inbox: {condition: service_started}
      calendar: {condition: service_started}
    networks: [backend]
    restart: unless-stopped

  mcp:
    build: {context: ., dockerfile: services/mcp/Dockerfile, target: service}
    environment:
      SERVICE_NAME: mcp
      PORT: 8080
      FINANCE_SERVICE_URL: http://finance:8080
      TASKS_SERVICE_URL: http://tasks:8080
      INBOX_SERVICE_URL: http://inbox:8080
      CALENDAR_SERVICE_URL: http://calendar:8080
      ACTIVITY_SERVICE_URL: http://activity:8080
    expose: ["8080"]
    depends_on:
      finance: {condition: service_started}
      tasks: {condition: service_started}
      inbox: {condition: service_started}
      calendar: {condition: service_started}
    networks: [backend]
    restart: unless-stopped

  processor:
    build: {context: ., dockerfile: services/mcp/Dockerfile, target: processor}
    environment:
      MCP_SERVICE_URL: http://mcp:8080/mcp
      LIFE_OS_CODEX_WORKDIR: /workspace
      LIFE_OS_CODEX_MODEL: ${LIFE_OS_CODEX_MODEL:-gpt-5.6-terra}
      LIFE_OS_PROCESSOR_POLL_MILLIS: ${LIFE_OS_PROCESSOR_POLL_MILLIS:-1000}
      LIFE_OS_PROCESSOR_HEALTH_PORT: 8081
      CODEX_HOME: /tmp/lifeos-codex
    volumes:
      - type: bind
        source: ${LIFE_OS_CODEX_HOME_HOST_PATH:?Set LIFE_OS_CODEX_HOME_HOST_PATH in .env to your existing local Codex home}
        target: /run/lifeos-codex-source
        read_only: true
    tmpfs:
      - /tmp
      - /var/lib/lifeos/codex
    expose: ["8081"]
    depends_on:
      mcp: {condition: service_started}
      inbox: {condition: service_started}
      tasks: {condition: service_started}
      calendar: {condition: service_started}
      finance: {condition: service_started}
    networks: [backend]
    restart: unless-stopped
    user: "${LIFE_OS_CODEX_RUNTIME_UID:?Set LIFE_OS_CODEX_RUNTIME_UID in .env to the UID which owns the local Codex session}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  whisper:
    build: {context: services/voice/whisper, dockerfile: Dockerfile}
    environment:
      WHISPER_MODEL_PATH: ${LIFE_OS_WHISPER_MODEL_PATH:-/models/ggml-base.bin}
      WHISPER_MODEL_URL: ${LIFE_OS_WHISPER_MODEL_URL:-https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin}
      WHISPER_THREADS: ${LIFE_OS_WHISPER_THREADS:-2}
      WHISPER_MAX_CONCURRENCY: ${LIFE_OS_WHISPER_MAX_CONCURRENCY:-1}
      WHISPER_MAX_AUDIO_BYTES: ${LIFE_OS_WHISPER_MAX_AUDIO_BYTES:-26214400}
    volumes: ["whisper-models:/models"]
    expose: ["8080"]
    networks: [backend]
    restart: unless-stopped
    cpus: ${LIFE_OS_WHISPER_CPUS:-2.0}
    mem_limit: ${LIFE_OS_WHISPER_MEMORY:-2g}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 2m

  voice-migrate:
    image: migrate/migrate:v4.18.3
    command: ["-path", "/migrations", "-database", "postgres://voice_user:${LIFE_OS_VOICE_DB_PASSWORD}@postgres:5432/voice_db?sslmode=disable", "up"]
    volumes: ["./services/voice/db/migrations:/migrations:ro"]
    depends_on: {postgres: {condition: service_healthy}}
    networks: [backend]
    restart: "no"
  voice:
    build: {context: ., dockerfile: services/voice/Dockerfile}
    environment:
      SERVICE_NAME: voice
      PORT: 8080
      DATABASE_URL: "postgres://voice_user:${LIFE_OS_VOICE_DB_PASSWORD}@postgres:5432/voice_db?sslmode=disable"
      VOICE_STORAGE_DIR: /var/lib/lifeos/voice
      VOICE_RETENTION_HOURS: ${LIFE_OS_VOICE_RETENTION_HOURS:-168}
      VOICE_MAX_UPLOAD_BYTES: ${LIFE_OS_VOICE_MAX_UPLOAD_BYTES:-26214400}
      ACTIVITY_SERVICE_URL: http://activity:8080
    volumes: ["voice-audio:/var/lib/lifeos/voice"]
    expose: ["8080"]
    depends_on: {voice-migrate: {condition: service_completed_successfully}}
    networks: [backend]
    restart: unless-stopped
  voice-worker:
    build: {context: ., dockerfile: services/voice/Dockerfile}
    entrypoint: ["/worker"]
    environment:
      SERVICE_NAME: voice-worker
      DATABASE_URL: "postgres://voice_user:${LIFE_OS_VOICE_DB_PASSWORD}@postgres:5432/voice_db?sslmode=disable"
      VOICE_STORAGE_DIR: /var/lib/lifeos/voice
      VOICE_RETENTION_HOURS: ${LIFE_OS_VOICE_RETENTION_HOURS:-168}
      INBOX_SERVICE_URL: http://inbox:8080
      WHISPER_SERVICE_URL: http://whisper:8080
      ACTIVITY_SERVICE_URL: http://activity:8080
      VOICE_WORKER_POLL_MILLIS: ${LIFE_OS_VOICE_WORKER_POLL_MILLIS:-1000}
      VOICE_WORKER_MAX_ATTEMPTS: ${LIFE_OS_VOICE_WORKER_MAX_ATTEMPTS:-3}
      VOICE_WORKER_LEASE_SECONDS: ${LIFE_OS_VOICE_WORKER_LEASE_SECONDS:-120}
      VOICE_WORKER_RETRY_BACKOFF_SECONDS: ${LIFE_OS_VOICE_WORKER_RETRY_BACKOFF_SECONDS:-60}
    volumes: ["voice-audio:/var/lib/lifeos/voice"]
    depends_on:
      voice-migrate: {condition: service_completed_successfully}
      inbox: {condition: service_started}
      whisper: {condition: service_healthy}
    networks: [backend]
    restart: unless-stopped

  gateway:
    image: nginx:1.28-alpine
    volumes: ["./infra/nginx/life-os.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["${LIFE_OS_GATEWAY_BIND_ADDRESS:-127.0.0.1}:${LIFE_OS_GATEWAY_PORT:-3000}:80"]
    depends_on:
      dashboard: {condition: service_started}
      finance: {condition: service_started}
      tasks: {condition: service_started}
      inbox: {condition: service_started}
      calendar: {condition: service_started}
      mcp: {condition: service_started}
      voice: {condition: service_started}
      activity: {condition: service_started}
    networks: [backend]
    restart: unless-stopped

networks:
  backend:
    name: lifeos-backend
    driver: bridge

volumes:
  postgres-data:
    name: lifeos-postgres-data
  whisper-models:
    name: lifeos-whisper-models
  voice-audio:
    name: lifeos-voice-audio
