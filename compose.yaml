name: lifeos

services:
  postgres:
    image: ${LIFE_OS_POSTGRES_IMAGE:-postgres:18.6-alpine}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${LIFE_OS_POSTGRES_DB:-postgres}
      POSTGRES_USER: ${LIFE_OS_POSTGRES_USER:?Set LIFE_OS_POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${LIFE_OS_POSTGRES_PASSWORD:?Set LIFE_OS_POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/provision-service-databases.sh:/docker-entrypoint-initdb.d/10-provision-service-databases.sh:ro
      - ./infra/postgres/service-databases.conf:/etc/lifeos/service-databases.conf:ro
      - ./infra/postgres:/opt/lifeos/postgres:ro
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  finance-migrate:
    image: migrate/migrate:v4.18.3
    command: ["-path", "/migrations", "-database", "postgres://finance_user:${LIFE_OS_FINANCE_DB_PASSWORD}@postgres:5432/finance_db?sslmode=disable", "up"]
    volumes: ["./services/finance/db/migrations:/migrations:ro"]
    depends_on: {postgres: {condition: service_healthy}}
    networks: [backend]
    restart: "no"
  finance:
    build: {context: ., dockerfile: services/finance/Dockerfile}
    environment: {SERVICE_NAME: finance, PORT: 8080, DATABASE_URL: "postgres://finance_user:${LIFE_OS_FINANCE_DB_PASSWORD}@postgres:5432/finance_db?sslmode=disable"}
    expose: ["8080"]
    depends_on: {finance-migrate: {condition: service_completed_successfully}}
    networks: [backend]
    restart: unless-stopped

  tasks-migrate:
    image: migrate/migrate:v4.18.3
    command: ["-path", "/migrations", "-database", "postgres://tasks_user:${LIFE_OS_TASKS_DB_PASSWORD}@postgres:5432/tasks_db?sslmode=disable", "up"]
    volumes: ["./services/tasks/db/migrations:/migrations:ro"]
    depends_on: {postgres: {condition: service_healthy}}
    networks: [backend]
    restart: "no"
  tasks:
    build: {context: ., dockerfile: services/tasks/Dockerfile}
    environment: {SERVICE_NAME: tasks, PORT: 8080, DATABASE_URL: "postgres://tasks_user:${LIFE_OS_TASKS_DB_PASSWORD}@postgres:5432/tasks_db?sslmode=disable", ACTIVITY_SERVICE_URL: "http://activity:8080"}
    expose: ["8080"]
    depends_on: {tasks-migrate: {condition: service_completed_successfully}}
    networks: [backend]
    restart: unless-stopped

  inbox-migrate:
    image: migrate/migrate:v4.18.3
    command: ["-path", "/migrations", "-database", "postgres://inbox_user:${LIFE_OS_INBOX_DB_PASSWORD}@postgres:5432/inbox_db?sslmode=disable", "up"]
    volumes: ["./services/inbox/db/migrations:/migrations:ro"]
    depends_on: {postgres: {condition: service_healthy}}
    networks: [backend]
    restart: "no"
  inbox:
    build: {context: ., dockerfile: services/inbox/Dockerfile}
    environment: {SERVICE_NAME: inbox, PORT: 8080, DATABASE_URL: "postgres://inbox_user:${LIFE_OS_INBOX_DB_PASSWORD}@postgres:5432/inbox_db?sslmode=disable", ACTIVITY_SERVICE_URL: "http://activity:8080"}
    expose: ["8080"]
    depends_on: {inbox-migrate: {condition: service_completed_successfully}}
    networks: [backend]
    restart: unless-stopped

  calendar-migrate:
    image: migrate/migrate:v4.18.3
    command: ["-path", "/migrations", "-database", "postgres://calendar_user:${LIFE_OS_CALENDAR_DB_PASSWORD}@postgres:5432/calendar_db?sslmode=disable", "up"]
    volumes: ["./services/calendar/db/migrations:/migrations:ro"]
    depends_on: {postgres: {condition: service_healthy}}
    networks: [backend]
    restart: "no"
  calendar:
    build: {context: ., dockerfile: services/calendar/Dockerfile}
    environment: {SERVICE_NAME: calendar, PORT: 8080, DATABASE_URL: "postgres://calendar_user:${LIFE_OS_CALENDAR_DB_PASSWORD}@postgres:5432/calendar_db?sslmode=disable", LIFE_OS_TIMEZONE: "${LIFE_OS_TIMEZONE:-UTC}", ACTIVITY_SERVICE_URL: "http://activity:8080", CALENDAR_SOURCE_REFRESH_AT: "${LIFE_OS_CALENDAR_SOURCE_REFRESH_AT:-04:30}", CALENDAR_ZAW_ICS_URL: "${LIFE_OS_ZAW_ICS_URL:-}", LIFE_OS_GOOGLE_CLIENT_ID: "${LIFE_OS_GOOGLE_CLIENT_ID:-}", LIFE_OS_GOOGLE_CLIENT_SECRET: "${LIFE_OS_GOOGLE_CLIENT_SECRET:-}", LIFE_OS_GOOGLE_TOKEN_KEY: "${LIFE_OS_GOOGLE_TOKEN_KEY:-}", LIFE_OS_GOOGLE_REDIRECT_URI: "${LIFE_OS_GOOGLE_REDIRECT_URI:-https://lifeos.gamch1k.com/calendar/google/callback}"}
    expose: ["8080"]
    depends_on: {calendar-migrate: {condition: service_completed_successfully}}
    networks: [backend]
    restart: unless-stopped

  activity-migrate:
    image: migrate/migrate:v4.18.3
    command: ["-path", "/migrations", "-database", "postgres://activity_user:${LIFE_OS_ACTIVITY_DB_PASSWORD}@postgres:5432/activity_db?sslmode=disable", "up"]
    volumes: ["./services/activity/db/migrations:/migrations:ro"]
    depends_on: {postgres: {condition: service_healthy}}
    networks: [backend]
    restart: "no"
  activity:
    build: {context: ., dockerfile: services/activity/Dockerfile}
    environment: {SERVICE_NAME: activity, PORT: 8080, DATABASE_URL: "postgres://activity_user:${LIFE_OS_ACTIVITY_DB_PASSWORD}@postgres:5432/activity_db?sslmode=disable"}
    expose: ["8080"]
    depends_on: {activity-migrate: {condition: service_completed_successfully}}
    networks: [backend]
    restart: unless-stopped

  notifications-migrate:
    image: migrate/migrate:v4.18.3
    command: ["-path", "/migrations", "-database", "postgres://notifications_user:${LIFE_OS_NOTIFICATIONS_DB_PASSWORD}@postgres:5432/notifications_db?sslmode=disable", "up"]
    volumes: ["./services/notifications/db/migrations:/migrations:ro"]
    depends_on: {postgres: {condition: service_healthy}}
    networks: [backend]
    restart: "no"
  # The one path for notifications to the owner. Channels are configured here
  # (LIFE_OS_NOTIFICATIONS_CHANNELS); none by default, so notifications are
  # stored and listed in the Dashboard only. "ntfy" publishes to the ntfy
  # service below with the publisher token (docs/operations/ntfy.md), over
  # the internal notify-internal network, which only the two of them share.
  notifications:
    build: {context: ., dockerfile: services/notifications/Dockerfile}
    environment: {SERVICE_NAME: notifications, PORT: 8080, DATABASE_URL: "postgres://notifications_user:${LIFE_OS_NOTIFICATIONS_DB_PASSWORD}@postgres:5432/notifications_db?sslmode=disable", ACTIVITY_SERVICE_URL: "http://activity:8080", NOTIFICATIONS_CHANNELS: "${LIFE_OS_NOTIFICATIONS_CHANNELS:-}", NOTIFICATIONS_NTFY_URL: "http://ntfy:80", NOTIFICATIONS_NTFY_TOPIC: "${LIFE_OS_NTFY_TOPIC:-lifeos}", NOTIFICATIONS_NTFY_TOKEN: "${LIFE_OS_NTFY_PUBLISHER_TOKEN:-}", NOTIFICATIONS_LINK_BASE_URL: "${LIFE_OS_PUBLIC_URL:-https://lifeos.gamch1k.com}"}
    expose: ["8080"]
    depends_on: {notifications-migrate: {condition: service_completed_successfully}}
    networks: [backend, notify-internal]
    restart: unless-stopped

  dashboard:
    build: {context: ., dockerfile: apps/dashboard/Dockerfile}
    environment:
      FINANCE_SERVICE_URL: http://finance:8080
      TASKS_SERVICE_URL: http://tasks:8080
      INBOX_SERVICE_URL: http://inbox:8080
      CALENDAR_SERVICE_URL: http://calendar:8080
      VOICE_SERVICE_URL: http://voice:8080
      ACTIVITY_SERVICE_URL: http://activity:8080
      NOTIFICATIONS_SERVICE_URL: http://notifications:8080
      PROCESSOR_STATUS_URL: http://processor:8081
      LIFE_OS_TIMEZONE: ${LIFE_OS_TIMEZONE:-UTC}
    expose: ["3000"]
    depends_on:
      finance: {condition: service_started}
      tasks: {condition: service_started}
      inbox: {condition: service_started}
      calendar: {condition: service_started}
    networks: [backend]
    restart: unless-stopped

  mcp:
    build: {context: ., dockerfile: services/mcp/Dockerfile, target: service}
    environment:
      SERVICE_NAME: mcp
      PORT: 8080
      FINANCE_SERVICE_URL: http://finance:8080
      TASKS_SERVICE_URL: http://tasks:8080
      INBOX_SERVICE_URL: http://inbox:8080
      CALENDAR_SERVICE_URL: http://calendar:8080
      ACTIVITY_SERVICE_URL: http://activity:8080
    expose: ["8080"]
    depends_on:
      finance: {condition: service_started}
      tasks: {condition: service_started}
      inbox: {condition: service_started}
      calendar: {condition: service_started}
    networks: [backend]
    restart: unless-stopped

  processor:
    build: {context: ., dockerfile: services/mcp/Dockerfile, target: processor}
    environment:
      MCP_SERVICE_URL: http://mcp:8080/mcp
      LIFE_OS_CODEX_WORKDIR: /workspace
      LIFE_OS_CODEX_MODEL: ${LIFE_OS_CODEX_MODEL:-gpt-5.6-luna}
      LIFE_OS_CODEX_REASONING_EFFORT: ${LIFE_OS_CODEX_REASONING_EFFORT:-medium}
      LIFE_OS_PROCESSOR_POLL_MILLIS: ${LIFE_OS_PROCESSOR_POLL_MILLIS:-1000}
      LIFE_OS_PROCESSOR_HEALTH_PORT: 8081
      LIFE_OS_CODEX_TIMEOUT_SECONDS: ${LIFE_OS_CODEX_TIMEOUT_SECONDS:-300}
      LIFE_OS_CODEX_MAX_CONCURRENCY: ${LIFE_OS_CODEX_MAX_CONCURRENCY:-1}
      LIFE_OS_PROCESSOR_STALE_AFTER_SECONDS: ${LIFE_OS_PROCESSOR_STALE_AFTER_SECONDS:-120}
      LIFE_OS_TIMEZONE: ${LIFE_OS_TIMEZONE:-UTC}
      TZ: ${LIFE_OS_TIMEZONE:-UTC}
      CODEX_HOME: /tmp/lifeos-codex
    volumes:
      - type: bind
        source: ${LIFE_OS_CODEX_HOME_HOST_PATH:?Set LIFE_OS_CODEX_HOME_HOST_PATH in .env to your existing local Codex home}
        target: /run/lifeos-codex-source
        read_only: true
    tmpfs:
      - /tmp
      - /var/lib/lifeos/codex
    expose: ["8081"]
    depends_on:
      mcp: {condition: service_started}
      inbox: {condition: service_started}
      tasks: {condition: service_started}
      calendar: {condition: service_started}
      finance: {condition: service_started}
    networks: [backend]
    restart: unless-stopped
    user: "${LIFE_OS_CODEX_RUNTIME_UID:?Set LIFE_OS_CODEX_RUNTIME_UID in .env to the UID which owns the local Codex session}"
    # Room to stop a Codex run gracefully and record the attempt's outcome.
    stop_grace_period: 30s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  whisper:
    build: {context: services/voice/whisper, dockerfile: Dockerfile}
    environment:
      WHISPER_MODEL_PATH: ${LIFE_OS_WHISPER_MODEL_PATH:-/models/ggml-base.bin}
      WHISPER_MODEL_URL: ${LIFE_OS_WHISPER_MODEL_URL:-https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin}
      WHISPER_THREADS: ${LIFE_OS_WHISPER_THREADS:-2}
      WHISPER_MAX_CONCURRENCY: ${LIFE_OS_WHISPER_MAX_CONCURRENCY:-1}
      WHISPER_MAX_AUDIO_BYTES: ${LIFE_OS_WHISPER_MAX_AUDIO_BYTES:-26214400}
    volumes: ["whisper-models:/models"]
    expose: ["8080"]
    networks: [backend]
    restart: unless-stopped
    cpus: ${LIFE_OS_WHISPER_CPUS:-2.0}
    mem_limit: ${LIFE_OS_WHISPER_MEMORY:-2g}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 2m

  voice-migrate:
    image: migrate/migrate:v4.18.3
    command: ["-path", "/migrations", "-database", "postgres://voice_user:${LIFE_OS_VOICE_DB_PASSWORD}@postgres:5432/voice_db?sslmode=disable", "up"]
    volumes: ["./services/voice/db/migrations:/migrations:ro"]
    depends_on: {postgres: {condition: service_healthy}}
    networks: [backend]
    restart: "no"
  voice:
    build: {context: ., dockerfile: services/voice/Dockerfile}
    environment:
      SERVICE_NAME: voice
      PORT: 8080
      DATABASE_URL: "postgres://voice_user:${LIFE_OS_VOICE_DB_PASSWORD}@postgres:5432/voice_db?sslmode=disable"
      VOICE_STORAGE_DIR: /var/lib/lifeos/voice
      VOICE_RETENTION_HOURS: ${LIFE_OS_VOICE_RETENTION_HOURS:-168}
      VOICE_MAX_UPLOAD_BYTES: ${LIFE_OS_VOICE_MAX_UPLOAD_BYTES:-26214400}
      ACTIVITY_SERVICE_URL: http://activity:8080
    volumes: ["voice-audio:/var/lib/lifeos/voice"]
    expose: ["8080"]
    depends_on: {voice-migrate: {condition: service_completed_successfully}}
    networks: [backend]
    restart: unless-stopped
  voice-worker:
    build: {context: ., dockerfile: services/voice/Dockerfile}
    entrypoint: ["/worker"]
    environment:
      SERVICE_NAME: voice-worker
      DATABASE_URL: "postgres://voice_user:${LIFE_OS_VOICE_DB_PASSWORD}@postgres:5432/voice_db?sslmode=disable"
      VOICE_STORAGE_DIR: /var/lib/lifeos/voice
      VOICE_RETENTION_HOURS: ${LIFE_OS_VOICE_RETENTION_HOURS:-168}
      INBOX_SERVICE_URL: http://inbox:8080
      WHISPER_SERVICE_URL: http://whisper:8080
      ACTIVITY_SERVICE_URL: http://activity:8080
      VOICE_WORKER_POLL_MILLIS: ${LIFE_OS_VOICE_WORKER_POLL_MILLIS:-1000}
      VOICE_WORKER_MAX_ATTEMPTS: ${LIFE_OS_VOICE_WORKER_MAX_ATTEMPTS:-3}
      VOICE_WORKER_LEASE_SECONDS: ${LIFE_OS_VOICE_WORKER_LEASE_SECONDS:-120}
      VOICE_WORKER_RETRY_BACKOFF_SECONDS: ${LIFE_OS_VOICE_WORKER_RETRY_BACKOFF_SECONDS:-60}
    volumes: ["voice-audio:/var/lib/lifeos/voice"]
    depends_on:
      voice-migrate: {condition: service_completed_successfully}
      inbox: {condition: service_started}
      whisper: {condition: service_healthy}
    networks: [backend]
    restart: unless-stopped

  gateway:
    image: nginx:1.28-alpine
    volumes: ["./infra/nginx/life-os.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["${LIFE_OS_GATEWAY_BIND_ADDRESS:-127.0.0.1}:${LIFE_OS_GATEWAY_PORT:-3000}:80"]
    depends_on:
      dashboard: {condition: service_started}
      finance: {condition: service_started}
      tasks: {condition: service_started}
      inbox: {condition: service_started}
      calendar: {condition: service_started}
      mcp: {condition: service_started}
      voice: {condition: service_started}
      activity: {condition: service_started}
      notifications: {condition: service_started}
    # edge: how the Cloudflare connector reaches the gateway (and only it).
    networks: [backend, edge]
    restart: unless-stopped

  # Opt-in ntfy server (COMPOSE_PROFILES=ntfy): push notifications to the
  # owner's phone (docs/operations/ntfy.md). It is on two networks only:
  # notify-edge, with the Cloudflare connector alone (the tunnel route
  # ntfy.gamch1k.com -> http://ntfy:80, without Access: the ntfy app cannot
  # log in through it), and the internal notify-internal, with the
  # Notifications service alone, which publishes to it. It never shares a
  # network with the gateway or the other services, and the connector shares
  # none with Notifications, so that route cannot reach Life OS. ntfy's own deny-all accounts protect it: ntfy provisions the
  # publisher (write-only on the topic, by token) and the phone (read-only, by
  # password) at every start from the ignored .env. Bcrypt hashes and the
  # token never appear in the repository.
  ntfy:
    image: ${LIFE_OS_NTFY_IMAGE:-binwiederhier/ntfy:v2.29.0}
    profiles: [ntfy]
    command: ["serve"]
    environment:
      NTFY_AUTH_USERS: "lifeos-publisher:${LIFE_OS_NTFY_PUBLISHER_PASSWORD_HASH:-}:user,lifeos-phone:${LIFE_OS_NTFY_PHONE_PASSWORD_HASH:-}:user"
      NTFY_AUTH_ACCESS: "lifeos-publisher:${LIFE_OS_NTFY_TOPIC:-lifeos}:write-only,lifeos-phone:${LIFE_OS_NTFY_TOPIC:-lifeos}:read-only"
      NTFY_AUTH_TOKENS: "lifeos-publisher:${LIFE_OS_NTFY_PUBLISHER_TOKEN:-}:notifications-service"
    volumes:
      - ./infra/ntfy/server.yml:/etc/ntfy/server.yml:ro
      - ntfy-data:/var/lib/ntfy
    expose: ["80"]
    networks: [notify-edge, notify-internal]
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Opt-in Cloudflare Tunnel (COMPOSE_PROFILES=cloudflare). An outbound-only
  # connector on the private network that hands Cloudflare traffic to the
  # gateway (lifeos.gamch1k.com, behind Access) and to ntfy (ntfy.gamch1k.com);
  # it publishes no port. The public hostnames and their routes
  # (http://gateway:80, http://ntfy:80) live in the Cloudflare tunnel
  # configuration, and the token comes only from the ignored .env. See
  # docs/operations/cloudflare.md.
  cloudflared:
    image: ${LIFE_OS_CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2026.10.0}
    profiles: [cloudflare]
    command: ["tunnel", "--metrics", "127.0.0.1:20241", "--management-diagnostics=false", "run"]
    environment:
      TUNNEL_TOKEN: ${LIFE_OS_CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      gateway: {condition: service_started}
    # edge reaches only the gateway (Life OS, behind Access); notify-edge
    # reaches only ntfy. Services stay on backend.
    networks: [edge, notify-edge]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  backend:
    name: lifeos-backend
    driver: bridge
  # The Cloudflare connector and the gateway only. The fixed subnet lets the
  # gateway trust Cloudflare's client-address header from this network alone
  # (infra/nginx/life-os.conf).
  edge:
    name: lifeos-edge
    driver: bridge
    ipam:
      config:
        - subnet: 10.255.249.0/29
  # The Cloudflare connector and ntfy only: the tunnel's ntfy route (no
  # Access) reaches ntfy here and nothing of Life OS.
  notify-edge:
    name: lifeos-notify-edge
    driver: bridge
    ipam:
      config:
        - subnet: 10.255.249.16/29
  # ntfy and the Notifications service only, so Notifications can publish
  # without sharing a network with the connector. Internal: no outside access.
  notify-internal:
    name: lifeos-notify-internal
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.255.249.32/29

volumes:
  postgres-data:
    name: lifeos-postgres-data
  whisper-models:
    name: lifeos-whisper-models
  voice-audio:
    name: lifeos-voice-audio
  ntfy-data:
    name: lifeos-ntfy-data
