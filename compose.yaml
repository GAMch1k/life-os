name: lifeos

services:
  postgres:
    image: ${LIFE_OS_POSTGRES_IMAGE:-postgres:18.6-alpine}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${LIFE_OS_POSTGRES_DB:-postgres}
      POSTGRES_USER: ${LIFE_OS_POSTGRES_USER:?Set LIFE_OS_POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${LIFE_OS_POSTGRES_PASSWORD:?Set LIFE_OS_POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/provision-service-databases.sh:/docker-entrypoint-initdb.d/10-provision-service-databases.sh:ro
      - ./infra/postgres/service-databases.conf:/etc/lifeos/service-databases.conf:ro
      - ./infra/postgres:/opt/lifeos/postgres:ro
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  finance-migrate:
    image: migrate/migrate:v4.18.3
    command: ["-path", "/migrations", "-database", "postgres://finance_user:${LIFE_OS_FINANCE_DB_PASSWORD}@postgres:5432/finance_db?sslmode=disable", "up"]
    volumes: ["./services/finance/db/migrations:/migrations:ro"]
    depends_on: {postgres: {condition: service_healthy}}
    networks: [backend]
    restart: "no"
  finance:
    build: {context: ., dockerfile: services/finance/Dockerfile}
    environment: {SERVICE_NAME: finance, PORT: 8080, DATABASE_URL: "postgres://finance_user:${LIFE_OS_FINANCE_DB_PASSWORD}@postgres:5432/finance_db?sslmode=disable", ACTIVITY_SERVICE_URL: "http://activity:8080", LIFE_OS_TIMEZONE: "${LIFE_OS_TIMEZONE:-UTC}", FINANCE_DEFAULT_CURRENCY: "${LIFE_OS_FINANCE_CURRENCY:-EUR}", NOTIFICATIONS_SERVICE_URL: "http://notifications:8080"}
    expose: ["8080"]
    depends_on: {finance-migrate: {condition: service_completed_successfully}}
    networks: [backend]
    restart: unless-stopped

  tasks-migrate:
    image: migrate/migrate:v4.18.3
    command: ["-path", "/migrations", "-database", "postgres://tasks_user:${LIFE_OS_TASKS_DB_PASSWORD}@postgres:5432/tasks_db?sslmode=disable", "up"]
    volumes: ["./services/tasks/db/migrations:/migrations:ro"]
    depends_on: {postgres: {condition: service_healthy}}
    networks: [backend]
    restart: "no"
  tasks:
    build: {context: ., dockerfile: services/tasks/Dockerfile}
    environment: {SERVICE_NAME: tasks, PORT: 8080, DATABASE_URL: "postgres://tasks_user:${LIFE_OS_TASKS_DB_PASSWORD}@postgres:5432/tasks_db?sslmode=disable", ACTIVITY_SERVICE_URL: "http://activity:8080", LIFE_OS_TIMEZONE: "${LIFE_OS_TIMEZONE:-UTC}", NOTIFICATIONS_SERVICE_URL: "http://notifications:8080", CALENDAR_SERVICE_URL: "http://calendar:8080", TASKS_SUMMARY_TIME: "${LIFE_OS_TASKS_SUMMARY_TIME:-08:00}", TASKS_MORNING_TIME: "${LIFE_OS_TASKS_MORNING_TIME:-09:00}", TASKS_EVENING_TIME: "${LIFE_OS_TASKS_EVENING_TIME:-19:00}", TASKS_TIMED_LEAD_MINUTES: "${LIFE_OS_TASKS_TIMED_LEAD_MINUTES:-30}"}
    expose: ["8080"]
    depends_on: {tasks-migrate: {condition: service_completed_successfully}}
    networks: [backend]
    restart: unless-stopped

  food-migrate:
    image: migrate/migrate:v4.18.3
    command: ["-path", "/migrations", "-database", "postgres://food_user:${LIFE_OS_FOOD_DB_PASSWORD}@postgres:5432/food_db?sslmode=disable", "up"]
    volumes: ["./services/food/db/migrations:/migrations:ro"]
    depends_on: {postgres: {condition: service_healthy}}
    networks: [backend]
    restart: "no"
  # The shopping list, stores, aisle rules, and pantry (docs/services/food.md).
  # LIFE_OS_TIMEZONE is the owner's "today" for expiringWithinDays.
  food:
    build: {context: ., dockerfile: services/food/Dockerfile}
    environment: {SERVICE_NAME: food, PORT: 8080, DATABASE_URL: "postgres://food_user:${LIFE_OS_FOOD_DB_PASSWORD}@postgres:5432/food_db?sslmode=disable", ACTIVITY_SERVICE_URL: "http://activity:8080", LIFE_OS_TIMEZONE: "${LIFE_OS_TIMEZONE:-UTC}", NOTIFICATIONS_SERVICE_URL: "http://notifications:8080", FOOD_EXPIRY_TIME: "${LIFE_OS_FOOD_EXPIRY_TIME:-08:00}"}
    expose: ["8080"]
    depends_on: {food-migrate: {condition: service_completed_successfully}}
    networks: [backend]
    restart: unless-stopped

  inbox-migrate:
    image: migrate/migrate:v4.18.3
    command: ["-path", "/migrations", "-database", "postgres://inbox_user:${LIFE_OS_INBOX_DB_PASSWORD}@postgres:5432/inbox_db?sslmode=disable", "up"]
    volumes: ["./services/inbox/db/migrations:/migrations:ro"]
    depends_on: {postgres: {condition: service_healthy}}
    networks: [backend]
    restart: "no"
  # Capture images (photos shared or attached to captures) live on the
  # inbox-media volume, one file per image named by its SHA-256
  # (docs/services/inbox.md#capture-images).
  inbox:
    build: {context: ., dockerfile: services/inbox/Dockerfile}
    environment: {SERVICE_NAME: inbox, PORT: 8080, DATABASE_URL: "postgres://inbox_user:${LIFE_OS_INBOX_DB_PASSWORD}@postgres:5432/inbox_db?sslmode=disable", ACTIVITY_SERVICE_URL: "http://activity:8080", NOTIFICATIONS_SERVICE_URL: "http://notifications:8080", INBOX_MEDIA_DIR: /var/lib/lifeos/inbox-media, INBOX_MEDIA_MAX_BYTES: "${LIFE_OS_INBOX_MEDIA_MAX_BYTES:-10485760}"}
    volumes: ["inbox-media:/var/lib/lifeos/inbox-media"]
    expose: ["8080"]
    depends_on: {inbox-migrate: {condition: service_completed_successfully}}
    networks: [backend]
    restart: unless-stopped

  calendar-migrate:
    image: migrate/migrate:v4.18.3
    command: ["-path", "/migrations", "-database", "postgres://calendar_user:${LIFE_OS_CALENDAR_DB_PASSWORD}@postgres:5432/calendar_db?sslmode=disable", "up"]
    volumes: ["./services/calendar/db/migrations:/migrations:ro"]
    depends_on: {postgres: {condition: service_healthy}}
    networks: [backend]
    restart: "no"
  calendar:
    build: {context: ., dockerfile: services/calendar/Dockerfile}
    environment: {SERVICE_NAME: calendar, PORT: 8080, DATABASE_URL: "postgres://calendar_user:${LIFE_OS_CALENDAR_DB_PASSWORD}@postgres:5432/calendar_db?sslmode=disable", LIFE_OS_TIMEZONE: "${LIFE_OS_TIMEZONE:-UTC}", ACTIVITY_SERVICE_URL: "http://activity:8080", NOTIFICATIONS_SERVICE_URL: "http://notifications:8080"}
    expose: ["8080"]
    depends_on: {calendar-migrate: {condition: service_completed_successfully}}
    networks: [backend]
    restart: unless-stopped

  calendar-feeds-migrate:
    image: migrate/migrate:v4.18.3
    command: ["-path", "/migrations", "-database", "postgres://calendar_feeds_user:${LIFE_OS_CALENDAR_FEEDS_DB_PASSWORD}@postgres:5432/calendar_feeds_db?sslmode=disable", "up"]
    volumes: ["./services/calendar-feeds/db/migrations:/migrations:ro"]
    depends_on: {postgres: {condition: service_healthy}}
    networks: [backend]
    restart: "no"
  # The ICS/iCal feed integration (docs/services/calendar-feeds.md): it owns
  # the feeds (URL, filter, the ZAW preset from LIFE_OS_ZAW_ICS_URL, which
  # names a street and is never logged), downloads them over outbound HTTPS
  # from the backend network, and syncs their events into Calendar only
  # through its integration API. It publishes nothing; the gateway routes
  # /api/integrations/calendar-feeds/.
  calendar-feeds:
    build: {context: ., dockerfile: services/calendar-feeds/Dockerfile}
    environment:
      SERVICE_NAME: calendar-feeds
      PORT: 8080
      DATABASE_URL: "postgres://calendar_feeds_user:${LIFE_OS_CALENDAR_FEEDS_DB_PASSWORD}@postgres:5432/calendar_feeds_db?sslmode=disable"
      CALENDAR_SERVICE_URL: http://calendar:8080
      ACTIVITY_SERVICE_URL: http://activity:8080
      LIFE_OS_TIMEZONE: "${LIFE_OS_TIMEZONE:-UTC}"
      CALENDAR_FEEDS_REFRESH_AT: "${LIFE_OS_CALENDAR_SOURCE_REFRESH_AT:-04:30}"
      LIFE_OS_ZAW_ICS_URL: "${LIFE_OS_ZAW_ICS_URL:-}"
    expose: ["8080"]
    depends_on:
      calendar-feeds-migrate: {condition: service_completed_successfully}
      calendar: {condition: service_started}
    networks: [backend]
    restart: unless-stopped

  # Reads recipes from links and pasted text and saves them in Food through
  # Food's API (docs/services/recipe-import.md). No database. It needs
  # outbound http(s) from the backend network to fetch recipe pages.
  recipe-import:
    build: {context: ., dockerfile: services/recipe-import/Dockerfile}
    environment:
      SERVICE_NAME: recipe-import
      PORT: 8080
      FOOD_SERVICE_URL: http://food:8080
      ACTIVITY_SERVICE_URL: http://activity:8080
    expose: ["8080"]
    networks: [backend]
    restart: unless-stopped

  activity-migrate:
    image: migrate/migrate:v4.18.3
    command: ["-path", "/migrations", "-database", "postgres://activity_user:${LIFE_OS_ACTIVITY_DB_PASSWORD}@postgres:5432/activity_db?sslmode=disable", "up"]
    volumes: ["./services/activity/db/migrations:/migrations:ro"]
    depends_on: {postgres: {condition: service_healthy}}
    networks: [backend]
    restart: "no"
  activity:
    build: {context: ., dockerfile: services/activity/Dockerfile}
    environment: {SERVICE_NAME: activity, PORT: 8080, DATABASE_URL: "postgres://activity_user:${LIFE_OS_ACTIVITY_DB_PASSWORD}@postgres:5432/activity_db?sslmode=disable"}
    expose: ["8080"]
    depends_on: {activity-migrate: {condition: service_completed_successfully}}
    networks: [backend]
    restart: unless-stopped

  notifications-migrate:
    image: migrate/migrate:v4.18.3
    command: ["-path", "/migrations", "-database", "postgres://notifications_user:${LIFE_OS_NOTIFICATIONS_DB_PASSWORD}@postgres:5432/notifications_db?sslmode=disable", "up"]
    volumes: ["./services/notifications/db/migrations:/migrations:ro"]
    depends_on: {postgres: {condition: service_healthy}}
    networks: [backend]
    restart: "no"
  # The one path for notifications to the owner. Channels are configured here
  # (LIFE_OS_NOTIFICATIONS_CHANNELS); none by default, so notifications are
  # stored and listed in the Dashboard only. "ntfy" publishes to the ntfy
  # service below with the publisher token (docs/operations/ntfy.md), over
  # the internal notify-internal network, which only the two of them share.
  # "webpush" pushes to the browsers that turned on notifications (the
  # installed Life OS app) with the VAPID keys (LIFE_OS_WEBPUSH_*, empty by
  # default), through their vendors' push services (fcm.googleapis.com,
  # updates.push.services.mozilla.com, …) over HTTPS: the backend network's
  # outbound access, as for the other integrations.
  notifications:
    build: {context: ., dockerfile: services/notifications/Dockerfile}
    environment:
      SERVICE_NAME: notifications
      PORT: 8080
      DATABASE_URL: "postgres://notifications_user:${LIFE_OS_NOTIFICATIONS_DB_PASSWORD}@postgres:5432/notifications_db?sslmode=disable"
      ACTIVITY_SERVICE_URL: "http://activity:8080"
      NOTIFICATIONS_CHANNELS: "${LIFE_OS_NOTIFICATIONS_CHANNELS:-}"
      NOTIFICATIONS_NTFY_URL: "http://ntfy:80"
      NOTIFICATIONS_NTFY_TOPIC: "${LIFE_OS_NTFY_TOPIC:-lifeos}"
      NOTIFICATIONS_NTFY_TOKEN: "${LIFE_OS_NTFY_PUBLISHER_TOKEN:-}"
      NOTIFICATIONS_LINK_BASE_URL: "${LIFE_OS_PUBLIC_URL:-https://lifeos.gamch1k.com}"
      NOTIFICATIONS_WEBPUSH_VAPID_PUBLIC_KEY: "${LIFE_OS_WEBPUSH_VAPID_PUBLIC_KEY:-}"
      NOTIFICATIONS_WEBPUSH_VAPID_PRIVATE_KEY: "${LIFE_OS_WEBPUSH_VAPID_PRIVATE_KEY:-}"
      NOTIFICATIONS_WEBPUSH_SUBJECT: "${LIFE_OS_WEBPUSH_SUBJECT:-}"
    expose: ["8080"]
    depends_on: {notifications-migrate: {condition: service_completed_successfully}}
    networks: [backend, notify-internal]
    restart: unless-stopped

  banking-migrate:
    image: migrate/migrate:v4.18.3
    command: ["-path", "/migrations", "-database", "postgres://banking_user:${LIFE_OS_BANKING_DB_PASSWORD}@postgres:5432/banking_db?sslmode=disable", "up"]
    volumes: ["./services/banking/db/migrations:/migrations:ro"]
    depends_on: {postgres: {condition: service_healthy}}
    networks: [backend]
    restart: "no"
  # The bank integration (docs/services/banking.md): read-only Enable Banking
  # consent, scheduled syncs pushed into Finance through its bank import API.
  # The application's private key is bind-mounted read-only from the host
  # path in LIFE_OS_ENABLE_BANKING_KEY_FILE (unset: an empty /dev/null, and
  # banking reports "not configured"); the container runs as
  # LIFE_OS_BANKING_RUNTIME_UID, the key file's owner, with a read-only root.
  # It reaches api.enablebanking.com through the backend network's outbound
  # access and publishes nothing; the gateway routes /api/integrations/banking/.
  banking:
    build: {context: ., dockerfile: services/banking/Dockerfile}
    environment:
      SERVICE_NAME: banking
      PORT: 8080
      DATABASE_URL: "postgres://banking_user:${LIFE_OS_BANKING_DB_PASSWORD}@postgres:5432/banking_db?sslmode=disable"
      FINANCE_SERVICE_URL: http://finance:8080
      NOTIFICATIONS_SERVICE_URL: http://notifications:8080
      ACTIVITY_SERVICE_URL: http://activity:8080
      LIFE_OS_TIMEZONE: "${LIFE_OS_TIMEZONE:-UTC}"
      LIFE_OS_ENABLE_BANKING_APP_ID: "${LIFE_OS_ENABLE_BANKING_APP_ID:-}"
      LIFE_OS_ENABLE_BANKING_KEY_FILE: /run/secrets/enablebanking.pem
      LIFE_OS_BANKING_TOKEN_KEY: "${LIFE_OS_BANKING_TOKEN_KEY:-}"
      LIFE_OS_BANKING_REDIRECT_URI: "${LIFE_OS_BANKING_REDIRECT_URI:-https://lifeos.gamch1k.com/finance/bank/callback}"
      BANKING_SYNC_TIMES: "${LIFE_OS_BANKING_SYNC_TIMES:-06:00,12:00,18:00,23:00}"
      BANKING_CONSENT_DAYS: "${LIFE_OS_BANKING_CONSENT_DAYS:-180}"
    volumes:
      - type: bind
        source: "${LIFE_OS_ENABLE_BANKING_KEY_FILE:-/dev/null}"
        target: /run/secrets/enablebanking.pem
        read_only: true
    user: "${LIFE_OS_BANKING_RUNTIME_UID:-1000}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    expose: ["8080"]
    depends_on:
      banking-migrate: {condition: service_completed_successfully}
      finance: {condition: service_started}
    networks: [backend]
    restart: unless-stopped

  google-calendar-migrate:
    image: migrate/migrate:v4.18.3
    command: ["-path", "/migrations", "-database", "postgres://google_calendar_user:${LIFE_OS_GOOGLE_CALENDAR_DB_PASSWORD}@postgres:5432/google_calendar_db?sslmode=disable", "up"]
    volumes: ["./services/google-calendar/db/migrations:/migrations:ro"]
    depends_on: {postgres: {condition: service_healthy}}
    networks: [backend]
    restart: "no"
  # The Google Calendar integration (docs/services/google-calendar.md): the
  # owner's Google connection (OAuth, the refresh token sealed with
  # LIFE_OS_GOOGLE_TOKEN_KEY), the calendars chosen to sync, and the two-way
  # sync with Calendar through Calendar's integration API only. Unset Google
  # settings leave it "not configured". It reaches Google through the
  # backend network's outbound access and publishes nothing; the gateway
  # routes /api/integrations/google-calendar/.
  google-calendar:
    build: {context: ., dockerfile: services/google-calendar/Dockerfile}
    environment:
      SERVICE_NAME: google-calendar
      PORT: 8080
      DATABASE_URL: "postgres://google_calendar_user:${LIFE_OS_GOOGLE_CALENDAR_DB_PASSWORD}@postgres:5432/google_calendar_db?sslmode=disable"
      CALENDAR_SERVICE_URL: http://calendar:8080
      ACTIVITY_SERVICE_URL: http://activity:8080
      LIFE_OS_TIMEZONE: "${LIFE_OS_TIMEZONE:-UTC}"
      LIFE_OS_GOOGLE_CLIENT_ID: "${LIFE_OS_GOOGLE_CLIENT_ID:-}"
      LIFE_OS_GOOGLE_CLIENT_SECRET: "${LIFE_OS_GOOGLE_CLIENT_SECRET:-}"
      LIFE_OS_GOOGLE_TOKEN_KEY: "${LIFE_OS_GOOGLE_TOKEN_KEY:-}"
      LIFE_OS_GOOGLE_REDIRECT_URI: "${LIFE_OS_GOOGLE_REDIRECT_URI:-https://lifeos.gamch1k.com/calendar/google/callback}"
      GOOGLE_CALENDAR_SYNC_SECONDS: "${LIFE_OS_CALENDAR_GOOGLE_SYNC_SECONDS:-120}"
      GOOGLE_CALENDAR_FEED_SECONDS: "${LIFE_OS_GOOGLE_CALENDAR_FEED_SECONDS:-15}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    expose: ["8080"]
    depends_on:
      google-calendar-migrate: {condition: service_completed_successfully}
      calendar: {condition: service_started}
    networks: [backend]
    restart: unless-stopped

  dashboard:
    build: {context: ., dockerfile: apps/dashboard/Dockerfile}
    environment:
      FINANCE_SERVICE_URL: http://finance:8080
      TASKS_SERVICE_URL: http://tasks:8080
      INBOX_SERVICE_URL: http://inbox:8080
      CALENDAR_SERVICE_URL: http://calendar:8080
      CALENDAR_FEEDS_SERVICE_URL: http://calendar-feeds:8080
      VOICE_SERVICE_URL: http://voice:8080
      ACTIVITY_SERVICE_URL: http://activity:8080
      NOTIFICATIONS_SERVICE_URL: http://notifications:8080
      PROCESSOR_STATUS_URL: http://processor:8081
      MONITOR_SERVICE_URL: http://monitor:8080
      BANKING_SERVICE_URL: http://banking:8080
      GOOGLE_CALENDAR_SERVICE_URL: http://google-calendar:8080
      FOOD_SERVICE_URL: http://food:8080
      BACKUP_SERVICE_URL: http://backup:8080
      HOST_HEALTH_SERVICE_URL: http://host-health:8080
      RECIPE_IMPORT_SERVICE_URL: http://recipe-import:8080
      LIFE_OS_TIMEZONE: ${LIFE_OS_TIMEZONE:-UTC}
    expose: ["3000"]
    depends_on:
      finance: {condition: service_started}
      tasks: {condition: service_started}
      inbox: {condition: service_started}
      calendar: {condition: service_started}
    networks: [backend]
    restart: unless-stopped

  # Reads the Dashboard's runtime status (/api/status) every minute and
  # notifies the owner through Notifications when a check breaks or recovers
  # (docs/services/monitor.md). No database and no gateway route.
  monitor:
    build: {context: ., dockerfile: services/monitor/Dockerfile}
    environment: {SERVICE_NAME: monitor, PORT: 8080, MONITOR_STATUS_URL: "http://dashboard:3000/api/status", NOTIFICATIONS_SERVICE_URL: "http://notifications:8080", MONITOR_INTERVAL_SECONDS: "${LIFE_OS_MONITOR_INTERVAL_SECONDS:-60}", MONITOR_CONFIRMATIONS: "${LIFE_OS_MONITOR_CONFIRMATIONS:-2}"}
    expose: ["8080"]
    depends_on:
      dashboard: {condition: service_started}
      notifications: {condition: service_started}
    networks: [backend]
    restart: unless-stopped

  # Nightly backups of every database in the registry (docs/services/backup.md):
  # one consistent pg_dump per database into LIFE_OS_BACKUP_DIR/auto/ on the
  # host, rotated daily, weekly, and monthly. It logs in as lifeos_backup, a
  # read-only role (infra/postgres/provision-backup-role.sh), and runs as
  # LIFE_OS_BACKUP_RUNTIME_UID, the backup directory's owner. infra/postgres
  # is mounted as a directory so an updated registry is read at the next run
  # without recreating the container. The image is the PostgreSQL image, so
  # pg_dump matches the server. No gateway route: the Dashboard reaches its
  # API on the private network; tools/backup-now runs a backup now.
  backup:
    build:
      context: .
      dockerfile: services/backup/Dockerfile
      args: {POSTGRES_IMAGE: "${LIFE_OS_POSTGRES_IMAGE:-postgres:18.6-alpine}"}
    environment:
      SERVICE_NAME: backup
      PORT: 8080
      BACKUP_DATABASE_URL: "postgres://lifeos_backup@postgres:5432/?sslmode=disable"
      BACKUP_DATABASE_PASSWORD: "${LIFE_OS_BACKUP_DB_PASSWORD:-}"
      BACKUP_DATABASES_FILE: /etc/lifeos/postgres/service-databases.conf
      BACKUP_DIR: /backups
      BACKUP_TIME: "${LIFE_OS_BACKUP_TIME:-03:15}"
      LIFE_OS_TIMEZONE: "${LIFE_OS_TIMEZONE:-UTC}"
      BACKUP_KEEP_DAILY: "${LIFE_OS_BACKUP_KEEP_DAILY:-7}"
      BACKUP_KEEP_WEEKLY: "${LIFE_OS_BACKUP_KEEP_WEEKLY:-4}"
      BACKUP_KEEP_MONTHLY: "${LIFE_OS_BACKUP_KEEP_MONTHLY:-12}"
      BACKUP_KEEP_FAILED_DAYS: "${LIFE_OS_BACKUP_KEEP_FAILED_DAYS:-3}"
      BACKUP_RESTORE_CHECK_DAY: "${LIFE_OS_BACKUP_RESTORE_CHECK_DAY:-sunday}"
      BACKUP_INBOX_MEDIA_DIR: /media/inbox
    volumes:
      - type: bind
        source: "${LIFE_OS_BACKUP_DIR:?Set LIFE_OS_BACKUP_DIR in .env to the existing host directory for backups}"
        target: /backups
      - type: bind
        source: ./infra/postgres
        target: /etc/lifeos/postgres
        read_only: true
      # Inbox's capture images, copied into BACKUP_DIR/media/ each night.
      # Read-only, and nothing of the image is copied into the volume.
      - type: volume
        source: inbox-media
        target: /media/inbox
        read_only: true
        volume: {nocopy: true}
    # The PostgreSQL base image declares a volume here; the tmpfs keeps
    # Docker from creating an anonymous one for every container.
    tmpfs: [/var/lib/postgresql]
    user: "${LIFE_OS_BACKUP_RUNTIME_UID:-1000}"
    # The group Inbox's media files belong to (mode 0640): the inbox image's
    # lifeos group. `docker compose exec inbox id -g` prints it.
    group_add: ["${LIFE_OS_INBOX_MEDIA_GID:-101}"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    expose: ["8080"]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [backend]
    restart: unless-stopped
    # Room to stop a run in progress, remove its files, and record it.
    stop_grace_period: 30s

  # How the server is doing, for the Status page's Server check
  # (docs/services/host-health.md): memory, load, disks, every container on
  # the host, and how much of the server Life OS uses, sampled each minute.
  # It only reads: its own /proc (Docker does not namespace meminfo, loadavg,
  # uptime, or stat, so they are the host's), statfs on read-only,
  # non-recursive binds of / and the Docker data root (as nobody, so it can
  # open only what any unprivileged user could, and nothing of the root
  # directory's other mounts), the containers' cgroups on a read-only bind
  # of system.slice (where Docker's systemd cgroup driver puts each
  # container's docker-<id>.scope; files any local user may read), and the
  # containers through host-health-docker. No gateway route; the Dashboard
  # reads it here.
  host-health:
    build: {context: ., dockerfile: services/host-health/Dockerfile}
    environment:
      SERVICE_NAME: host-health
      PORT: 8080
      HOST_HEALTH_DISKS: root=/host,docker=/host-docker
      HOST_HEALTH_DOCKER_URL: http://host-health-docker:8080
      HOST_HEALTH_CGROUP_DIR: /host-cgroup
      HOST_HEALTH_MEMORY_WARNING_PERCENT: "${LIFE_OS_HOST_HEALTH_MEMORY_WARNING_PERCENT:-15}"
      HOST_HEALTH_MEMORY_WARNING_SAMPLES: "${LIFE_OS_HOST_HEALTH_MEMORY_WARNING_SAMPLES:-3}"
      HOST_HEALTH_MEMORY_PROBLEM_PERCENT: "${LIFE_OS_HOST_HEALTH_MEMORY_PROBLEM_PERCENT:-7}"
      HOST_HEALTH_DISK_WARNING_GIB: "${LIFE_OS_HOST_HEALTH_DISK_WARNING_GIB:-10}"
      HOST_HEALTH_DISK_WARNING_PERCENT: "${LIFE_OS_HOST_HEALTH_DISK_WARNING_PERCENT:-10}"
      HOST_HEALTH_DISK_PROBLEM_GIB: "${LIFE_OS_HOST_HEALTH_DISK_PROBLEM_GIB:-3}"
      HOST_HEALTH_LOAD_WARNING_PER_CPU: "${LIFE_OS_HOST_HEALTH_LOAD_WARNING_PER_CPU:-1}"
      HOST_HEALTH_RESTART_LOOP_COUNT: "${LIFE_OS_HOST_HEALTH_RESTART_LOOP_COUNT:-3}"
      HOST_HEALTH_RESTART_LOOP_MINUTES: "${LIFE_OS_HOST_HEALTH_RESTART_LOOP_MINUTES:-15}"
      HOST_HEALTH_UNHEALTHY_MINUTES: "${LIFE_OS_HOST_HEALTH_UNHEALTHY_MINUTES:-5}"
      # Compose projects left out of findings and the top memory users: the
      # verification stack, which test runs bring up and down.
      HOST_HEALTH_IGNORE_PROJECTS: "${LIFE_OS_HOST_HEALTH_IGNORE_PROJECTS:-lifeos-verify}"
    volumes:
      - type: bind
        source: /
        target: /host
        read_only: true
        bind: {recursive: disabled}
      - type: bind
        source: "${LIFE_OS_DOCKER_ROOT:-/var/lib/docker}"
        target: /host-docker
        read_only: true
        bind: {recursive: disabled}
      # Only system.slice, not all of /sys/fs/cgroup: no users' sessions
      # (user.slice) and none of the root cgroup's files.
      - type: bind
        source: "${LIFE_OS_DOCKER_CGROUP_DIR:-/sys/fs/cgroup/system.slice}"
        target: /host-cgroup
        read_only: true
        bind: {recursive: disabled}
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    expose: ["8080"]
    networks: [backend, host-docker]
    restart: unless-stopped

  # The read-only docker gateway (docs/services/host-health.md#the-docker-gateway):
  # the only container that opens the Docker socket. It answers host-health's
  # three fixed questions (the containers; a stream of their die, start,
  # kill, stop, and destroy events; one container's memory) with fixed
  # requests of its own and re-encodes only what host-health needs: no
  # inspect (every container's environment), logs, files, exec, or writes.
  # The socket's :ro does not limit the API; the gateway does. It runs as
  # nobody in the socket's group (LIFE_OS_DOCKER_GID), on an internal
  # network shared with host-health only.
  host-health-docker:
    build: {context: ., dockerfile: services/host-health/Dockerfile}
    entrypoint: ["/service", "docker-gateway"]
    environment: {PORT: 8080, DOCKER_GATEWAY_SOCKET: /var/run/docker.sock}
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
    user: "65534:${LIFE_OS_DOCKER_GID:-999}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    expose: ["8080"]
    networks: [host-docker]
    restart: unless-stopped

  mcp:
    build: {context: ., dockerfile: services/mcp/Dockerfile, target: service}
    environment:
      SERVICE_NAME: mcp
      PORT: 8080
      FINANCE_SERVICE_URL: http://finance:8080
      TASKS_SERVICE_URL: http://tasks:8080
      INBOX_SERVICE_URL: http://inbox:8080
      CALENDAR_SERVICE_URL: http://calendar:8080
      FOOD_SERVICE_URL: http://food:8080
      RECIPE_IMPORT_SERVICE_URL: http://recipe-import:8080
      ACTIVITY_SERVICE_URL: http://activity:8080
      # The Task and event tools show times, and move them, on this clock.
      LIFE_OS_TIMEZONE: ${LIFE_OS_TIMEZONE:-UTC}
    expose: ["8080"]
    depends_on:
      finance: {condition: service_started}
      tasks: {condition: service_started}
      inbox: {condition: service_started}
      calendar: {condition: service_started}
      food: {condition: service_started}
      recipe-import: {condition: service_started}
    networks: [backend]
    restart: unless-stopped

  processor:
    build: {context: ., dockerfile: services/mcp/Dockerfile, target: processor}
    environment:
      MCP_SERVICE_URL: http://mcp:8080/mcp
      # A capture's images are read from Inbox (GET /v1/media/{sha256}) and
      # handed to Codex as files in the workdir, a tmpfs.
      INBOX_SERVICE_URL: http://inbox:8080
      LIFE_OS_CODEX_WORKDIR: /workspace
      LIFE_OS_CODEX_MODEL: ${LIFE_OS_CODEX_MODEL:-gpt-5.6-luna}
      LIFE_OS_CODEX_REASONING_EFFORT: ${LIFE_OS_CODEX_REASONING_EFFORT:-medium}
      LIFE_OS_PROCESSOR_POLL_MILLIS: ${LIFE_OS_PROCESSOR_POLL_MILLIS:-1000}
      INBOX_CONTEXT_MINUTES: ${LIFE_OS_INBOX_CONTEXT_MINUTES:-20}
      LIFE_OS_PROCESSOR_HEALTH_PORT: 8081
      LIFE_OS_CODEX_TIMEOUT_SECONDS: ${LIFE_OS_CODEX_TIMEOUT_SECONDS:-300}
      LIFE_OS_CODEX_MAX_CONCURRENCY: ${LIFE_OS_CODEX_MAX_CONCURRENCY:-1}
      LIFE_OS_PROCESSOR_STALE_AFTER_SECONDS: ${LIFE_OS_PROCESSOR_STALE_AFTER_SECONDS:-120}
      LIFE_OS_IDEAS_TIME: ${LIFE_OS_IDEAS_TIME:-16:00}
      LIFE_OS_IDEAS_WEB_SEARCH: ${LIFE_OS_IDEAS_WEB_SEARCH:-disabled}
      LIFE_OS_AI_CATEGORIES: ${LIFE_OS_AI_CATEGORIES:-on}
      LIFE_OS_AI_BUDGET_PLANS: ${LIFE_OS_AI_BUDGET_PLANS:-on}
      LIFE_OS_AI_BUDGET_PLAN_MONTHLY: ${LIFE_OS_AI_BUDGET_PLAN_MONTHLY:-on}
      LIFE_OS_TIMEZONE: ${LIFE_OS_TIMEZONE:-UTC}
      TZ: ${LIFE_OS_TIMEZONE:-UTC}
      CODEX_HOME: /tmp/lifeos-codex
    volumes:
      - type: bind
        source: ${LIFE_OS_CODEX_HOME_HOST_PATH:?Set LIFE_OS_CODEX_HOME_HOST_PATH in .env to your existing local Codex home}
        target: /run/lifeos-codex-source
        read_only: true
    tmpfs:
      - /tmp
      - /var/lib/lifeos/codex
      # World-writable like /tmp: with options given, Docker mounts the tmpfs
      # root-owned, and the processor runs as LIFE_OS_CODEX_RUNTIME_UID.
      - /workspace:size=128m,mode=1777
    expose: ["8081"]
    depends_on:
      mcp: {condition: service_started}
      inbox: {condition: service_started}
      tasks: {condition: service_started}
      calendar: {condition: service_started}
      finance: {condition: service_started}
      food: {condition: service_started}
      recipe-import: {condition: service_started}
    networks: [backend]
    restart: unless-stopped
    user: "${LIFE_OS_CODEX_RUNTIME_UID:?Set LIFE_OS_CODEX_RUNTIME_UID in .env to the UID which owns the local Codex session}"
    # Room to stop a Codex run gracefully and record the attempt's outcome.
    stop_grace_period: 30s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  whisper:
    build: {context: services/voice/whisper, dockerfile: Dockerfile}
    environment:
      WHISPER_MODEL_PATH: ${LIFE_OS_WHISPER_MODEL_PATH:-/models/ggml-base.bin}
      WHISPER_MODEL_URL: ${LIFE_OS_WHISPER_MODEL_URL:-https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin}
      WHISPER_THREADS: ${LIFE_OS_WHISPER_THREADS:-2}
      WHISPER_MAX_CONCURRENCY: ${LIFE_OS_WHISPER_MAX_CONCURRENCY:-1}
      WHISPER_MAX_AUDIO_BYTES: ${LIFE_OS_WHISPER_MAX_AUDIO_BYTES:-26214400}
    volumes: ["whisper-models:/models"]
    expose: ["8080"]
    networks: [backend]
    restart: unless-stopped
    cpus: ${LIFE_OS_WHISPER_CPUS:-2.0}
    mem_limit: ${LIFE_OS_WHISPER_MEMORY:-2g}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 2m

  voice-migrate:
    image: migrate/migrate:v4.18.3
    command: ["-path", "/migrations", "-database", "postgres://voice_user:${LIFE_OS_VOICE_DB_PASSWORD}@postgres:5432/voice_db?sslmode=disable", "up"]
    volumes: ["./services/voice/db/migrations:/migrations:ro"]
    depends_on: {postgres: {condition: service_healthy}}
    networks: [backend]
    restart: "no"
  voice:
    build: {context: ., dockerfile: services/voice/Dockerfile}
    environment:
      SERVICE_NAME: voice
      PORT: 8080
      DATABASE_URL: "postgres://voice_user:${LIFE_OS_VOICE_DB_PASSWORD}@postgres:5432/voice_db?sslmode=disable"
      VOICE_STORAGE_DIR: /var/lib/lifeos/voice
      VOICE_RETENTION_HOURS: ${LIFE_OS_VOICE_RETENTION_HOURS:-168}
      VOICE_MAX_UPLOAD_BYTES: ${LIFE_OS_VOICE_MAX_UPLOAD_BYTES:-26214400}
      ACTIVITY_SERVICE_URL: http://activity:8080
    volumes: ["voice-audio:/var/lib/lifeos/voice"]
    expose: ["8080"]
    depends_on: {voice-migrate: {condition: service_completed_successfully}}
    networks: [backend]
    restart: unless-stopped
  voice-worker:
    build: {context: ., dockerfile: services/voice/Dockerfile}
    entrypoint: ["/worker"]
    environment:
      SERVICE_NAME: voice-worker
      DATABASE_URL: "postgres://voice_user:${LIFE_OS_VOICE_DB_PASSWORD}@postgres:5432/voice_db?sslmode=disable"
      VOICE_STORAGE_DIR: /var/lib/lifeos/voice
      VOICE_RETENTION_HOURS: ${LIFE_OS_VOICE_RETENTION_HOURS:-168}
      INBOX_SERVICE_URL: http://inbox:8080
      WHISPER_SERVICE_URL: http://whisper:8080
      ACTIVITY_SERVICE_URL: http://activity:8080
      VOICE_WORKER_POLL_MILLIS: ${LIFE_OS_VOICE_WORKER_POLL_MILLIS:-1000}
      VOICE_WORKER_MAX_ATTEMPTS: ${LIFE_OS_VOICE_WORKER_MAX_ATTEMPTS:-3}
      VOICE_WORKER_LEASE_SECONDS: ${LIFE_OS_VOICE_WORKER_LEASE_SECONDS:-120}
      VOICE_WORKER_RETRY_BACKOFF_SECONDS: ${LIFE_OS_VOICE_WORKER_RETRY_BACKOFF_SECONDS:-60}
    volumes: ["voice-audio:/var/lib/lifeos/voice"]
    depends_on:
      voice-migrate: {condition: service_completed_successfully}
      inbox: {condition: service_started}
      whisper: {condition: service_healthy}
    networks: [backend]
    restart: unless-stopped

  gateway:
    image: nginx:1.28-alpine
    # The image renders infra/nginx/life-os.conf.template into
    # /etc/nginx/conf.d/default.conf at every start, replacing only these
    # LIFE_OS_* names: the hosts it serves Life OS to (server_name), which
    # server-names.envsh keeps from repeating 127.0.0.1 and localhost.
    environment:
      NGINX_ENVSUBST_FILTER: "^LIFE_OS_"
      LIFE_OS_PUBLIC_HOSTNAME: "${LIFE_OS_PUBLIC_HOSTNAME:-}"
      LIFE_OS_GATEWAY_BIND_ADDRESS: "${LIFE_OS_GATEWAY_BIND_ADDRESS:-127.0.0.1}"
    volumes:
      - ./infra/nginx/life-os.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./infra/nginx/server-names.envsh:/docker-entrypoint.d/16-lifeos-server-names.envsh:ro
      # The Android apps' releases, served at /android/ behind Access
      # (docs/operations/android-releases.md). tools/publish-android-release
      # writes them as the directory's owner (uid 1000); the gateway only
      # reads. Create the directory first (install -d -m 755): should it be
      # missing, Docker creates it, owned by root, so that the gateway still
      # starts.
      - type: bind
        source: "${LIFE_OS_ANDROID_RELEASES_DIR:-/home/gamch1k/life-os.android}"
        target: /srv/android
        read_only: true
        bind: {create_host_path: true}
    ports: ["${LIFE_OS_GATEWAY_BIND_ADDRESS:-127.0.0.1}:${LIFE_OS_GATEWAY_PORT:-3000}:80"]
    depends_on:
      dashboard: {condition: service_started}
      finance: {condition: service_started}
      tasks: {condition: service_started}
      inbox: {condition: service_started}
      calendar: {condition: service_started}
      mcp: {condition: service_started}
      voice: {condition: service_started}
      activity: {condition: service_started}
      notifications: {condition: service_started}
      banking: {condition: service_started}
      google-calendar: {condition: service_started}
      calendar-feeds: {condition: service_started}
      food: {condition: service_started}
      recipe-import: {condition: service_started}
    # edge: how the Cloudflare connector reaches the gateway (and only it).
    networks: [backend, edge]
    restart: unless-stopped

  # Opt-in ntfy server (COMPOSE_PROFILES=ntfy): push notifications to the
  # owner's phone (docs/operations/ntfy.md). It is on two networks only:
  # notify-edge, with the Cloudflare connector alone (the tunnel route
  # ntfy.gamch1k.com -> http://ntfy:80, without Access: the ntfy app cannot
  # log in through it), and the internal notify-internal, with the
  # Notifications service alone, which publishes to it. It never shares a
  # network with the gateway or the other services, and the connector shares
  # none with Notifications, so that route cannot reach Life OS. ntfy's own deny-all accounts protect it: ntfy provisions the
  # publisher (write-only on the topic, by token) and the phone (read-only, by
  # password) at every start from the ignored .env. Bcrypt hashes and the
  # token never appear in the repository.
  ntfy:
    image: ${LIFE_OS_NTFY_IMAGE:-binwiederhier/ntfy:v2.29.0}
    profiles: [ntfy]
    command: ["serve"]
    environment:
      NTFY_AUTH_USERS: "lifeos-publisher:${LIFE_OS_NTFY_PUBLISHER_PASSWORD_HASH:-}:user,lifeos-phone:${LIFE_OS_NTFY_PHONE_PASSWORD_HASH:-}:user"
      NTFY_AUTH_ACCESS: "lifeos-publisher:${LIFE_OS_NTFY_TOPIC:-lifeos}:write-only,lifeos-phone:${LIFE_OS_NTFY_TOPIC:-lifeos}:read-only"
      NTFY_AUTH_TOKENS: "lifeos-publisher:${LIFE_OS_NTFY_PUBLISHER_TOKEN:-}:notifications-service"
    volumes:
      - ./infra/ntfy/server.yml:/etc/ntfy/server.yml:ro
      - ntfy-data:/var/lib/ntfy
    expose: ["80"]
    networks: [notify-edge, notify-internal]
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Opt-in Cloudflare Tunnel (COMPOSE_PROFILES=cloudflare). An outbound-only
  # connector on the private network that hands Cloudflare traffic to the
  # gateway (lifeos.gamch1k.com, behind Access) and to ntfy (ntfy.gamch1k.com);
  # it publishes no port. The public hostnames and their routes
  # (http://gateway:80, http://ntfy:80) live in the Cloudflare tunnel
  # configuration, and the token comes only from the ignored .env. See
  # docs/operations/cloudflare.md.
  cloudflared:
    image: ${LIFE_OS_CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2026.10.0}
    profiles: [cloudflare]
    command: ["tunnel", "--metrics", "127.0.0.1:20241", "--management-diagnostics=false", "run"]
    environment:
      TUNNEL_TOKEN: ${LIFE_OS_CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      gateway: {condition: service_started}
    # edge reaches only the gateway (Life OS, behind Access); notify-edge
    # reaches only ntfy. Services stay on backend.
    networks: [edge, notify-edge]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  backend:
    name: lifeos-backend
    driver: bridge
  # The Cloudflare connector and the gateway only. The fixed subnet lets the
  # gateway trust Cloudflare's client-address header from this network alone
  # (infra/nginx/life-os.conf).
  edge:
    name: lifeos-edge
    driver: bridge
    ipam:
      config:
        - subnet: 10.255.249.0/29
  # The Cloudflare connector and ntfy only: the tunnel's ntfy route (no
  # Access) reaches ntfy here and nothing of Life OS.
  notify-edge:
    name: lifeos-notify-edge
    driver: bridge
    ipam:
      config:
        - subnet: 10.255.249.16/29
  # ntfy and the Notifications service only, so Notifications can publish
  # without sharing a network with the connector. Internal: no outside access.
  notify-internal:
    name: lifeos-notify-internal
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.255.249.32/29

  # host-health and its docker gateway only. Internal: the gateway, which
  # holds the Docker socket, reaches nothing else and nothing else reaches it.
  host-docker:
    name: lifeos-host-docker
    driver: bridge
    internal: true

volumes:
  postgres-data:
    name: lifeos-postgres-data
  whisper-models:
    name: lifeos-whisper-models
  voice-audio:
    name: lifeos-voice-audio
  inbox-media:
    name: lifeos-inbox-media
  ntfy-data:
    name: lifeos-ntfy-data
