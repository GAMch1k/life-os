# Included from nginx.conf's http context.
limit_req_zone $binary_remote_addr zone=lifeos_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=lifeos_write:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=lifeos_mcp:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=lifeos_client:10m;

# Cloudflare path. Requests from the edge network (10.255.249.0/29, which only
# the cloudflared connector shares with the gateway) carry the visitor's
# address in CF-Connecting-IP and arrived over HTTPS at Cloudflare. The header
# is trusted from that network alone; from WireGuard or anywhere else it is
# ignored, so it cannot be spoofed to fake an address.
geo $realip_remote_addr $via_cloudflare {
  default 0;
  10.255.249.0/29 1;
}
map $via_cloudflare $forwarded_proto {
  1 https;
  default $scheme;
}
# Every request that reaches Life OS through the tunnel passed Cloudflare
# Access, which adds its token (Cf-Access-Jwt-Assertion; the connector also
# validates it). One without it came through a route without Access, such as
# a mistaken route to the gateway, and is refused rather than served Life OS.
map "$via_cloudflare:$http_cf_access_jwt_assertion" $missing_access_token {
  default 0;
  "1:" 1;
}

# Attribution (pkg/activity). Public clients may say they are the owner
# ("user") or a development tool ("dev:<name>"), which cannot impersonate
# anyone internal. Claims to be the Life OS AI ("agent:") or a component
# ("system:") are dropped, so such a write fails the services' actor gate.
# Internal callers reach the services over the private network, not here.
map $http_x_life_os_actor $public_actor {
  default "";
  "user" "user";
  "~^dev:[A-Za-z0-9._-]{1,64}$" $http_x_life_os_actor;
}

# Only the hosts listed in the Life OS server_name below reach Life OS. Any
# other Host (a forged one, a mistaken tunnel route, a scanner) gets no answer
# at all: 444 closes the connection.
server {
  listen 80 default_server;
  server_name _;
  server_tokens off;
  return 444;
}

# Life OS.
server {
  listen 80;
  # The hosts that reach Life OS, the one list (tools/check-gateway-hosts
  # checks its form). The gateway matches the Host header without its port.
  #  - lifeos.gamch1k.com: the public hostname (Cloudflare Access, then the
  #    tunnel's connector).
  #  - 10.66.66.1: the WireGuard address the deployment publishes on
  #    (http://10.66.66.1:3001), for peers and for maintenance on the host.
  #  - 127.0.0.1 and localhost: the default loopback bind (127.0.0.1:3000),
  #    the verification stack (127.0.0.1:13001) with its smokes and browser
  #    tests, and the smokes that ask Compose for the published address.
  # To serve Life OS under another name, such as a host Nginx's hostname
  # (docs/host-nginx-example.conf), add it here.
  server_name lifeos.gamch1k.com 10.66.66.1 127.0.0.1 localhost;
  server_tokens off;
  set_real_ip_from 10.255.249.0/29;
  real_ip_header CF-Connecting-IP;
  if ($missing_access_token) { return 403; }
  client_max_body_size 26m;
  client_header_timeout 15s;
  client_body_timeout 30s;
  send_timeout 60s;
  keepalive_timeout 30s;
  limit_req_status 429;
  limit_conn_status 429;
  limit_conn lifeos_client 20;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
  # Set by the Android downloads (location /android/ below) and empty
  # everywhere else, where add_header then sends nothing. An add_header in
  # a location would replace the four above there, so the downloads set
  # these variables instead.
  set $android_cache_control "";
  set $android_content_disposition "";
  add_header Cache-Control $android_cache_control;
  add_header Content-Disposition $android_content_disposition;

  # Never forward a caller-supplied chain of proxy headers.
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
  # Services never see Cloudflare identity or address headers: none of them
  # authenticates with Cloudflare, and a forwarded copy could be spoofed.
  proxy_set_header CF-Connecting-IP "";
  proxy_set_header Cf-Access-Jwt-Assertion "";
  proxy_set_header Cf-Access-Authenticated-User-Email "";
  # Only user and dev:<name> actors pass; workflow links are set by services.
  proxy_set_header X-Life-OS-Actor $public_actor;
  proxy_set_header X-Correlation-ID "";
  proxy_set_header X-Causation-ID "";
  proxy_http_version 1.1;
  proxy_connect_timeout 5s;
  proxy_send_timeout 60s;
  proxy_read_timeout 60s;

  # Upstream names are resolved when a request comes, through Docker's
  # embedded DNS, and kept at most 10 s (BUG-37). A proxy_pass with a fixed
  # host name is resolved once, when nginx starts: a service recreated by a
  # redeploy gets a new address, and the gateway kept sending its traffic to
  # the old one, which by then could belong to another container. Every
  # proxy_pass below therefore names its upstream through a variable, which
  # makes nginx resolve it at request time, and strips its location prefix
  # with a rewrite, as proxy_pass with a URI did (a proxy_pass whose host is
  # a variable sends a URI given there as is, for every request). The query
  # string follows the rewritten path unchanged. A name that does not
  # resolve (the service is not running) is a 502 for that request, not a
  # gateway that cannot start.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  location /api/finance/ {
    limit_req zone=lifeos_api burst=60 nodelay;
    set $upstream finance:8080;
    rewrite ^/api/finance(/.*)$ $1 break;
    proxy_pass http://$upstream;
  }
  location /api/tasks/ {
    limit_req zone=lifeos_api burst=60 nodelay;
    set $upstream tasks:8080;
    rewrite ^/api/tasks(/.*)$ $1 break;
    proxy_pass http://$upstream;
  }
  location /api/inbox/ {
    limit_req zone=lifeos_api burst=60 nodelay;
    set $upstream inbox:8080;
    rewrite ^/api/inbox(/.*)$ $1 break;
    proxy_pass http://$upstream;
  }
  location /api/calendar/ {
    limit_req zone=lifeos_api burst=60 nodelay;
    set $upstream calendar:8080;
    rewrite ^/api/calendar(/.*)$ $1 break;
    proxy_pass http://$upstream;
  }
  location /api/food/ {
    limit_req zone=lifeos_api burst=60 nodelay;
    set $upstream food:8080;
    rewrite ^/api/food(/.*)$ $1 break;
    proxy_pass http://$upstream;
  }
  # Activity is read-only through the gateway; services record events on the
  # private network.
  location /api/activity/ {
    limit_req zone=lifeos_api burst=60 nodelay;
    limit_except GET { deny all; }
    set $upstream activity:8080;
    rewrite ^/api/activity(/.*)$ $1 break;
    proxy_pass http://$upstream;
  }
  location /api/notifications/ {
    limit_req zone=lifeos_api burst=60 nodelay;
    set $upstream notifications:8080;
    rewrite ^/api/notifications(/.*)$ $1 break;
    proxy_pass http://$upstream;
  }
  # Integration services, one prefix each: /api/integrations/<name>/.
  location /api/integrations/banking/ {
    limit_req zone=lifeos_api burst=60 nodelay;
    set $upstream banking:8080;
    rewrite ^/api/integrations/banking(/.*)$ $1 break;
    proxy_pass http://$upstream;
  }
  location /api/integrations/google-calendar/ {
    limit_req zone=lifeos_api burst=60 nodelay;
    set $upstream google-calendar:8080;
    rewrite ^/api/integrations/google-calendar(/.*)$ $1 break;
    proxy_pass http://$upstream;
  }
  location /api/integrations/calendar-feeds/ {
    limit_req zone=lifeos_api burst=60 nodelay;
    set $upstream calendar-feeds:8080;
    rewrite ^/api/integrations/calendar-feeds(/.*)$ $1 break;
    proxy_pass http://$upstream;
  }
  location /api/integrations/recipe-import/ {
    limit_req zone=lifeos_api burst=60 nodelay;
    set $upstream recipe-import:8080;
    rewrite ^/api/integrations/recipe-import(/.*)$ $1 break;
    proxy_pass http://$upstream;
  }
  location /api/voice/ {
    limit_req zone=lifeos_write burst=20 nodelay;
    # An over-limit upload is answered 413 at once, but by default nginx then
    # discards the rest of the body for only 30 s (lingering_time) before it
    # closes. A client or tunnel still sending gets a reset, which Cloudflare
    # reports as 502 (BUG-15). Draining for up to 2 minutes lets the 413
    # arrive intact for any upload faster than about 230 KB/s. The Dashboard
    # also refuses over-limit recordings before uploading.
    lingering_time 120s;
    lingering_timeout 15s;
    set $upstream voice:8080;
    rewrite ^/api/voice(/.*)$ $1 break;
    proxy_pass http://$upstream;
  }
  location /api/mcp/ {
    limit_req zone=lifeos_mcp burst=10 nodelay;
    proxy_buffering off;
    proxy_read_timeout 300s;
    set $upstream mcp:8080;
    rewrite ^/api/mcp(/.*)$ $1 break;
    proxy_pass http://$upstream;
  }
  # Share → Life OS: the phone's share sheet posts what was shared, photos
  # included (up to five of 10 MB), to the Dashboard in one request.
  location = /share {
    limit_req zone=lifeos_write burst=20 nodelay;
    client_max_body_size 60m;
    client_body_timeout 120s;
    # As for Voice: drain an over-limit upload so the 413 arrives intact.
    lingering_time 120s;
    lingering_timeout 15s;
    proxy_read_timeout 120s;
    set $upstream dashboard:3000;
    proxy_pass http://$upstream;
  }
  # Google returns the owner here with a one-time authorization code in the
  # query: keep it out of the access log.
  location = /calendar/google/callback {
    access_log off;
    set $upstream dashboard:3000;
    proxy_pass http://$upstream;
  }
  # The bank returns the owner here with a one-time authorization code in
  # the query: keep it out of the access log too.
  location = /finance/bank/callback {
    access_log off;
    set $upstream dashboard:3000;
    proxy_pass http://$upstream;
  }
  # The Android apps' releases (docs/operations/android-releases.md), which
  # tools/publish-android-release writes to a host directory the gateway
  # mounts read-only at /srv/android. Behind Cloudflare Access like every
  # other path here, never a bypass. Only the download page, the manifest,
  # and the versioned APKs are served: any other name is a 404, there is no
  # listing, and symbolic links are refused. nginx resolves "." and ".."
  # segments (encoded ones too) before it picks a location, so no request
  # leaves /srv/android.
  location = /android {
    absolute_redirect off;
    return 301 /android/;
  }
  location ^~ /android/ {
    # A download is one request, so the general limit never cuts a long one
    # off, and send_timeout bounds a pause between two writes, not the whole
    # download. Files are served to GET and HEAD only (any other method is
    # a 405).
    limit_req zone=lifeos_api burst=60 nodelay;
    root /srv;
    disable_symlinks on;
    autoindex off;
    # The download page.
    location = /android/ {
      set $android_cache_control "no-cache";
      charset utf-8;
      try_files /android/index.html =404;
    }
    # The manifest the app checks for updates.
    location ~ "^/android/updates(\.json)?$" {
      set $android_cache_control "no-cache";
      types { }
      default_type application/json;
      try_files /android/updates.json =404;
    }
    # The APKs. A name carries its version and never changes content, so
    # it is cached for good, by the phone only: "private" keeps Cloudflare
    # from storing a copy outside Access.
    location ~ "^/android/lifeos-(phone|wear)-[0-9A-Za-z][0-9A-Za-z._+-]*-[0-9]+\.apk$" {
      set $android_cache_control "private, max-age=31536000, immutable";
      set $android_content_disposition "attachment";
      types { }
      default_type application/vnd.android.package-archive;
    }
    return 404;
  }
  # The Dashboard's locations pass the request URI as the client sent it,
  # as before: their proxy_pass has no URI.
  location / {
    set $upstream dashboard:3000;
    proxy_pass http://$upstream;
  }
}
