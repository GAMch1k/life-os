# Included from nginx.conf's http context.
limit_req_zone $binary_remote_addr zone=lifeos_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=lifeos_write:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=lifeos_mcp:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=lifeos_client:10m;

# Cloudflare path. Requests from the edge network (10.255.249.0/29, which only
# the cloudflared connector shares with the gateway) carry the visitor's
# address in CF-Connecting-IP and arrived over HTTPS at Cloudflare. The header
# is trusted from that network alone; from WireGuard or anywhere else it is
# ignored, so it cannot be spoofed to fake an address. Both servers below
# (Life OS and ntfy) inherit this.
set_real_ip_from 10.255.249.0/29;
real_ip_header CF-Connecting-IP;
geo $realip_remote_addr $via_cloudflare {
  default 0;
  10.255.249.0/29 1;
}
map $via_cloudflare $forwarded_proto {
  1 https;
  default $scheme;
}
# Every request that reaches Life OS through the tunnel passed Cloudflare
# Access, which adds its token (Cf-Access-Jwt-Assertion; the connector also
# validates it). One without it came through a route without Access, such as
# a misconfigured ntfy route, and is refused rather than served Life OS.
map "$via_cloudflare:$http_cf_access_jwt_assertion" $missing_access_token {
  default 0;
  "1:" 1;
}

# Attribution (pkg/activity). Public clients may say they are the owner
# ("user") or a development tool ("dev:<name>"), which cannot impersonate
# anyone internal. Claims to be the Life OS AI ("agent:") or a component
# ("system:") are dropped, so such a write fails the services' actor gate.
# Internal callers reach the services over the private network, not here.
map $http_x_life_os_actor $public_actor {
  default "";
  "user" "user";
  "~^dev:[A-Za-z0-9._-]{1,64}$" $http_x_life_os_actor;
}

# Life OS: every Host except the ntfy hostname below (the public Life OS
# hostname, WireGuard access by IP, and maintenance on the host).
server {
  listen 80 default_server;
  server_name _;
  server_tokens off;
  if ($missing_access_token) { return 403; }
  client_max_body_size 26m;
  client_header_timeout 15s;
  client_body_timeout 30s;
  send_timeout 60s;
  keepalive_timeout 30s;
  limit_req_status 429;
  limit_conn_status 429;
  limit_conn lifeos_client 20;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;

  # Never forward a caller-supplied chain of proxy headers.
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
  # Services never see Cloudflare identity or address headers: none of them
  # authenticates with Cloudflare, and a forwarded copy could be spoofed.
  proxy_set_header CF-Connecting-IP "";
  proxy_set_header Cf-Access-Jwt-Assertion "";
  proxy_set_header Cf-Access-Authenticated-User-Email "";
  # Only user and dev:<name> actors pass; workflow links are set by services.
  proxy_set_header X-Life-OS-Actor $public_actor;
  proxy_set_header X-Correlation-ID "";
  proxy_set_header X-Causation-ID "";
  proxy_http_version 1.1;
  proxy_connect_timeout 5s;
  proxy_send_timeout 60s;
  proxy_read_timeout 60s;

  location /api/finance/ { limit_req zone=lifeos_api burst=60 nodelay; proxy_pass http://finance:8080/; }
  location /api/tasks/ { limit_req zone=lifeos_api burst=60 nodelay; proxy_pass http://tasks:8080/; }
  location /api/inbox/ { limit_req zone=lifeos_api burst=60 nodelay; proxy_pass http://inbox:8080/; }
  location /api/calendar/ { limit_req zone=lifeos_api burst=60 nodelay; proxy_pass http://calendar:8080/; }
  # Activity is read-only through the gateway; services record events on the
  # private network.
  location /api/activity/ {
    limit_req zone=lifeos_api burst=60 nodelay;
    limit_except GET { deny all; }
    proxy_pass http://activity:8080/;
  }
  location /api/notifications/ { limit_req zone=lifeos_api burst=60 nodelay; proxy_pass http://notifications:8080/; }
  location /api/voice/ {
    limit_req zone=lifeos_write burst=20 nodelay;
    # An over-limit upload is answered 413 at once, but by default nginx then
    # discards the rest of the body for only 30 s (lingering_time) before it
    # closes. A client or tunnel still sending gets a reset, which Cloudflare
    # reports as 502 (BUG-15). Draining for up to 2 minutes lets the 413
    # arrive intact for any upload faster than about 230 KB/s. The Dashboard
    # also refuses over-limit recordings before uploading.
    lingering_time 120s;
    lingering_timeout 15s;
    proxy_pass http://voice:8080/;
  }
  location /api/mcp/ {
    limit_req zone=lifeos_mcp burst=10 nodelay;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_pass http://mcp:8080/;
  }
  # Google returns the owner here with a one-time authorization code in the
  # query: keep it out of the access log.
  location = /calendar/google/callback { access_log off; proxy_pass http://dashboard:3000; }
  location / { proxy_pass http://dashboard:3000; }
}

# ntfy: push notifications to the owner's phone (docs/operations/ntfy.md).
# This hostname reaches the ntfy container and nothing else, and no other Host
# reaches ntfy: tools/check-gateway-hosts asserts both. Its Cloudflare route
# has no Access (the ntfy app cannot log in through it), so ntfy's own
# deny-all accounts protect it.
limit_req_zone $binary_remote_addr zone=ntfy_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=ntfy_client:10m;
map $http_upgrade $ntfy_connection {
  default upgrade;
  "" close;
}

server {
  listen 80;
  server_name ntfy.gamch1k.com;
  server_tokens off;
  # ntfy is optional (the ntfy Compose profile), so it is looked up per
  # request through Docker's DNS: the gateway starts and serves Life OS
  # without it (this host then answers 502) and follows a recreated ntfy.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $ntfy_upstream http://ntfy:80;
  # Attachments are off and a message is at most 4 KiB.
  client_max_body_size 16k;
  client_header_timeout 15s;
  client_body_timeout 30s;
  keepalive_timeout 30s;
  limit_req_status 429;
  limit_conn_status 429;
  limit_conn ntfy_client 10;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;

  location / {
    limit_req zone=ntfy_api burst=30 nodelay;
    proxy_pass $ntfy_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # The phone's subscription: a WebSocket or a long-lived JSON stream.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $ntfy_connection;
    # ntfy rate-limits by visitor (behind-proxy): the real client address.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header Cf-Access-Jwt-Assertion "";
    proxy_set_header Cf-Access-Authenticated-User-Email "";
    proxy_set_header X-Life-OS-Actor "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_connect_timeout 5s;
    # Longer than ntfy's 45 s keepalive, so idle subscriptions stay open.
    proxy_send_timeout 3m;
    proxy_read_timeout 3m;
  }
}
