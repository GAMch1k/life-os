server {
  listen 80;
  server_name _;

  location /api/finance/ { proxy_pass http://finance:8080/; }
  location /api/tasks/ { proxy_pass http://tasks:8080/; }
  location /api/inbox/ { proxy_pass http://inbox:8080/; }
  location /api/calendar/ { proxy_pass http://calendar:8080/; }
  location /api/mcp/ { proxy_pass http://mcp:8080/; }
  location /api/voice/ { return 503; }
  location / { proxy_pass http://dashboard:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
}
