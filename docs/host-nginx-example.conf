# Apply this at the host Nginx layer, not from the Life OS repository.
# The Life OS gateway answers only its listed hosts: add this server_name to
# the Life OS server_name in infra/nginx/life-os.conf (docs/architecture/
# networking.md#gateway-hosts), since Host is forwarded as is.
server {
  listen 443 ssl;
  server_name life.example.com;
  # ssl_certificate ...;
  # auth_basic "Life OS";
  # auth_basic_user_file /etc/nginx/.htpasswd;
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }
}
