# Apply this at the host Nginx layer, not from the Life OS repository.
# The Life OS gateway answers only its listed hosts, and Host is forwarded as
# is: set LIFE_OS_PUBLIC_HOSTNAME=lifeos.example.com (this server_name) and
# LIFE_OS_PUBLIC_URL=https://lifeos.example.com in .env, then recreate the
# gateway (docs/architecture/networking.md#gateway-hosts).
server {
  listen 443 ssl;
  server_name lifeos.example.com;
  # ssl_certificate ...;
  # auth_basic "Life OS";
  # auth_basic_user_file /etc/nginx/.htpasswd;
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }
}
