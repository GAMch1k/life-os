# Life OS behind nginx on the server itself, outside Docker
# (docs/install/access.md#your-own-reverse-proxy). The gateway listens on
# 127.0.0.1:3000, its default. Then, in Life OS's directory:
#
#   ./setup.sh gateway --public-url https://lifeos.example.com --trusted-proxies host
#   ./setup.sh up
#
# which sets LIFE_OS_PUBLIC_URL and LIFE_OS_PUBLIC_HOSTNAME (this
# server_name, which nginx passes on as Host) and LIFE_OS_TRUSTED_PROXIES=host:
# nginx reaches the gateway from Docker's address for the server, and the
# gateway then believes the client's address it passes on. Life OS has its own
# sign-in: no auth_basic in front of it, which would also take away the
# Authorization header that the phone app's device key travels in.
# tools/test-proxy-recipes runs this file in front of the gateway in CI.
server {
  listen 443 ssl;
  http2 on;
  server_name lifeos.example.com;
  ssl_certificate /etc/letsencrypt/live/lifeos.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/lifeos.example.com/privkey.pem;

  # A share is up to five 10 MB photos in one request, a voice note up to
  # 25 MB: the gateway's own limits are 60 MB and 26 MB.
  client_max_body_size 60m;
  client_body_timeout 120s;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # The client's address alone: one a client sent itself never passes.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # An AI tool's answer over MCP streams for up to 5 minutes.
    proxy_buffering off;
    proxy_read_timeout 300s;
  }
}

server {
  listen 80;
  server_name lifeos.example.com;
  return 301 https://$host$request_uri;
}
