openapi: 3.0.3
info:
  title: Life OS Host Health API
  version: 1.0.0
  description: >-
    The server Life OS runs on, as the Status page's Server check sees it:
    its memory, load, disks, uptime, every container on it (all compose
    projects, not only Life OS), and how much of its memory and CPU Life OS
    uses, sampled once a minute, with the findings that need attention and
    the last 24 hours of samples. The service only reads: /proc, statfs on
    read-only bind mounts, the containers' cgroups on a read-only bind, and
    the containers through a read-only Docker gateway that answers three
    fixed questions.
    It has no writes, no database, and no gateway route; the Dashboard
    reads it on the private network.


    Errors use the shared envelope `{"error": {"code", "message"},
    "request_id"}`: `bad_request` (400), `not_ready` (503, nothing has been
    sampled yet), and `internal_error` (500).
  license: {name: UNLICENSED, url: https://life-os.local/license}
servers: [{url: http://host-health:8080}]
paths:
  /v1/status:
    get:
      summary: Get the host's state now
      description: >-
        The latest sample (at most a minute old): memory, load and CPUs,
        uptime, each filesystem's space, the containers with their state,
        health, deaths within the restart-loop window and memory, Life OS's
        use of the server, the thresholds, and the findings, problems first.
      operationId: getHostStatus
      security: []
      responses:
        '200': {description: The host now, content: {application/json: {schema: {$ref: '#/components/schemas/HostStatus'}}}}
        '400': {description: Invalid request, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '503': {description: Nothing has been sampled yet (not_ready), content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/history:
    get:
      summary: Get the host's recent samples
      description: >-
        The samples of the last `hours` hours, oldest first, one a minute.
        They live in memory: after a restart the history starts again.
      operationId: getHostHistory
      security: []
      parameters:
        - {name: hours, in: query, schema: {type: integer, minimum: 1, maximum: 24, default: 24}}
      responses:
        '200': {description: Samples, content: {application/json: {schema: {$ref: '#/components/schemas/HostHistory'}}}}
        '400': {description: 'Invalid request, such as hours out of range (bad_request)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
components:
  schemas:
    HostMemory:
      type: object
      required: [totalBytes, availableBytes, availablePercent]
      properties:
        totalBytes: {type: integer, format: int64, minimum: 0}
        availableBytes: {type: integer, format: int64, minimum: 0, description: 'MemAvailable: what can be used without swapping, page cache included.'}
        availablePercent: {type: number, format: double, minimum: 0}
    HostLoad:
      type: object
      required: [one, five, fifteen, cpus]
      properties:
        one: {type: number, format: double, minimum: 0, description: Load average over 1 minute.}
        five: {type: number, format: double, minimum: 0}
        fifteen: {type: number, format: double, minimum: 0}
        cpus: {type: integer, minimum: 1, description: The host's CPUs.}
    HostDisk:
      type: object
      description: One filesystem, reported once however many of the configured paths are on it.
      required: [label, totalBytes, freeBytes, freePercent]
      properties:
        label: {type: string, description: 'Such as root or docker.'}
        totalBytes: {type: integer, format: int64, minimum: 0}
        freeBytes: {type: integer, format: int64, minimum: 0, description: 'What an unprivileged user may still write (df''s Avail).'}
        freePercent: {type: number, format: double, minimum: 0}
    HostContainer:
      type: object
      required: [name, image, state, recentDeaths]
      properties:
        name: {type: string}
        project: {type: string, description: The compose project it belongs to.}
        service: {type: string, description: Its compose service.}
        image: {type: string}
        state: {type: string, description: 'Docker''s: created, running, paused, restarting, removing, exited, or dead.'}
        health: {type: string, enum: [healthy, unhealthy, starting], description: Absent without a health check.}
        recentDeaths: {type: integer, minimum: 0, description: 'How often Docker restarted it by itself (a death followed by a start of the same container, as a restart policy does) within the restart-loop window. Stops, compose down, and recreates do not count.'}
        lastExitCode: {type: integer, description: The exit code of its last such death; absent without one.}
        testStack: {type: boolean, description: 'A container of an ignored compose project (HOST_HEALTH_IGNORE_PROJECTS, the verification stack): never in findings or top. Absent otherwise.'}
        unhealthySince: {type: string, format: date-time, description: When it turned unhealthy; absent while it is not.}
        memoryBytes: {type: integer, format: int64, minimum: 0, description: 'Its memory in use, as docker stats shows it; absent when not read.'}
    HostMemoryUser:
      type: object
      required: [name, memoryBytes]
      properties:
        name: {type: string}
        project: {type: string}
        memoryBytes: {type: integer, format: int64, minimum: 0}
    HostContainers:
      type: object
      required: [available, total, running, unhealthy, restarting, items, top, restartsComplete]
      properties:
        available: {type: boolean, description: False when the Docker gateway is not set up or could not be read.}
        error: {type: string, description: Why the containers are not available.}
        total: {type: integer, minimum: 0}
        running: {type: integer, minimum: 0}
        unhealthy: {type: integer, minimum: 0, description: 'Unhealthy containers, the test stack''s left out.'}
        restarting: {type: integer, minimum: 0, description: 'Containers Docker is restarting, the test stack''s left out.'}
        testStack: {type: integer, minimum: 0, description: 'Of total, the containers of ignored compose projects (the verification stack).'}
        memorySampledAt: {type: string, format: date-time, description: When the containers' memory was read.}
        items: {type: array, items: {$ref: '#/components/schemas/HostContainer'}}
        top: {type: array, items: {$ref: '#/components/schemas/HostMemoryUser'}, description: 'The containers using the most memory, biggest first (up to 5).'}
        restartsWatchedSince: {type: string, format: date-time, description: 'When host-health''s stream of container events began to see every event; absent while it is not open. Restarts before it are only those Docker still held when it opened (its last 256 events of any kind, about two minutes here).'}
        restartsComplete:
          type: boolean
          description: >-
            True once the event stream has been open for the whole restart-loop
            window (restartLoopMinutes). Until then, after host-health starts
            or its stream reopens, a recentDeaths below restartLoopCount may be
            too low, so no finding is not yet a sign that a loop has stopped.
    HostUsageShare:
      type: object
      description: >-
        One part of the server's use. Memory in use is counted as for the
        whole server (total less MemAvailable): each container's cgroup
        memory.current less what the kernel can reclaim at once, its page
        cache on the file lists (active_file, inactive_file) and reclaimable
        kernel memory (slab_reclaimable). That is less than docker stats
        shows, which subtracts inactive_file only.
      required: [memoryBytes, memoryPercent]
      properties:
        memoryBytes: {type: integer, format: int64, minimum: 0}
        memoryPercent: {type: number, format: double, minimum: 0, description: Of the server's memory.}
        cpuCores: {type: number, format: double, minimum: 0, description: 'The CPU time used over the last interval, in cores (1 is one CPU busy all the time); absent until two samples allow it, as after a restart or a redeploy.'}
        cpuPercent: {type: number, format: double, minimum: 0, description: Of the server's CPUs; absent with cpuCores.}
    HostServiceUsage:
      type: object
      required: [service, containers, memoryBytes]
      properties:
        service: {type: string, description: 'Its compose service (the container''s name without one).'}
        containers: {type: integer, minimum: 1, description: 'Its running replicas, whose memory is summed.'}
        memoryBytes: {type: integer, format: int64, minimum: 0}
    HostUsage:
      type: object
      description: >-
        How much of the server Life OS uses (the running containers of the
        compose project HOST_HEALTH_LIFEOS_PROJECT, lifeos), against the
        test stack (HOST_HEALTH_IGNORE_PROJECTS) and everything else, read
        from the containers' cgroups.
      required: [available, services]
      properties:
        available: {type: boolean, description: 'False when the cgroups or the containers cannot be read, or no cgroups are set up; then only error is set.'}
        error: {type: string, description: Why Life OS's use is not available.}
        lifeOs: {type: object, allOf: [{$ref: '#/components/schemas/HostUsageShare'}], description: Life OS's containers.}
        tests: {type: object, allOf: [{$ref: '#/components/schemas/HostUsageShare'}], description: 'The test stack''s containers; only while any of them runs.'}
        others: {type: object, allOf: [{$ref: '#/components/schemas/HostUsageShare'}], description: 'Everything else: the server''s use (memory total less available; the CPUs'' busy time) less Life OS and the test stack, never below zero.'}
        services: {type: array, items: {$ref: '#/components/schemas/HostServiceUsage'}, description: 'Life OS''s compose services using the most memory, biggest first (up to 5).'}
    HostThresholds:
      type: object
      required: [memoryWarningPercent, memoryWarningSamples, memoryProblemPercent, diskWarningBytes, diskWarningPercent, diskProblemBytes, loadWarningPerCpu, restartLoopCount, restartLoopMinutes, unhealthyMinutes]
      properties:
        memoryWarningPercent: {type: number, format: double, description: Memory available below this for memoryWarningSamples samples in a row is a warning.}
        memoryWarningSamples: {type: integer}
        memoryProblemPercent: {type: number, format: double, description: Memory available below this is a problem.}
        diskWarningBytes: {type: integer, format: int64, description: A disk with less free is a warning…}
        diskWarningPercent: {type: number, format: double, description: …as is one with less than this share free.}
        diskProblemBytes: {type: integer, format: int64, description: A disk with less free is a problem.}
        loadWarningPerCpu: {type: number, format: double, description: A 15-minute load above the CPUs times this is a warning.}
        restartLoopCount: {type: integer, description: A container that died this often within restartLoopMinutes is restarting in a loop.}
        restartLoopMinutes: {type: integer}
        unhealthyMinutes: {type: integer, description: A container unhealthy this long is a warning.}
    HostFinding:
      type: object
      description: >-
        One thing that needs attention. Which fields are set depends on the
        kind: memory_low (availableBytes, totalBytes, minutes held),
        disk_low (subject is the disk's label, availableBytes, totalBytes),
        load_high (load is the 15-minute load, cpus), container_restarting
        (subject, project, count restarts within minutes, exitCode of the
        last death when known), container_unhealthy
        (subject, project, minutes unhealthy), containers_unavailable
        (error).
      required: [kind, severity]
      properties:
        kind: {type: string, enum: [memory_low, disk_low, load_high, container_restarting, container_unhealthy, containers_unavailable]}
        severity: {type: string, enum: [warning, problem]}
        subject: {type: string}
        project: {type: string}
        availableBytes: {type: integer, format: int64, minimum: 0}
        totalBytes: {type: integer, format: int64, minimum: 0}
        minutes: {type: integer, minimum: 0}
        count: {type: integer, minimum: 0}
        exitCode: {type: integer}
        load: {type: number, format: double, minimum: 0}
        cpus: {type: integer, minimum: 0}
        error: {type: string}
    HostStatus:
      type: object
      required: [sampledAt, mode, memory, load, uptimeSeconds, disks, containers, thresholds, findings]
      properties:
        sampledAt: {type: string, format: date-time}
        mode: {type: string, enum: [host, fixture], description: 'fixture: a made-up host, on the verification stack.'}
        memory: {$ref: '#/components/schemas/HostMemory'}
        load: {$ref: '#/components/schemas/HostLoad'}
        uptimeSeconds: {type: integer, format: int64, minimum: 0}
        disks: {type: array, items: {$ref: '#/components/schemas/HostDisk'}}
        diskErrors: {type: array, items: {type: string}, description: Configured disks that could not be read.}
        containers: {$ref: '#/components/schemas/HostContainers'}
        thresholds: {$ref: '#/components/schemas/HostThresholds'}
        findings: {type: array, items: {$ref: '#/components/schemas/HostFinding'}, description: 'Problems first, then warnings; empty when all is well.'}
        usage: {$ref: '#/components/schemas/HostUsage'}
    HostSample:
      type: object
      required: [at, memoryAvailableBytes, memoryTotalBytes, load1, load5, load15, disks]
      properties:
        at: {type: string, format: date-time}
        memoryAvailableBytes: {type: integer, format: int64, minimum: 0}
        memoryTotalBytes: {type: integer, format: int64, minimum: 0}
        load1: {type: number, format: double, minimum: 0}
        load5: {type: number, format: double, minimum: 0}
        load15: {type: number, format: double, minimum: 0}
        lifeOsMemoryBytes: {type: integer, format: int64, minimum: 0, description: 'Life OS''s memory in use (HostUsage); absent when it could not be read.'}
        lifeOsCpuCores: {type: number, format: double, minimum: 0, description: 'Life OS''s CPU over the interval before the sample, in cores; absent when not known.'}
        disks:
          type: array
          items:
            type: object
            required: [label, freeBytes]
            properties:
              label: {type: string}
              freeBytes: {type: integer, format: int64, minimum: 0}
    HostHistory:
      type: object
      required: [intervalSeconds, samples]
      properties:
        intervalSeconds: {type: integer, minimum: 1, description: The time between two samples.}
        samples: {type: array, items: {$ref: '#/components/schemas/HostSample'}}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string, description: 'Machine-readable code, such as bad_request or not_ready.'}
            message: {type: string}
        request_id: {type: string}
