openapi: 3.0.3
info:
  title: Life OS Activity API
  version: 1.0.0
  description: >-
    Durable, user-facing activity events emitted by owning services at their
    operation boundaries. Events carry a correlation identifier for the whole
    workflow (for example Voice → Inbox → processing → MCP → Task) and an
    optional causation identifier naming the event that directly caused them.
    This is product/audit data, not a log sink.
  license: {name: UNLICENSED, url: https://life-os.local/license}
servers: [{url: http://activity:8080}]
paths:
  /v1/activity-events:
    get:
      summary: List activity events
      description: >-
        Events are ordered newest first by occurredAt, then id. `cursor` is the
        opaque nextCursor of the previous page.
      operationId: listActivityEvents
      security: []
      parameters:
        - {name: correlationId, in: query, description: Return one workflow., schema: {type: string, minLength: 1, maxLength: 128}}
        - {name: subjectType, in: query, description: Entity type such as task or inbox_item., schema: {type: string, minLength: 1, maxLength: 64}}
        - {name: subjectId, in: query, description: Entity identifier; usually combined with subjectType., schema: {type: string, minLength: 1, maxLength: 128}}
        - {name: type, in: query, description: Exact event type such as task.completed., schema: {type: string, minLength: 1, maxLength: 128}}
        - {name: source, in: query, description: Emitting service., schema: {type: string, minLength: 1, maxLength: 64}}
        - {name: outcome, in: query, schema: {$ref: '#/components/schemas/ActivityOutcome'}}
        - {name: from, in: query, description: Inclusive lower bound on occurredAt., schema: {type: string, format: date-time}}
        - {name: to, in: query, description: Exclusive upper bound on occurredAt., schema: {type: string, format: date-time}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200': {description: Activity events, content: {application/json: {schema: {$ref: '#/components/schemas/ActivityEventList'}}}}
        '400': {description: Invalid request}
    post:
      summary: Record an activity event
      description: >-
        Internal endpoint for owning services. Recording is idempotent by event
        id: re-sending an already recorded id returns the stored event with 200.
        The gateway does not expose this method.
      operationId: recordActivityEvent
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ActivityEventCreateRequest'}}}}
      responses:
        '200': {description: Event was already recorded, content: {application/json: {schema: {$ref: '#/components/schemas/ActivityEvent'}}}}
        '201': {description: Event recorded, content: {application/json: {schema: {$ref: '#/components/schemas/ActivityEvent'}}}}
        '400': {description: Invalid request}
  /v1/activity-events/{eventId}:
    get:
      summary: Get an activity event
      operationId: getActivityEvent
      security: []
      parameters: [{name: eventId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Activity event, content: {application/json: {schema: {$ref: '#/components/schemas/ActivityEvent'}}}}
        '404': {description: Event not found}
  /v1/diagnostic-events:
    get:
      summary: List server diagnostics
      description: >-
        For the server's admins (docs/architecture/multi-user.md#logs):
        newest first by lastAt. Diagnostics carry codes, ids, counts,
        durations, and times, never content. A request with an identity
        token must be an owner or admin who signed in (legacy access is
        refused); one without is an internal caller, such as the Dashboard
        after its own admin check.
      operationId: listDiagnosticEvents
      security: []
      parameters:
        - {name: service, in: query, schema: {type: string, pattern: '^[a-z][a-z0-9-]{0,63}$'}}
        - {name: code, in: query, schema: {$ref: '#/components/schemas/DiagnosticCode'}}
        - {name: from, in: query, description: Inclusive lower bound on lastAt., schema: {type: string, format: date-time}}
        - {name: to, in: query, description: Exclusive upper bound on lastAt., schema: {type: string, format: date-time}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        '200': {description: Diagnostics, content: {application/json: {schema: {$ref: '#/components/schemas/DiagnosticEventList'}}}}
        '400': {description: Invalid request}
        '401': {description: Legacy access; sign in}
        '403': {description: Not an admin}
    post:
      summary: Record server diagnostics
      description: >-
        Internal endpoint for services (pkg/diagnostics sends a batch once a
        minute). Every field is checked: an unknown code, a route that is no
        route pattern, or anything else that could carry text is refused.
        The gateway does not expose this method. Rows older than 90 days are
        deleted.
      operationId: recordDiagnosticEvents
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DiagnosticBatch'}}}}
      responses:
        '202': {description: Recorded, content: {application/json: {schema: {$ref: '#/components/schemas/DiagnosticRecorded'}}}}
        '400': {description: Invalid request}
        '403': {description: A person's request}
  /v1/diagnostic-events/summary:
    get:
      summary: Count server diagnostics by service and code
      description: For the server's admins, as listDiagnosticEvents.
      operationId: summarizeDiagnosticEvents
      security: []
      parameters:
        - {name: hours, in: query, description: 'The window, in hours, ending now.', schema: {type: integer, minimum: 1, maximum: 2160, default: 24}}
      responses:
        '200': {description: Counts, content: {application/json: {schema: {$ref: '#/components/schemas/DiagnosticSummary'}}}}
        '400': {description: Invalid request}
        '401': {description: Legacy access; sign in}
        '403': {description: Not an admin}
components:
  schemas:
    ActivityOutcome:
      type: string
      description: succeeded = the operation happened; pending = work was accepted or scheduled; failed = the operation did not happen.
      enum: [succeeded, pending, failed]
    ActivityActor:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [user, agent, system, dev]
          description: >-
            user = the owner; agent = the Life OS AI (for example the Inbox
            processor or MCP); system = a Life OS component such as the Voice
            worker; dev = a development tool or agent working on Life OS, such
            as Claude Code.
        name: {type: string, maxLength: 128, description: 'Optional actor name, for example codex-inbox-processor, voice-worker, or claude-code.'}
    ActivitySubject:
      type: object
      required: [type, id]
      properties:
        type: {type: string, minLength: 1, maxLength: 64, description: 'Entity type such as voice_job, inbox_item, processing_attempt, mcp_action, or task.'}
        id: {type: string, minLength: 1, maxLength: 128}
    ActivityEventCreateRequest:
      type: object
      required: [id, type, source, subject, correlationId, actor, outcome, summary, occurredAt]
      properties:
        id: {type: string, format: uuid, description: Emitter-chosen identifier; deterministic ids make re-emission idempotent.}
        type: {type: string, pattern: '^[a-z][a-z_]*(\.[a-z][a-z_]*)+$', maxLength: 128, description: 'Dotted event type, for example task.completed.'}
        source: {type: string, minLength: 1, maxLength: 64, description: Emitting service.}
        subject: {$ref: '#/components/schemas/ActivitySubject'}
        correlationId: {type: string, minLength: 1, maxLength: 128}
        causationId: {type: string, format: uuid, description: Event that directly caused this one.}
        actor: {$ref: '#/components/schemas/ActivityActor'}
        actorUserId: {type: string, format: uuid, description: 'The person the action is for: the user who signed in (or the first account under legacy access), also when a development tool or the AI acts for them. Absent for a service''s own work.'}
        outcome: {$ref: '#/components/schemas/ActivityOutcome'}
        summary: {type: string, minLength: 1, maxLength: 500, description: Short human-readable sentence.}
        data: {type: object, additionalProperties: true, description: Small structured details for diagnostics.}
        occurredAt: {type: string, format: date-time}
    ActivityEvent:
      type: object
      required: [id, type, source, subject, correlationId, actor, outcome, summary, data, occurredAt, recordedAt]
      properties:
        id: {type: string, format: uuid}
        type: {type: string}
        source: {type: string}
        subject: {$ref: '#/components/schemas/ActivitySubject'}
        correlationId: {type: string}
        causationId: {type: string, format: uuid, nullable: true}
        actor: {$ref: '#/components/schemas/ActivityActor'}
        actorUserId: {type: string, format: uuid, nullable: true}
        outcome: {$ref: '#/components/schemas/ActivityOutcome'}
        summary: {type: string}
        data: {type: object, additionalProperties: true}
        occurredAt: {type: string, format: date-time}
        recordedAt: {type: string, format: date-time}
    ActivityEventList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ActivityEvent'}}
        nextCursor: {type: string, nullable: true}
    DiagnosticCode:
      type: string
      description: What went wrong, from a fixed list (pkg/diagnostics).
      enum: [internal_error, bad_gateway, service_unavailable, gateway_timeout, server_error, panic, not_ready, provider_unavailable, media_unavailable, google_rejected, google_unavailable, google_not_configured, banking_not_configured, food_unavailable, calendar_unavailable]
    DiagnosticEventCreate:
      type: object
      required: [service, code, count, firstAt, lastAt]
      additionalProperties: false
      properties:
        service: {type: string, pattern: '^[a-z][a-z0-9-]{0,63}$'}
        code: {$ref: '#/components/schemas/DiagnosticCode'}
        route: {type: string, maxLength: 128, pattern: '^(/[A-Za-z0-9_.:{}*+-]*)+$', description: 'The route pattern that answered, such as /v1/tasks/:taskId; never a request''s path.'}
        status: {type: integer, minimum: 100, maximum: 599}
        subjectId: {type: string, format: uuid}
        requestId: {type: string, format: uuid}
        count: {type: integer, minimum: 1}
        durationMs: {type: integer, format: int64, minimum: 0}
        firstAt: {type: string, format: date-time}
        lastAt: {type: string, format: date-time}
    DiagnosticBatch:
      type: object
      required: [events]
      properties:
        events: {type: array, maxItems: 1000, items: {$ref: '#/components/schemas/DiagnosticEventCreate'}}
    DiagnosticRecorded:
      type: object
      required: [recorded]
      properties:
        recorded: {type: integer}
    DiagnosticEvent:
      type: object
      required: [id, service, code, count, firstAt, lastAt, recordedAt]
      properties:
        id: {type: integer, format: int64}
        service: {type: string}
        code: {$ref: '#/components/schemas/DiagnosticCode'}
        route: {type: string, nullable: true}
        status: {type: integer, nullable: true}
        subjectId: {type: string, format: uuid, nullable: true}
        requestId: {type: string, format: uuid, nullable: true}
        count: {type: integer}
        durationMs: {type: integer, format: int64, nullable: true}
        firstAt: {type: string, format: date-time}
        lastAt: {type: string, format: date-time}
        recordedAt: {type: string, format: date-time}
    DiagnosticEventList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/DiagnosticEvent'}}
        nextCursor: {type: string, nullable: true}
    DiagnosticCount:
      type: object
      required: [service, code, count, lastAt]
      properties:
        service: {type: string}
        code: {$ref: '#/components/schemas/DiagnosticCode'}
        count: {type: integer, format: int64}
        lastAt: {type: string, format: date-time}
    DiagnosticSummary:
      type: object
      required: [since, items]
      properties:
        since: {type: string, format: date-time}
        items: {type: array, items: {$ref: '#/components/schemas/DiagnosticCount'}}
