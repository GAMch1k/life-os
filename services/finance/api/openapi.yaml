openapi: 3.0.3
info:
  title: Life OS Finance API
  version: 1.3.0
  description: >-
    Every write (POST, PUT, PATCH, DELETE) must say who makes it in the
    X-Life-OS-Actor header: `user` (the owner), `agent:<name>` (the Life OS
    AI), `system:<name>` (a Life OS component), or `dev:<name>` (a development
    tool or agent working on Life OS, such as Claude Code). Names are 1-64
    letters, digits, '.', '_', or '-'. A write without a valid actor is
    rejected with 400 and error code `actor_required`; nothing is attributed to
    the owner by default. Reads do not need the header. The public gateway
    passes only `user` and `dev:<name>`.


    Money is an integer amount in the currency's minor units (cents) with a
    three-letter ISO currency; a negative transaction amount is money out, a
    positive one money in. An account's `balance` is its opening balance plus
    its booked transactions; pending transactions are shown separately
    (`pending`) and are not in the balance or the monthly summary. A
    transaction's `bookingDate` is the owner-local date it counts on.


    Every transaction has a `source`: `manual` (entered in Life OS by the
    owner or the AI), `csv` (a CSV import), or `bank` (a bank connection,
    planned). Imported transactions (`csv`, `bank`) are read-only: only their
    `categoryId` and `notes` change, and they cannot be deleted (409
    `managed_by_source`). Finance keeps a built-in Cash account
    (`builtIn: true`) for cash spending; the service creates it when it
    starts, and a manual transaction without an `accountId` goes there.


    Bank accounts (`source.kind` `bank`) and their transactions come only
    from the banking integration service, which pushes each sync through
    `POST /v1/imports/bank`; Finance never calls a bank. A bank account
    shows the balance the bank reported (`balanceAsOf`, plus `available`),
    takes no manual transactions or CSV imports, and keeps its currency
    (409 `managed_by_source`).


    Categories are chosen by hand or by rules: a rule matches text in a
    transaction's counterparty or description and gives it a category. Rules
    apply automatically to new manual and imported transactions that come
    without a category, and `POST /v1/categories/rules/apply` re-applies them.
    A category chosen by hand is never changed by a rule. A bank card
    transaction no rule matches gets a default category from its merchant
    category code (`categorizedBy: mcc`). Finance adds default categories
    (Groceries, Transport, Savings, and so on, marked with a `systemKey`) and
    default merchant rules once; the owner can rename, change, or delete
    them, and rules the owner adds are tried first.


    Monthly budgets (`/v1/budgets/{month}`) plan the month: expected income,
    an amount per expense category, and a savings goal. One regular plan
    rolls forward from month to month; a month can have its own plan
    instead. Budget progress counts booked and pending money in the
    default currency (`FINANCE_DEFAULT_CURRENCY`); transactions in other
    currencies are left out and counted in `excludedCurrencies`.


    Subscriptions (`/v1/subscriptions`) are recurring payments: Finance
    detects them in booked money out (the same counterparty at a regular
    interval with a similar amount) and suggests them; the owner confirms
    or ignores each one, or marks a transaction as a subscription. Alert
    settings (`/v1/settings`) hold the thresholds for large debits and low
    balances and the lead days of renewal reminders.


    Errors use the shared envelope `{"error": {"code", "message"},
    "request_id"}`; the codes are listed with each operation.
  license: {name: UNLICENSED, url: https://life-os.local/license}
servers: [{url: http://finance:8080}]
paths:
  /v1/accounts:
    get:
      summary: List finance accounts
      description: >-
        Accounts with their current balance: the built-in Cash account first,
        then by name. Archived accounts are left out unless `includeArchived`
        is true.
      operationId: listAccounts
      security: []
      parameters:
        - {name: includeArchived, in: query, schema: {type: boolean, default: false}}
      responses:
        '200': {description: Accounts, content: {application/json: {schema: {$ref: '#/components/schemas/AccountList'}}}}
        '400': {description: Invalid request, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    post:
      summary: Create a finance account
      description: >-
        Creates an account kept in Life OS (`source.kind` `manual`). Names
        are unique (409 `account_name_taken`).
      operationId: createAccount
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateAccountRequest'}}}}
      responses:
        '201': {description: Account, content: {application/json: {schema: {$ref: '#/components/schemas/Account'}}}}
        '400': {description: 'Invalid request (`invalid_request`), or no valid X-Life-OS-Actor (`actor_required`)', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '409': {description: Another account has this name (`account_name_taken`), content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /v1/accounts/{accountId}:
    get:
      summary: Get a finance account
      description: Returns the account, archived or not.
      operationId: getAccount
      security: []
      parameters: [{$ref: '#/components/parameters/AccountId'}]
      responses:
        '200': {description: Account, content: {application/json: {schema: {$ref: '#/components/schemas/Account'}}}}
        '400': {description: Invalid request, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '404': {description: Account not found (`not_found`), content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    patch:
      summary: Update or archive a finance account
      description: >-
        Changes only the fields present. `archived: true` archives the
        account: it leaves the account list and takes no new transactions,
        but keeps its history; `archived: false` restores it. The currency
        changes only while the account has no transactions (409
        `account_has_transactions`). The built-in Cash account can be renamed
        and given another opening balance, but not archived or given another
        kind (409 `built_in_account`).
      operationId: updateAccount
      security: []
      parameters: [{$ref: '#/components/parameters/AccountId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateAccountRequest'}}}}
      responses:
        '200': {description: Account, content: {application/json: {schema: {$ref: '#/components/schemas/Account'}}}}
        '400': {description: 'Invalid request (`invalid_request`), or no valid X-Life-OS-Actor (`actor_required`)', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '404': {description: Account not found (`not_found`), content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '409': {description: '`account_name_taken`, `account_has_transactions`, `built_in_account`, or `managed_by_source` (the currency of a bank account)', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /v1/transactions:
    get:
      summary: List, search, and filter transactions
      description: >-
        Transactions of every account (or of one, with `accountId`), latest
        `bookingDate` first, then latest created first. Filters combine. `q`
        matches every word (case-insensitive substring) in the counterparty,
        description, or notes. When more transactions match than `limit`,
        `nextCursor` is set: pass it back as `cursor`, with the same filters,
        for the next page. A response without `nextCursor` is the last page.
      operationId: listTransactions
      security: []
      parameters:
        - {name: q, in: query, description: 'Words to find in the counterparty, description, or notes; every word must match.', schema: {type: string, minLength: 1, maxLength: 200}}
        - {name: accountId, in: query, schema: {type: string, format: uuid}}
        - {name: categoryId, in: query, description: 'A category id, or `uncategorized` for transactions without a category.', schema: {type: string}}
        - {name: from, in: query, description: Earliest bookingDate (inclusive)., schema: {type: string, format: date}}
        - {name: to, in: query, description: Latest bookingDate (inclusive)., schema: {type: string, format: date}}
        - {name: direction, in: query, description: '`in` for money in (positive amounts), `out` for money out (negative).', schema: {$ref: '#/components/schemas/TransactionDirection'}}
        - {name: amountMin, in: query, description: 'Smallest absolute amount in minor units (1250 matches -12.50 and 12.50).', schema: {type: integer, format: int64, minimum: 0}}
        - {name: amountMax, in: query, description: Largest absolute amount in minor units., schema: {type: integer, format: int64, minimum: 0}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/TransactionStatus'}}
        - {name: source, in: query, schema: {$ref: '#/components/schemas/TransactionSourceKind'}}
        - {name: cursor, in: query, description: The previous page's nextCursor. Opaque; only valid with the filters it was returned for., schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200': {description: Transactions, content: {application/json: {schema: {$ref: '#/components/schemas/TransactionList'}}}}
        '400': {description: 'Invalid request (`invalid_request`, such as an unknown categoryId value or amountMin above amountMax), or a malformed cursor (`invalid_cursor`)', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    post:
      summary: Record a manual transaction
      description: >-
        Records a manual transaction (`source.kind` `manual`). Without
        `accountId` it goes to the built-in Cash account; without
        `bookingDate` it is dated today in the owner's timezone. The amount's
        currency must be the account's (400 `currency_mismatch`). Without
        `categoryId` the category rules choose one (or none). An
        `Idempotency-Key` header makes the request safe to retry: an identical
        repeat returns the original transaction, and reusing the key with a
        different body returns 409 `idempotency_conflict`.
      operationId: createManualTransaction
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateManualTransactionRequest'}}}}
      responses:
        '201': {description: Transaction, content: {application/json: {schema: {$ref: '#/components/schemas/Transaction'}}}}
        '400': {description: 'Invalid request (`invalid_request`, `unknown_account`, `unknown_category`, `currency_mismatch`), or no valid X-Life-OS-Actor (`actor_required`)', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '409': {description: '`account_archived`, `managed_by_source` (a bank account), `category_archived`, or `idempotency_conflict`', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /v1/transactions/{transactionId}:
    get:
      summary: Get a transaction
      operationId: getTransaction
      security: []
      parameters: [{$ref: '#/components/parameters/TransactionId'}]
      responses:
        '200': {description: Transaction, content: {application/json: {schema: {$ref: '#/components/schemas/Transaction'}}}}
        '400': {description: Invalid request, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '404': {description: Transaction not found (`not_found`), content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    patch:
      summary: Update a transaction
      description: >-
        Changes only the fields present; `null` clears a nullable field. A
        manual transaction takes every field; an imported one (`readOnly`)
        only `categoryId` and `notes`, and naming any other field returns 409
        `managed_by_source`. Setting `categoryId`, or clearing it with null,
        is a choice by hand that rules leave alone from then on. When the
        counterparty or description of a transaction whose category was not
        chosen by hand changes, the rules choose again.
      operationId: updateTransaction
      security: []
      parameters: [{$ref: '#/components/parameters/TransactionId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateTransactionRequest'}}}}
      responses:
        '200': {description: Transaction, content: {application/json: {schema: {$ref: '#/components/schemas/Transaction'}}}}
        '400': {description: 'Invalid request (`invalid_request`, `unknown_account`, `unknown_category`, `currency_mismatch`), or no valid X-Life-OS-Actor (`actor_required`)', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '404': {description: Transaction not found (`not_found`), content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '409': {description: '`managed_by_source` (an imported transaction, or a move to a bank account), `account_archived`, or `category_archived`', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    delete:
      summary: Delete a manual transaction
      description: Deletes a manual transaction permanently. Imported transactions cannot be deleted (409 `managed_by_source`).
      operationId: deleteTransaction
      security: []
      parameters: [{$ref: '#/components/parameters/TransactionId'}]
      responses:
        '204': {description: Deleted}
        '400': {description: 'Invalid request, or no valid X-Life-OS-Actor (`actor_required`)', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '404': {description: Transaction not found (`not_found`), content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '409': {description: The transaction is imported (`managed_by_source`), content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /v1/categories:
    get:
      summary: List finance categories
      description: Categories by kind, then name. Archived categories are left out unless `includeArchived` is true.
      operationId: listCategories
      security: []
      parameters:
        - {name: includeArchived, in: query, schema: {type: boolean, default: false}}
      responses:
        '200': {description: Categories, content: {application/json: {schema: {$ref: '#/components/schemas/CategoryList'}}}}
        '400': {description: Invalid request, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    post:
      summary: Create a finance category
      description: A name is unique per kind (409 `category_exists`).
      operationId: createCategory
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateCategoryRequest'}}}}
      responses:
        '201': {description: Category, content: {application/json: {schema: {$ref: '#/components/schemas/Category'}}}}
        '400': {description: 'Invalid request (`invalid_request`), or no valid X-Life-OS-Actor (`actor_required`)', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '409': {description: A category of this kind has this name (`category_exists`), content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /v1/categories/{categoryId}:
    patch:
      summary: Update or archive a finance category
      description: >-
        Changes only the fields present; `color: null` removes the color.
        `archived: true` archives the category: transactions keep it, but it
        cannot be given to transactions or rules any more (409
        `category_archived`) and its rules are skipped; `archived: false`
        restores it.
      operationId: updateCategory
      security: []
      parameters: [{$ref: '#/components/parameters/CategoryId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateCategoryRequest'}}}}
      responses:
        '200': {description: Category, content: {application/json: {schema: {$ref: '#/components/schemas/Category'}}}}
        '400': {description: 'Invalid request (`invalid_request`), or no valid X-Life-OS-Actor (`actor_required`)', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '404': {description: Category not found (`not_found`), content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '409': {description: A category of this kind has this name (`category_exists`), content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /v1/categories/rules:
    get:
      summary: List category rules
      description: Rules in the order they are tried (priority, lowest first; then oldest first).
      operationId: listCategoryRules
      security: []
      responses:
        '200': {description: Rules, content: {application/json: {schema: {$ref: '#/components/schemas/CategoryRuleList'}}}}
        '400': {description: Invalid request, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    post:
      summary: Create a category rule
      description: >-
        Without `priority` the rule is tried after every existing rule. It
        applies to transactions created from now on; apply it to existing
        ones with `POST /v1/categories/rules/apply`.
      operationId: createCategoryRule
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateCategoryRuleRequest'}}}}
      responses:
        '201': {description: Rule, content: {application/json: {schema: {$ref: '#/components/schemas/CategoryRule'}}}}
        '400': {description: 'Invalid request (`invalid_request`, `unknown_category`), or no valid X-Life-OS-Actor (`actor_required`)', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '409': {description: The category is archived (`category_archived`), content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /v1/categories/rules/{ruleId}:
    patch:
      summary: Update a category rule
      operationId: updateCategoryRule
      security: []
      parameters: [{$ref: '#/components/parameters/RuleId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateCategoryRuleRequest'}}}}
      responses:
        '200': {description: Rule, content: {application/json: {schema: {$ref: '#/components/schemas/CategoryRule'}}}}
        '400': {description: 'Invalid request (`invalid_request`, `unknown_category`), or no valid X-Life-OS-Actor (`actor_required`)', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '404': {description: Rule not found (`not_found`), content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '409': {description: The category is archived (`category_archived`), content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    delete:
      summary: Delete a category rule
      description: Transactions it categorized keep their category until the rules are applied again with scope `all`.
      operationId: deleteCategoryRule
      security: []
      parameters: [{$ref: '#/components/parameters/RuleId'}]
      responses:
        '204': {description: Deleted}
        '400': {description: 'Invalid request, or no valid X-Life-OS-Actor (`actor_required`)', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '404': {description: Rule not found (`not_found`), content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /v1/categories/rules/apply:
    post:
      summary: Apply the category rules to existing transactions
      description: >-
        `uncategorized` (the default) gives a category to transactions that
        have none and whose category was not chosen by hand. `all` also
        re-evaluates every transaction a rule categorized: it may get another
        category, or none when no rule matches any more. Categories chosen by
        hand are never changed. Returns the counts.
      operationId: applyCategoryRules
      security: []
      requestBody: {required: false, content: {application/json: {schema: {$ref: '#/components/schemas/ApplyCategoryRulesRequest'}}}}
      responses:
        '200': {description: Counts, content: {application/json: {schema: {$ref: '#/components/schemas/ApplyCategoryRulesResult'}}}}
        '400': {description: 'Invalid request (`invalid_request`), or no valid X-Life-OS-Actor (`actor_required`)', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /v1/summaries/monthly:
    get:
      summary: Get a monthly finance summary
      description: >-
        Booked transactions of the month in one currency (`currency`, by
        default the built-in Cash account's): income, spending, and net.
        Transactions in a `transfer` category (money moved between own
        accounts) are left out of income, spending, and net, but listed in
        `byCategory`. `totalBalance` is the current balance of the accounts
        in that currency, archived ones included. With `accountId` only that
        account counts.
      operationId: getMonthlySummary
      security: []
      parameters:
        - {name: month, in: query, required: true, description: YYYY-MM., schema: {type: string, pattern: '^\d{4}-\d{2}$'}}
        - {name: currency, in: query, schema: {type: string, pattern: '^[A-Z]{3}$'}}
        - {name: accountId, in: query, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Summary, content: {application/json: {schema: {$ref: '#/components/schemas/MonthlySummary'}}}}
        '400': {description: Invalid request (`invalid_request`), content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /v1/budgets/{month}:
    get:
      summary: Get a month's budget and its progress
      description: >-
        The plan that applies to the month (its own plan, or the regular
        plan that rolls forward; `plan` is null when there is none) and the
        month's progress in the budget currency. Spending is money out in
        expense categories, booked and pending (pending money counts so a
        warning comes early), less refunds in the same category; the
        Savings category, transfers, and income are not spending.
        Uncategorized money out is its own line. `savings.saved` is the
        income minus the spending: what was moved to the Savings category
        plus what is left over. Transactions in other currencies are left
        out (`excludedCurrencies`).
      operationId: getBudgetMonth
      security: []
      parameters: [{$ref: '#/components/parameters/Month'}]
      responses:
        '200': {description: The month's budget, content: {application/json: {schema: {$ref: '#/components/schemas/BudgetMonth'}}}}
        '400': {description: The month is not YYYY-MM (`invalid_request`), content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    put:
      summary: Save a month's budget plan
      description: >-
        Saves the plan for the month. Scope `month` gives only this month
        its own plan; the regular plan stays as it is. Scope `following`
        makes it the regular plan from this month on: later months that
        had their own plan follow it too, and earlier months keep theirs.
        Amounts are minor units of the budget currency; a category with 0 is
        left out of the plan. Lines must name expense categories.
      operationId: saveBudgetPlan
      security: []
      parameters: [{$ref: '#/components/parameters/Month'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SaveBudgetPlanRequest'}}}}
      responses:
        '200': {description: The month's budget with the saved plan, content: {application/json: {schema: {$ref: '#/components/schemas/BudgetMonth'}}}}
        '400': {description: 'Invalid request (`invalid_request`: a bad month, a negative amount, a category named twice or not an expense category), an unknown category (`unknown_category`), or no valid X-Life-OS-Actor (`actor_required`)', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    delete:
      summary: Return a month to the regular plan
      description: >-
        Removes the month's own plan, so it follows the regular plan again.
        Idempotent: a month without its own plan also answers 204.
      operationId: resetBudgetMonth
      security: []
      parameters: [{$ref: '#/components/parameters/Month'}]
      responses:
        '204': {description: The month follows the regular plan}
        '400': {description: 'The month is not YYYY-MM (`invalid_request`), or no valid X-Life-OS-Actor (`actor_required`)', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /v1/budgets/{month}/suggestions:
    get:
      summary: Suggest starting amounts for a month's plan
      description: >-
        Starting amounts from real spending: for every active expense
        category, the median of its booked spending (less refunds) over the
        last three complete months before the month (and never after the
        current month), rounded up to a whole unit of the currency. Only
        months with booked transactions in the budget currency count (bank
        data covers about 90 days once connected); a month with history but
        no spending in a category counts as 0. `suggested` is null when the
        category had no spending in those months, and `months` is empty
        when there is no history yet. `income` and `saved` are the medians
        of the monthly income and of income minus spending.
      operationId: getBudgetSuggestions
      security: []
      parameters: [{$ref: '#/components/parameters/Month'}]
      responses:
        '200': {description: Suggestions, content: {application/json: {schema: {$ref: '#/components/schemas/BudgetSuggestions'}}}}
        '400': {description: The month is not YYYY-MM (`invalid_request`), content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /v1/subscriptions:
    get:
      summary: List subscriptions
      description: >-
        Recurring payments, detected or marked by the owner: suggested ones
        first, then confirmed, then ignored, each by name. `state` limits
        the list to one state. `totals` is always the monthly equivalent of
        every confirmed subscription in the default currency. Detection runs
        in the background after every transaction change, import, or bank
        sync, and daily.
      operationId: listSubscriptions
      security: []
      parameters:
        - {name: state, in: query, schema: {$ref: '#/components/schemas/SubscriptionState'}}
      responses:
        '200': {description: Subscriptions, content: {application/json: {schema: {$ref: '#/components/schemas/SubscriptionList'}}}}
        '400': {description: Invalid request (`invalid_request`), content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    post:
      summary: Mark a transaction as a subscription
      description: >-
        "This is a subscription": creates a confirmed subscription from a
        money-out transaction, named after its counterparty (or the known
        service it names), repeating at `cadence` (default monthly), with
        the transaction's amount and category. Later payments to the same
        counterparty with a similar amount keep it up to date. When the
        counterparty already has a subscription with this cadence, that one
        is confirmed (if it was not) and returned with 200 instead.
      operationId: createSubscriptionFromTransaction
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateSubscriptionRequest'}}}}
      responses:
        '200': {description: 'The counterparty''s existing subscription with this cadence, now confirmed', content: {application/json: {schema: {$ref: '#/components/schemas/Subscription'}}}}
        '201': {description: Subscription, content: {application/json: {schema: {$ref: '#/components/schemas/Subscription'}}}}
        '400': {description: 'Invalid request (`invalid_request`: money in, or a transaction without counterparty and description), an unknown transaction (`unknown_transaction`) or category (`unknown_category`), or no valid X-Life-OS-Actor (`actor_required`)', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '409': {description: The category is archived (`category_archived`), content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /v1/subscriptions/{subscriptionId}:
    patch:
      summary: Update a subscription
      description: >-
        Changes only the fields present; `categoryId: null` removes the
        category. A new cadence moves the next expected date (the last
        payment plus the cadence). A name, amount, or category set here
        stays: detection no longer changes it.
      operationId: updateSubscription
      security: []
      parameters: [{$ref: '#/components/parameters/SubscriptionId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateSubscriptionRequest'}}}}
      responses:
        '200': {description: Subscription, content: {application/json: {schema: {$ref: '#/components/schemas/Subscription'}}}}
        '400': {description: 'Invalid request (`invalid_request`, `unknown_category`), or no valid X-Life-OS-Actor (`actor_required`)', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '404': {description: Subscription not found (`not_found`), content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '409': {description: The category is archived (`category_archived`), content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    delete:
      summary: Delete a subscription
      description: >-
        Removes it; its transactions stay. Detection may suggest a deleted
        one again; ignore it instead to keep it away.
      operationId: deleteSubscription
      security: []
      parameters: [{$ref: '#/components/parameters/SubscriptionId'}]
      responses:
        '204': {description: Deleted}
        '400': {description: 'Invalid request, or no valid X-Life-OS-Actor (`actor_required`)', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '404': {description: Subscription not found (`not_found`), content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /v1/subscriptions/{subscriptionId}/confirm:
    post:
      summary: Confirm a subscription
      description: >-
        A suggested (or ignored) subscription becomes confirmed: it counts
        in the monthly total, keeps following new payments, and gets renewal
        reminders. Confirming a confirmed one changes nothing.
      operationId: confirmSubscription
      security: []
      parameters: [{$ref: '#/components/parameters/SubscriptionId'}]
      responses:
        '200': {description: Subscription, content: {application/json: {schema: {$ref: '#/components/schemas/Subscription'}}}}
        '400': {description: 'Invalid request, or no valid X-Life-OS-Actor (`actor_required`)', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '404': {description: Subscription not found (`not_found`), content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /v1/subscriptions/{subscriptionId}/ignore:
    post:
      summary: Ignore a subscription
      description: >-
        The subscription becomes ignored: it leaves the total and gets no
        reminders, and detection never suggests the same counterparty with
        the same cadence again. Ignoring an ignored one changes nothing.
      operationId: ignoreSubscription
      security: []
      parameters: [{$ref: '#/components/parameters/SubscriptionId'}]
      responses:
        '200': {description: Subscription, content: {application/json: {schema: {$ref: '#/components/schemas/Subscription'}}}}
        '400': {description: 'Invalid request, or no valid X-Life-OS-Actor (`actor_required`)', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '404': {description: Subscription not found (`not_found`), content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /v1/settings:
    get:
      summary: Get the alert settings
      description: >-
        The thresholds of the large-debit and low-balance alerts, in the
        default currency, and the renewal reminders' lead days, each with
        its on/off switch.
      operationId: getFinanceSettings
      security: []
      responses:
        '200': {description: Settings, content: {application/json: {schema: {$ref: '#/components/schemas/FinanceSettings'}}}}
        '400': {description: Invalid request, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    put:
      summary: Save the alert settings
      description: Replaces every alert setting. Amounts are minor units of the default currency.
      operationId: updateFinanceSettings
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateFinanceSettingsRequest'}}}}
      responses:
        '200': {description: Settings, content: {application/json: {schema: {$ref: '#/components/schemas/FinanceSettings'}}}}
        '400': {description: 'Invalid request (`invalid_request`: a large-debit threshold below 1, a negative low-balance threshold, or lead days outside 0 to 30), or no valid X-Life-OS-Actor (`actor_required`)', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /v1/imports/csv:
    post:
      summary: Import transactions from a CSV file
      description: >-
        Imports the rows of a UTF-8 CSV file (a byte-order mark is ignored;
        comma or semicolon separated, detected from the header) into the
        account `accountId` (picked in the Dashboard). The rows become `csv`
        transactions: booked, and read-only except category and notes.
        Columns are matched by header name, case-insensitively, in any
        order; unknown columns are ignored.


        Columns: `date` (required; YYYY-MM-DD or DD.MM.YYYY; `booking_date`
        and `occurred_on` are accepted names), `amount` (signed decimal in
        major units, at most two decimals, `.` or `,` as the decimal mark:
        `-12.50`, `-12,50`, `1.234,56`) or `amount_minor` (signed integer
        in minor units; one of the two is required), `currency` (optional;
        must be the account's, which it defaults to), `value_date`
        (optional), `counterparty`, `description`, `notes` (`note` is
        accepted), `category` (a category name, case-insensitive; an
        unknown or archived name leaves the choice to the rules) or
        `category_id`, and `external_id` (optional).


        Re-importing is idempotent: a row whose `external_id` the account
        already has, or, without one, whose content (date, amount, currency,
        counterparty, description, and its position among identical rows of
        the file) it already has, counts as a duplicate. Rows without a
        category get one from the rules. Valid rows are imported even when
        others fail; each failed row is reported with its row number and
        reason. Files in the older format
        (`account_id,occurred_on,amount_minor,currency,external_id,category_id,note`)
        are still accepted without `accountId`: each row goes to its
        `account_id`.
      operationId: createCsvImport
      security: []
      parameters:
        - {name: accountId, in: query, description: The account to import into. Required unless the file has an account_id column., schema: {type: string, format: uuid}}
      requestBody: {required: true, content: {text/csv: {schema: {type: string, format: binary}}}}
      responses:
        '200': {description: Import result, content: {application/json: {schema: {$ref: '#/components/schemas/CsvImport'}}}}
        '400': {description: 'Unreadable CSV or missing columns (`invalid_csv`), no account (`account_required`), an unknown account (`unknown_account`), or no valid X-Life-OS-Actor (`actor_required`)', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '409': {description: 'The account is archived (`account_archived`) or a bank account (`managed_by_source`)', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /v1/imports/bank:
    post:
      summary: Import one bank sync
      description: >-
        Called by the banking integration service (actor `system:banking`)
        after it synced a bank connection; Finance never calls a bank. The
        whole sync is applied in one database transaction.


        Accounts are upserted by (`connectionId`, `externalId`) as bank
        accounts (`source.kind` `bank`). A new account takes the bank's
        name (with the institution, or the masked IBAN, added when another
        account already has the name), kind, and currency; later syncs
        update the bank-reported balances, masked IBAN, provider, and
        institution but keep the owner's name, kind, and archive state. An
        account's currency never changes (400 `currency_mismatch`).


        Transactions are upserted by (`connectionId`, `externalId`) as
        `bank` transactions: read-only except category and notes, which
        re-syncs never change. A re-sync updates the bank's fields (status,
        dates, amount, counterparty, description, merchant category code,
        bank reference); when the counterparty or description of a
        transaction whose category was not chosen by hand changes, the
        rules choose again. New transactions without a category get one
        from the rules. A new booked transaction that replaces a pending
        one (same account and amount, the same counterparty ignoring case,
        booking dates at most 3 days apart, the pending one absent from this
        sync) removes the pending one and takes over its notes and a
        category chosen by hand. Pending transactions of the connection's
        accounts booked inside `window` that are absent from the sync are
        removed; booked transactions are never deleted. Transactions with a
        zero amount are skipped.


        Errors: a transaction naming an account that is neither in the sync
        nor already imported for the connection is 400 `unknown_account`;
        an amount or balance in another currency than its account is 400
        `currency_mismatch`; duplicate external ids, an empty name, an
        unknown kind or status, or `window.from` after `window.to` are 400
        `invalid_request`. Nothing is stored when the request fails.
      operationId: importBankSync
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BankImportRequest'}}}}
      responses:
        '200': {description: Import result, content: {application/json: {schema: {$ref: '#/components/schemas/BankImportResult'}}}}
        '400': {description: '`invalid_request`, `unknown_account`, or `currency_mismatch`, or no valid X-Life-OS-Actor (`actor_required`)', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /v1/imports/bank/{connectionId}:
    delete:
      summary: Remove a bank connection
      description: >-
        Archives every account of the connection; all their transactions
        stay as history. Idempotent: an unknown or already removed
        connection also answers 204.
      operationId: removeBankConnection
      security: []
      parameters: [{name: connectionId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '204': {description: Removed}
        '400': {description: 'Invalid request, or no valid X-Life-OS-Actor (`actor_required`)', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
components:
  parameters:
    AccountId: {name: accountId, in: path, required: true, schema: {type: string, format: uuid}}
    TransactionId: {name: transactionId, in: path, required: true, schema: {type: string, format: uuid}}
    CategoryId: {name: categoryId, in: path, required: true, schema: {type: string, format: uuid}}
    RuleId: {name: ruleId, in: path, required: true, schema: {type: string, format: uuid}}
    Month: {name: month, in: path, required: true, description: YYYY-MM., schema: {type: string, pattern: '^\d{4}-\d{2}$'}}
    SubscriptionId: {name: subscriptionId, in: path, required: true, schema: {type: string, format: uuid}}
  schemas:
    ErrorResponse:
      type: object
      required: [error, request_id]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string, description: 'Machine-readable code, such as managed_by_source.'}
            message: {type: string, description: A sentence for people.}
        request_id: {type: string}
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: {type: integer, format: int64, description: Minor units (cents); negative is money out.}
        currency: {type: string, pattern: '^[A-Z]{3}$', example: EUR}
    AccountKind:
      type: string
      enum: [bank, cash, card, savings, other]
    AccountSourceKind:
      type: string
      description: '`manual`: kept in Life OS. `bank`: connected to a bank (planned).'
      enum: [manual, bank]
    AccountSource:
      type: object
      required: [kind, connectionId, externalId, provider, institution, ibanMasked, syncedAt]
      properties:
        kind: {$ref: '#/components/schemas/AccountSourceKind'}
        connectionId: {type: string, format: uuid, nullable: true, description: The bank connection of a bank account.}
        externalId: {type: string, nullable: true, description: The account's id at the bank.}
        provider: {type: string, nullable: true, description: 'The open-banking provider, such as enablebanking.'}
        institution: {type: string, nullable: true, description: 'The bank, such as Deutsche Bank.'}
        ibanMasked: {type: string, nullable: true, description: 'The masked IBAN, such as DE23…2300.'}
        syncedAt: {type: string, format: date-time, nullable: true, description: When the last bank sync reached the account.}
    Account:
      type: object
      description: >-
        `balance` is the opening balance plus every booked transaction; for
        a bank account that reported one, it is the bank's booked balance
        as of `balanceAsOf` instead, and `available` is the bank's available
        balance. `pending` is the sum of the pending transactions, which are
        not in a computed balance. `transactionCount` counts both.
        `lowBalance` is true while the low-balance alert is on and the
        balance of this bank or cash account (active, in the default
        currency) is below its threshold.
      required: [id, name, kind, currency, openingBalance, balance, balanceAsOf, available, pending, transactionCount, lowBalance, builtIn, archived, archivedAt, source, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        kind: {$ref: '#/components/schemas/AccountKind'}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        openingBalance: {$ref: '#/components/schemas/Money'}
        balance: {$ref: '#/components/schemas/Money'}
        balanceAsOf: {type: string, format: date, nullable: true, description: The date of the bank-reported balance; null for a computed balance.}
        available: {type: object, allOf: [{$ref: '#/components/schemas/Money'}], nullable: true}
        pending: {$ref: '#/components/schemas/Money'}
        transactionCount: {type: integer}
        lowBalance: {type: boolean, description: The balance is below the low-balance alert's threshold.}
        builtIn: {type: boolean, description: True for the built-in Cash account.}
        archived: {type: boolean}
        archivedAt: {type: string, format: date-time, nullable: true}
        source: {$ref: '#/components/schemas/AccountSource'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    AccountList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Account'}}
    CreateAccountRequest:
      type: object
      description: '`kind` defaults to other; `openingBalanceMinor` (minor units of the currency) to 0.'
      required: [name, currency]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        kind: {$ref: '#/components/schemas/AccountKind'}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        openingBalanceMinor: {type: integer, format: int64}
    UpdateAccountRequest:
      type: object
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        kind: {$ref: '#/components/schemas/AccountKind'}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        openingBalanceMinor: {type: integer, format: int64}
        archived: {type: boolean}
    TransactionStatus:
      type: string
      description: '`booked`: settled, counted in the balance. `pending`: not yet settled.'
      enum: [booked, pending]
    TransactionSourceKind:
      type: string
      enum: [manual, csv, bank]
    TransactionDirection:
      type: string
      enum: [in, out]
    TransactionSource:
      type: object
      required: [kind, connectionId, externalId]
      properties:
        kind: {$ref: '#/components/schemas/TransactionSourceKind'}
        connectionId: {type: string, format: uuid, nullable: true, description: The bank connection of a bank transaction.}
        externalId: {type: string, nullable: true, description: 'Identity at the source: the CSV external_id (or a content hash), or the bank transaction id.'}
    Transaction:
      type: object
      description: >-
        `categorizedBy` is `manual` when the category was chosen by hand (by
        the owner, the AI, or the import file; possibly none), `rule` when a
        category rule chose it (`categoryRuleId` names the rule), `mcc` when
        no rule matched and the card's merchant category code gave a default
        category, and null while nobody chose. `readOnly` is true for imported
        transactions: only `categoryId` and `notes` change, and they cannot
        be deleted.
      required: [id, accountId, amount, bookingDate, valueDate, status, counterparty, description, notes, categoryId, categorizedBy, categoryRuleId, merchantCategoryCode, bankReference, source, readOnly, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        accountId: {type: string, format: uuid}
        amount: {$ref: '#/components/schemas/Money'}
        bookingDate: {type: string, format: date}
        valueDate: {type: string, format: date, nullable: true}
        status: {$ref: '#/components/schemas/TransactionStatus'}
        counterparty: {type: string, nullable: true, description: 'Who was paid, or who paid, such as REWE.'}
        description: {type: string, nullable: true, description: What it was for (a bank's purpose text).}
        notes: {type: string, nullable: true, description: The owner's own notes.}
        categoryId: {type: string, format: uuid, nullable: true}
        categorizedBy: {type: string, enum: [manual, rule, mcc], nullable: true}
        categoryRuleId: {type: string, format: uuid, nullable: true}
        merchantCategoryCode: {type: string, nullable: true, description: The card merchant category code (ISO 18245) a bank reported.}
        bankReference: {type: string, nullable: true, description: The bank's own reference.}
        source: {$ref: '#/components/schemas/TransactionSource'}
        readOnly: {type: boolean}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    TransactionList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Transaction'}}
        nextCursor: {type: string, nullable: true, description: Set when more transactions match; pass it as cursor for the next page.}
    CreateManualTransactionRequest:
      type: object
      description: >-
        `accountId` defaults to the built-in Cash account, `bookingDate` to
        today in the owner's timezone, `status` to booked. Without
        `categoryId` the category rules choose.
      required: [amount]
      properties:
        accountId: {type: string, format: uuid}
        amount: {$ref: '#/components/schemas/Money'}
        bookingDate: {type: string, format: date}
        valueDate: {type: string, format: date}
        status: {$ref: '#/components/schemas/TransactionStatus'}
        counterparty: {type: string, maxLength: 200}
        description: {type: string, maxLength: 1000}
        notes: {type: string, maxLength: 2000}
        categoryId: {type: string, format: uuid}
    UpdateTransactionRequest:
      type: object
      minProperties: 1
      description: Imported transactions take only categoryId and notes.
      properties:
        accountId: {type: string, format: uuid}
        amount: {$ref: '#/components/schemas/Money'}
        bookingDate: {type: string, format: date}
        valueDate: {type: string, format: date, nullable: true}
        status: {$ref: '#/components/schemas/TransactionStatus'}
        counterparty: {type: string, maxLength: 200, nullable: true}
        description: {type: string, maxLength: 1000, nullable: true}
        notes: {type: string, maxLength: 2000, nullable: true}
        categoryId: {type: string, format: uuid, nullable: true}
    CategoryKind:
      type: string
      description: '`transfer` is money moved between own accounts; it is neither income nor spending.'
      enum: [expense, income, transfer]
    Category:
      type: object
      description: >-
        `systemKey` marks a default category Finance added (or an existing
        one of the same name and kind it adopted), such as `groceries` or
        `savings`. It never changes, also when the category is renamed, so
        the default merchant rules, the merchant category codes, and the
        budget's savings keep finding it.
      required: [id, name, kind, color, systemKey, archived, archivedAt, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        kind: {$ref: '#/components/schemas/CategoryKind'}
        color: {type: string, nullable: true, pattern: '^#[0-9a-fA-F]{6}$'}
        systemKey: {type: string, nullable: true, enum: [groceries, eating_out, housing, utilities, transport, subscriptions, shopping, health, fun, savings, income, transfers, other]}
        archived: {type: boolean}
        archivedAt: {type: string, format: date-time, nullable: true}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CategoryList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Category'}}
    CreateCategoryRequest:
      type: object
      required: [name, kind]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        kind: {$ref: '#/components/schemas/CategoryKind'}
        color: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
    UpdateCategoryRequest:
      type: object
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        kind: {$ref: '#/components/schemas/CategoryKind'}
        color: {type: string, nullable: true, pattern: '^#[0-9a-fA-F]{6}$'}
        archived: {type: boolean}
    RuleField:
      type: string
      description: '`any` matches the counterparty or the description.'
      enum: [counterparty, description, any]
    RuleOperator:
      type: string
      enum: [contains, equals]
    RuleMatch:
      type: object
      required: [field, operator, text]
      description: 'Case-insensitive; surrounding spaces are ignored. Example: counterparty contains "REWE".'
      properties:
        field: {$ref: '#/components/schemas/RuleField'}
        operator: {$ref: '#/components/schemas/RuleOperator'}
        text: {type: string, minLength: 1, maxLength: 200}
    CategoryRule:
      type: object
      description: Rules are tried lowest `priority` first (then oldest first); the first match wins.
      required: [id, categoryId, match, priority, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        categoryId: {type: string, format: uuid}
        match: {$ref: '#/components/schemas/RuleMatch'}
        priority: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CategoryRuleList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/CategoryRule'}}
    CreateCategoryRuleRequest:
      type: object
      description: >-
        Without `priority` the rule comes after the owner's existing rules
        but before the default merchant rules, which have priorities from
        100000.
      required: [categoryId, match]
      properties:
        categoryId: {type: string, format: uuid}
        match: {$ref: '#/components/schemas/RuleMatch'}
        priority: {type: integer}
    UpdateCategoryRuleRequest:
      type: object
      minProperties: 1
      properties:
        categoryId: {type: string, format: uuid}
        match: {$ref: '#/components/schemas/RuleMatch'}
        priority: {type: integer}
    ApplyScope:
      type: string
      enum: [uncategorized, all]
    ApplyCategoryRulesRequest:
      type: object
      description: '`scope` defaults to uncategorized.'
      properties:
        scope: {$ref: '#/components/schemas/ApplyScope'}
    ApplyCategoryRulesResult:
      type: object
      description: >-
        `examined`: transactions the rules were tried on. `categorized`: had
        no category and got one. `recategorized`: a rule's category was
        replaced by another rule's. `cleared`: a rule's category was removed
        because no rule matches any more (scope all). `unchanged`: the rest.
      required: [scope, examined, categorized, recategorized, cleared, unchanged]
      properties:
        scope: {$ref: '#/components/schemas/ApplyScope'}
        examined: {type: integer}
        categorized: {type: integer}
        recategorized: {type: integer}
        cleared: {type: integer}
        unchanged: {type: integer}
    SpendingByCategory:
      type: object
      required: [categoryId, categoryName, amount]
      properties:
        categoryId: {type: string, format: uuid}
        categoryName: {type: string}
        amount: {$ref: '#/components/schemas/Money'}
    CategoryTotal:
      type: object
      description: >-
        One category's month: `income` (money in) and `spending` (money out)
        are positive, `net` is income minus spending. `categoryId`,
        `categoryName`, and `categoryKind` are null for uncategorized
        transactions.
      required: [categoryId, categoryName, categoryKind, income, spending, net, transactionCount]
      properties:
        categoryId: {type: string, format: uuid, nullable: true}
        categoryName: {type: string, nullable: true}
        categoryKind: {type: string, enum: [expense, income, transfer], nullable: true}
        income: {$ref: '#/components/schemas/Money'}
        spending: {$ref: '#/components/schemas/Money'}
        net: {$ref: '#/components/schemas/Money'}
        transactionCount: {type: integer}
    MonthlySummary:
      type: object
      description: >-
        `spendingByCategory` is the spending per category (not transfers or
        uncategorized), largest first. `byCategory` has every category with
        transactions in the month, uncategorized included, largest spending
        first: the basis for budgets.
      required: [month, currency, totalBalance, income, spending, net, spendingByCategory, byCategory]
      properties:
        month: {type: string}
        currency: {type: string}
        totalBalance: {$ref: '#/components/schemas/Money'}
        income: {$ref: '#/components/schemas/Money'}
        spending: {$ref: '#/components/schemas/Money'}
        net: {$ref: '#/components/schemas/Money'}
        spendingByCategory: {type: array, items: {$ref: '#/components/schemas/SpendingByCategory'}}
        byCategory: {type: array, items: {$ref: '#/components/schemas/CategoryTotal'}}
    BudgetScope:
      type: string
      description: '`month`: only this month. `following`: the regular plan from this month on.'
      enum: [month, following]
    BudgetPlanSource:
      type: string
      description: '`month`: the month has its own plan. `regular`: it follows the regular plan.'
      enum: [month, regular]
    BudgetPlan:
      type: object
      description: >-
        The plan that applies to the month. `since` is the month the regular
        plan applies from (the month itself for its own plan).
        `unallocated` is the expected income minus the planned spending and
        the savings goal; negative when the plan spends more than the
        income.
      required: [source, since, expectedIncome, savingsGoal, unallocated, updatedAt]
      properties:
        source: {$ref: '#/components/schemas/BudgetPlanSource'}
        since: {type: string, description: YYYY-MM.}
        expectedIncome: {$ref: '#/components/schemas/Money'}
        savingsGoal: {$ref: '#/components/schemas/Money'}
        unallocated: {$ref: '#/components/schemas/Money'}
        updatedAt: {type: string, format: date-time}
    BudgetLineStatus:
      type: string
      description: '`under`: below 80% of the planned amount. `near`: 80% or more. `over`: more than planned. `unplanned`: spending in a category the plan has no amount for.'
      enum: [under, near, over, unplanned]
    BudgetLine:
      type: object
      description: >-
        One expense category's month. `spent` is its money out less refunds
        (never below 0), booked and pending; `pending` is the part of it
        still pending. `remaining` is planned minus spent (negative when
        over). `percent` is spent as a percentage of planned, rounded down;
        null without a planned amount.
      required: [categoryId, categoryName, categoryColor, archived, planned, spent, pending, remaining, percent, status, transactionCount]
      properties:
        categoryId: {type: string, format: uuid}
        categoryName: {type: string}
        categoryColor: {type: string, nullable: true}
        archived: {type: boolean}
        planned: {$ref: '#/components/schemas/Money'}
        spent: {$ref: '#/components/schemas/Money'}
        pending: {$ref: '#/components/schemas/Money'}
        remaining: {$ref: '#/components/schemas/Money'}
        percent: {type: integer, nullable: true}
        status: {$ref: '#/components/schemas/BudgetLineStatus'}
        transactionCount: {type: integer}
    BudgetUncategorized:
      type: object
      description: Money out without a category, booked and pending; it counts as spending.
      required: [spent, pending, transactionCount]
      properties:
        spent: {$ref: '#/components/schemas/Money'}
        pending: {$ref: '#/components/schemas/Money'}
        transactionCount: {type: integer}
    BudgetTotals:
      type: object
      description: >-
        `planned` is the sum of the plan's category amounts; `spent` all
        spending (planned categories, unplanned ones, and uncategorized),
        of it `pending`; `remaining` is planned minus spent.
      required: [planned, spent, pending, remaining, percent]
      properties:
        planned: {$ref: '#/components/schemas/Money'}
        spent: {$ref: '#/components/schemas/Money'}
        pending: {$ref: '#/components/schemas/Money'}
        remaining: {$ref: '#/components/schemas/Money'}
        percent: {type: integer, nullable: true}
    BudgetIncome:
      type: object
      description: Money in, booked and pending, in income categories (less money out there) and without a category; of it `pending`.
      required: [actual, pending]
      properties:
        actual: {$ref: '#/components/schemas/Money'}
        pending: {$ref: '#/components/schemas/Money'}
    BudgetSavings:
      type: object
      description: >-
        `saved` is the month's income minus its spending. `movedToSavings`
        is the money moved out in the Savings category (`systemKey`
        savings) from accounts other than savings accounts, less money moved
        back; `leftover` is the rest of `saved`. `percent` is saved against
        the plan's savings goal, rounded down; null without a goal.
      required: [movedToSavings, leftover, saved, percent]
      properties:
        movedToSavings: {$ref: '#/components/schemas/Money'}
        leftover: {$ref: '#/components/schemas/Money'}
        saved: {$ref: '#/components/schemas/Money'}
        percent: {type: integer, nullable: true}
    ExcludedCurrency:
      type: object
      required: [currency, transactionCount]
      properties:
        currency: {type: string}
        transactionCount: {type: integer}
    BudgetMonth:
      type: object
      description: >-
        A month's budget in `currency` (the budget currency). `lines` lists
        the plan's categories by name, then expense categories with
        spending the plan has no amount for (`unplanned`), largest first.
      required: [month, currency, plan, lines, uncategorized, totals, income, savings, excludedCurrencies]
      properties:
        month: {type: string, description: YYYY-MM.}
        currency: {type: string}
        plan: {type: object, allOf: [{$ref: '#/components/schemas/BudgetPlan'}], nullable: true}
        lines: {type: array, items: {$ref: '#/components/schemas/BudgetLine'}}
        uncategorized: {$ref: '#/components/schemas/BudgetUncategorized'}
        totals: {$ref: '#/components/schemas/BudgetTotals'}
        income: {$ref: '#/components/schemas/BudgetIncome'}
        savings: {$ref: '#/components/schemas/BudgetSavings'}
        excludedCurrencies: {type: array, description: Currencies with transactions in the month that the budget leaves out., items: {$ref: '#/components/schemas/ExcludedCurrency'}}
    BudgetLineInput:
      type: object
      required: [categoryId, amountMinor]
      properties:
        categoryId: {type: string, format: uuid}
        amountMinor: {type: integer, format: int64, minimum: 0}
    SaveBudgetPlanRequest:
      type: object
      required: [scope, expectedIncomeMinor, savingsGoalMinor, lines]
      properties:
        scope: {$ref: '#/components/schemas/BudgetScope'}
        expectedIncomeMinor: {type: integer, format: int64, minimum: 0}
        savingsGoalMinor: {type: integer, format: int64, minimum: 0}
        lines: {type: array, maxItems: 500, items: {$ref: '#/components/schemas/BudgetLineInput'}}
    BudgetCategorySuggestion:
      type: object
      required: [categoryId, suggested, monthsWithSpending]
      properties:
        categoryId: {type: string, format: uuid}
        suggested: {type: object, allOf: [{$ref: '#/components/schemas/Money'}], nullable: true}
        monthsWithSpending: {type: integer}
    BudgetSuggestions:
      type: object
      description: '`months` are the complete months (YYYY-MM, oldest first) the suggestions are based on.'
      required: [currency, months, income, saved, categories]
      properties:
        currency: {type: string}
        months: {type: array, items: {type: string}}
        income: {type: object, allOf: [{$ref: '#/components/schemas/Money'}], nullable: true}
        saved: {type: object, allOf: [{$ref: '#/components/schemas/Money'}], nullable: true}
        categories: {type: array, items: {$ref: '#/components/schemas/BudgetCategorySuggestion'}}
    SubscriptionState:
      type: string
      description: '`suggested`: detected, waiting for the owner. `confirmed`: the owner''s. `ignored`: never suggested again for this counterparty and cadence.'
      enum: [suggested, confirmed, ignored]
    SubscriptionCadence:
      type: string
      enum: [weekly, monthly, quarterly, yearly]
    SubscriptionRenewal:
      type: string
      description: >-
        Where a confirmed subscription's next payment stands, in the
        owner's days: `upcoming` within the renewal reminders' lead days
        (today included), `overdue` up to a week after the expected date
        without a payment, `missed` more than a week late (shown, never
        alerted), `scheduled` otherwise.
      enum: [scheduled, upcoming, overdue, missed]
    Subscription:
      type: object
      description: >-
        A recurring payment. `amount` is the typical payment (the median of
        the last three, positive) unless the owner set one; `monthlyAmount`
        is its monthly equivalent (weekly times 52/12, quarterly a third,
        yearly a twelfth). `lastDate` is the latest matching payment and
        `nextDate` the date the next one is expected (the last plus the
        cadence). `renewal` is null unless the subscription is confirmed.
        `confidence` is low for a yearly payment seen only twice.
        `transactionIds` are the matching payments, latest first. `source`
        is `detected` or `manual` (marked from a transaction).
      required: [id, name, state, cadence, amount, monthlyAmount, categoryId, accountId, lastDate, nextDate, renewal, confidence, source, transactionIds, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        state: {$ref: '#/components/schemas/SubscriptionState'}
        cadence: {$ref: '#/components/schemas/SubscriptionCadence'}
        amount: {$ref: '#/components/schemas/Money'}
        monthlyAmount: {$ref: '#/components/schemas/Money'}
        categoryId: {type: string, format: uuid, nullable: true}
        accountId: {type: string, format: uuid, nullable: true, description: The account of the latest payment.}
        lastDate: {type: string, format: date, nullable: true}
        nextDate: {type: string, format: date, nullable: true}
        renewal: {type: object, allOf: [{$ref: '#/components/schemas/SubscriptionRenewal'}], nullable: true}
        confidence: {type: string, enum: [high, low]}
        source: {type: string, enum: [detected, manual]}
        transactionIds: {type: array, items: {type: string, format: uuid}}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    SubscriptionTotals:
      type: object
      description: >-
        `monthly` is the monthly equivalent of the confirmed subscriptions in
        `currency` (the default currency), `confirmed` how many there are;
        `excluded` counts confirmed subscriptions in other currencies, which
        are left out.
      required: [currency, monthly, confirmed, excluded]
      properties:
        currency: {type: string}
        monthly: {$ref: '#/components/schemas/Money'}
        confirmed: {type: integer}
        excluded: {type: integer}
    SubscriptionList:
      type: object
      required: [items, totals]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Subscription'}}
        totals: {$ref: '#/components/schemas/SubscriptionTotals'}
    CreateSubscriptionRequest:
      type: object
      description: '`cadence` defaults to monthly; `name` to the counterparty; `categoryId` to the transaction''s category.'
      required: [transactionId]
      properties:
        transactionId: {type: string, format: uuid}
        cadence: {$ref: '#/components/schemas/SubscriptionCadence'}
        name: {type: string, minLength: 1, maxLength: 100}
        categoryId: {type: string, format: uuid}
    UpdateSubscriptionRequest:
      type: object
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        cadence: {$ref: '#/components/schemas/SubscriptionCadence'}
        amountMinor: {type: integer, format: int64, minimum: 1, description: The typical payment in minor units (positive).}
        categoryId: {type: string, format: uuid, nullable: true}
    AmountAlert:
      type: object
      required: [enabled, threshold]
      properties:
        enabled: {type: boolean}
        threshold: {$ref: '#/components/schemas/Money'}
    RenewalAlert:
      type: object
      required: [enabled, leadDays]
      properties:
        enabled: {type: boolean}
        leadDays: {type: integer, minimum: 0, maximum: 30, description: How many days before a confirmed subscription's next payment the reminder comes (0 is on the day).}
    FinanceSettings:
      type: object
      description: >-
        `largeDebit`: a medium notification for each money-out transaction
        of at least the threshold (booked or pending, booked in the last
        three days). `lowBalance`: a medium notification when a bank or
        cash account's balance falls below the threshold, again after it
        went back above. `renewals`: a low notification `leadDays` before a
        confirmed subscription's next payment. Thresholds are in
        `currency`, the default currency; accounts and transactions in other
        currencies are not checked.
      required: [currency, largeDebit, lowBalance, renewals, updatedAt]
      properties:
        currency: {type: string}
        largeDebit: {$ref: '#/components/schemas/AmountAlert'}
        lowBalance: {$ref: '#/components/schemas/AmountAlert'}
        renewals: {$ref: '#/components/schemas/RenewalAlert'}
        updatedAt: {type: string, format: date-time}
    AmountAlertInput:
      type: object
      required: [enabled, thresholdMinor]
      properties:
        enabled: {type: boolean}
        thresholdMinor: {type: integer, format: int64, minimum: 0, description: Minor units of the default currency; at least 1 for large debits.}
    RenewalAlertInput:
      type: object
      required: [enabled, leadDays]
      properties:
        enabled: {type: boolean}
        leadDays: {type: integer, minimum: 0, maximum: 30}
    UpdateFinanceSettingsRequest:
      type: object
      required: [largeDebit, lowBalance, renewals]
      properties:
        largeDebit: {$ref: '#/components/schemas/AmountAlertInput'}
        lowBalance: {$ref: '#/components/schemas/AmountAlertInput'}
        renewals: {$ref: '#/components/schemas/RenewalAlertInput'}
    CsvImportError:
      type: object
      required: [row, message]
      properties:
        row: {type: integer, minimum: 1, description: The CSV line (the header is row 1).}
        message: {type: string}
    CsvImport:
      type: object
      description: >-
        `imported`: new transactions. `duplicates`: rows the account already
        had. `categorized`: imported rows that got their category from a
        rule. `status` is failed when nothing was imported and some rows
        failed. `accountId` is null for an older-format file.
      required: [id, accountId, status, imported, duplicates, failed, categorized, errors]
      properties:
        id: {type: string, format: uuid}
        accountId: {type: string, format: uuid, nullable: true}
        status: {type: string, enum: [completed, failed]}
        imported: {type: integer}
        duplicates: {type: integer}
        failed: {type: integer}
        categorized: {type: integer}
        errors: {type: array, items: {$ref: '#/components/schemas/CsvImportError'}}
    BankBalance:
      type: object
      required: [amount, currency, date]
      properties:
        amount: {type: integer, format: int64, description: Minor units.}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        date: {type: string, format: date, description: The day the bank reported it for.}
    BankAccountInput:
      type: object
      required: [externalId, name, kind, currency]
      properties:
        externalId: {type: string, minLength: 1, maxLength: 200, description: Stable per connection.}
        name: {type: string, minLength: 1, maxLength: 100}
        kind: {type: string, enum: [bank, card, savings]}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        ibanMasked: {type: string, maxLength: 64, description: 'Such as DE23…2300; never the full IBAN.'}
        bookedBalance: {$ref: '#/components/schemas/BankBalance'}
        availableBalance: {$ref: '#/components/schemas/BankBalance'}
    BankTransactionInput:
      type: object
      required: [accountExternalId, externalId, status, bookingDate, amount]
      properties:
        accountExternalId: {type: string, minLength: 1, maxLength: 200}
        externalId: {type: string, minLength: 1, maxLength: 200, description: The bank's stable transaction id.}
        status: {$ref: '#/components/schemas/TransactionStatus'}
        bookingDate: {type: string, format: date}
        valueDate: {type: string, format: date}
        amount: {$ref: '#/components/schemas/Money'}
        counterparty: {type: string, maxLength: 200}
        description: {type: string, maxLength: 1000, description: The remittance text.}
        merchantCategoryCode: {type: string, maxLength: 8}
        bankReference: {type: string, maxLength: 200}
    BankImportWindow:
      type: object
      required: [from, to]
      description: The booking dates this sync covers (inclusive).
      properties:
        from: {type: string, format: date}
        to: {type: string, format: date}
    BankImportRequest:
      type: object
      required: [connectionId, provider, institution, window, accounts, transactions]
      properties:
        connectionId: {type: string, format: uuid, description: The connection's id in the banking service.}
        provider: {type: string, minLength: 1, maxLength: 64, example: enablebanking}
        institution: {type: string, minLength: 1, maxLength: 200, example: Deutsche Bank}
        window: {$ref: '#/components/schemas/BankImportWindow'}
        accounts: {type: array, items: {$ref: '#/components/schemas/BankAccountInput'}}
        transactions: {type: array, items: {$ref: '#/components/schemas/BankTransactionInput'}}
    BankAccountId:
      type: object
      required: [externalId, id]
      properties:
        externalId: {type: string}
        id: {type: string, format: uuid, description: The Finance account id.}
    BankImportResult:
      type: object
      description: >-
        `accountIds` maps every account of the sync to its Finance id.
        `transactions.removedPending` counts pending transactions removed
        because a booked one replaced them or the sync no longer has them;
        `skipped` counts zero-amount transactions.
      required: [accountIds, accounts, transactions]
      properties:
        accountIds: {type: array, items: {$ref: '#/components/schemas/BankAccountId'}}
        accounts:
          type: object
          required: [created, updated]
          properties:
            created: {type: integer}
            updated: {type: integer}
        transactions:
          type: object
          required: [created, updated, unchanged, removedPending, skipped]
          properties:
            created: {type: integer}
            updated: {type: integer}
            unchanged: {type: integer}
            removedPending: {type: integer}
            skipped: {type: integer}
