openapi: 3.0.3
info:
  title: Life OS Voice API
  version: 1.0.0
  description: >-
    Every write (POST, PUT, PATCH, DELETE) must say who makes it in the
    X-Life-OS-Actor header: `user` (the owner), `agent:<name>` (the Life OS
    AI), `system:<name>` (a Life OS component), or `dev:<name>` (a development
    tool or agent working on Life OS, such as Claude Code). Names are 1-64
    letters, digits, '.', '_', or '-'. A write without a valid actor is
    rejected with 400 and error code `actor_required`; nothing is attributed to
    the owner by default. Reads do not need the header. The public gateway
    passes only `user` and `dev:<name>`.
  license: {name: UNLICENSED, url: https://life-os.local/license}
servers: [{url: http://voice:8080}]
paths:
  /v1/backlog:
    get:
      summary: Summarize unfinished transcription work and worker dependencies
      description: Counts and timestamps from durable job state, plus a short readiness probe of the configured Whisper service. workerStalled is true when a processing lease has expired, or when jobs have been due for over two minutes while nothing is processing.
      operationId: getAudioBacklog
      security: []
      responses: {'200': {description: Backlog summary, content: {application/json: {schema: {$ref: '#/components/schemas/AudioBacklog'}}}}}
  /v1/audio-jobs:
    post:
      summary: Upload audio and enqueue asynchronous transcription
      operationId: createAudioJob
      security: []
      requestBody: {required: true, content: {multipart/form-data: {schema: {type: object, required: [audio], properties: {audio: {type: string, format: binary}, source: {type: string, enum: [web, watch, manual], default: web}, sourceMetadata: {type: string, description: JSON object encoded as a multipart field}}}}}}
      responses: {'202': {description: Accepted transcription job, content: {application/json: {schema: {$ref: '#/components/schemas/AudioJob'}}}}, '400': {description: Invalid audio}, '413': {description: Audio exceeds configured limit}}
  /v1/audio-jobs/{jobId}:
    get:
      summary: Poll an asynchronous transcription job
      operationId: getAudioJob
      security: []
      parameters: [{name: jobId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Job status, content: {application/json: {schema: {$ref: '#/components/schemas/AudioJob'}}}}, '404': {description: Job not found}}
components:
  schemas:
    AudioBacklog:
      type: object
      required: [queuedCount, processingCount, retryableCount, workerStalled, whisperReady]
      properties:
        queuedCount: {type: integer}
        processingCount: {type: integer}
        retryableCount: {type: integer, description: Jobs waiting for an automatic retry}
        oldestWaitingAt: {type: string, format: date-time, nullable: true, description: Creation time of the oldest unfinished job}
        nextRetryAt: {type: string, format: date-time, nullable: true, description: Earliest scheduled retry of a retryable job}
        workerStalled: {type: boolean}
        whisperReady: {type: boolean, description: Whether the Whisper service answered its readiness probe}
        lastFailureAt: {type: string, format: date-time, nullable: true}
        lastFailureSummary: {type: string, nullable: true}
    AudioJob:
      type: object
      required: [id, status, source, attemptCount, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [queued, processing, succeeded, retryable, failed, expired]}
        source: {type: string, enum: [web, watch, manual]}
        transcript: {type: string, nullable: true}
        inboxItemId: {type: string, format: uuid, nullable: true}
        errorSummary: {type: string, nullable: true}
        attemptCount: {type: integer, minimum: 0}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        completedAt: {type: string, format: date-time, nullable: true}
        expiresAt: {type: string, format: date-time, nullable: true}
