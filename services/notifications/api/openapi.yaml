openapi: 3.0.3
info:
  title: Life OS Notifications API
  version: 1.0.0
  description: >-
    The one path by which Life OS lets its owner know about something. A
    service that needs to tell the owner something posts a notification here;
    Notifications stores it (the Dashboard lists every notification), keeps
    its read state, and delivers it through the channels configured on this
    server. Producers never talk to a channel themselves. Producers in Go use
    `pkg/notify`.


    Importance: `high` means something is broken or needs action now (a
    service went down); `medium` is worth knowing soon (Inbox needs Human
    Review, a Calendar event reminder); `low` is informational (for example
    Finance or Food messages). There are no quiet hours. Every importance is
    delivered right away; a channel decides how loudly (low arrives silently).


    Channels are configured on the server (`NOTIFICATIONS_CHANNELS`), never
    through this API. When a notification is created, one delivery per enabled
    channel is queued and retried with exponential backoff until it is sent,
    fails permanently, or is older than the maximum delivery age. With no
    channel configured, notifications are stored and listed only, and their
    `deliveries` are empty.


    Every write (POST) must say who makes it in the X-Life-OS-Actor header:
    `user` (the owner), `agent:<name>` (the Life OS AI), `system:<name>` (a
    Life OS component, for example `system:calendar`), or `dev:<name>` (a
    development tool or agent working on Life OS, such as Claude Code). Names
    are 1-64 letters, digits, '.', '_', or '-'. A write without a valid actor
    is rejected with 400 and error code `actor_required`. Reads do not need the
    header. The public gateway passes only `user` and `dev:<name>`.


    Web push (`/v1/push/...`): browsers that turn on notifications in the
    Dashboard, above all the installed Life OS app on the owner's phone,
    subscribe here, and the `webpush` channel delivers every notification to
    each of them through its browser's push service.


    Errors use the shared envelope `{"error": {"code", "message"},
    "request_id"}`: `bad_request` (400, invalid input), `actor_required` (400),
    `not_found` (404), `push_not_configured` (409, web push has no VAPID keys
    on this server), and `internal_error` (500).
  license: {name: UNLICENSED, url: https://life-os.local/license}
servers: [{url: http://notifications:8080}]
paths:
  /v1/notifications:
    get:
      summary: List notifications
      description: >-
        Newest first: ordered by createdAt (when Notifications received the
        notification), then id. When more notifications match than `limit`,
        `nextCursor` is set: pass it back as `cursor`, with the same filters,
        for the next page. A response without `nextCursor` is the last page.
      operationId: listNotifications
      security: []
      parameters:
        - {name: importance, in: query, description: Only notifications of this importance., schema: {$ref: '#/components/schemas/NotificationImportance'}}
        - name: category
          in: query
          description: >-
            A category or a category prefix: `calendar` matches `calendar` and
            every `calendar.*` category (such as `calendar.reminder`);
            `calendar.reminder` matches only that category and its
            subcategories.
          schema: {type: string, minLength: 1, maxLength: 100, pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$'}
        - {name: source, in: query, description: 'Only notifications from this source, such as calendar or dashboard.', schema: {type: string, minLength: 1, maxLength: 64, pattern: '^[a-z0-9][a-z0-9._-]*$'}}
        - {name: unread, in: query, description: true lists only unread notifications; false only read ones., schema: {type: boolean}}
        - {name: cursor, in: query, description: The previous page's nextCursor. Opaque; only valid with the filters it was returned for., schema: {type: string, minLength: 1, maxLength: 200}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200': {description: Notifications, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationList'}}}}
        '400': {description: 'Invalid request, such as a malformed cursor or filter (bad_request)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    post:
      summary: Send a notification
      description: >-
        Stores the notification and queues one delivery per channel enabled on
        the server. `dedupeKey` makes sending idempotent: a repeat with a key
        that was already used returns the original notification unchanged with
        200 (the first notification wins; the repeat's fields are ignored and
        nothing is delivered again). Namespace keys with the category, for
        example `calendar.reminder:<eventId>:<startAt>:<minutes>`. `source`
        defaults to the actor's name: `system:calendar` becomes `calendar`,
        `agent:<name>` becomes `<name>`, `user` becomes `dashboard`, and any
        development tool (`dev:<name>`) becomes `dev`.
      operationId: createNotification
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateNotificationRequest'}}}}
      responses:
        '200': {description: 'The dedupeKey was already used: the original notification, unchanged', content: {application/json: {schema: {$ref: '#/components/schemas/Notification'}}}}
        '201': {description: Notification stored and its deliveries queued, content: {application/json: {schema: {$ref: '#/components/schemas/Notification'}}}}
        '400': {description: 'Invalid notification (bad_request), or no valid X-Life-OS-Actor (actor_required)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/notifications/unread-count:
    get:
      summary: Count unread notifications
      description: A cheap read for a navigation badge.
      operationId: getUnreadCount
      security: []
      responses:
        '200': {description: Unread counts, content: {application/json: {schema: {$ref: '#/components/schemas/UnreadCount'}}}}
        '400': {description: Invalid request, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/notifications/read-all:
    post:
      summary: Mark all notifications read
      description: >-
        Marks every unread notification read, or with `before` only those
        created at or before that instant (so a notification that arrives
        while the owner looks at the list stays unread). The body is optional.
      operationId: markAllNotificationsRead
      security: []
      requestBody: {required: false, content: {application/json: {schema: {$ref: '#/components/schemas/MarkAllReadRequest'}}}}
      responses:
        '200': {description: Notifications marked read, content: {application/json: {schema: {$ref: '#/components/schemas/MarkAllReadResult'}}}}
        '400': {description: 'Invalid request (bad_request), or no valid X-Life-OS-Actor (actor_required)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/notifications/{notificationId}:
    get:
      summary: Get a notification
      description: The notification with the state of each of its deliveries.
      operationId: getNotification
      security: []
      parameters: [{name: notificationId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Notification, content: {application/json: {schema: {$ref: '#/components/schemas/Notification'}}}}
        '400': {description: Invalid notification id, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {description: Notification not found (not_found), content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/notifications/{notificationId}/read:
    post:
      summary: Mark a notification read
      description: Idempotent; a notification that is already read keeps its readAt.
      operationId: markNotificationRead
      security: []
      parameters: [{name: notificationId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: 'The notification, now read', content: {application/json: {schema: {$ref: '#/components/schemas/Notification'}}}}
        '400': {description: 'Invalid notification id, or no valid X-Life-OS-Actor (actor_required)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {description: Notification not found (not_found), content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/channels:
    get:
      summary: List delivery channels and their health
      description: >-
        One entry per channel configured on this server
        (`NOTIFICATIONS_CHANNELS`), in the configured order, with what its
        deliveries show: the latest success, the latest failure (a failed
        delivery or one waiting for a retry) and its error, failures in the
        last 24 hours, and deliveries waiting now. `state` sums it up. An
        empty list means no channel is configured: notifications are stored
        and listed only. The Dashboard Status page shows this.
      operationId: listChannels
      security: []
      responses:
        '200': {description: Configured channels, content: {application/json: {schema: {$ref: '#/components/schemas/ChannelList'}}}}
        '400': {description: Invalid request, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/push/config:
    get:
      summary: Web push configuration
      description: >-
        What a browser needs to subscribe: the server's VAPID public key (its
        applicationServerKey), or `configured: false` when web push has no
        keys on this server. `delivering` says whether notifications are
        delivered by web push (`webpush` in `NOTIFICATIONS_CHANNELS`);
        without it, subscribed devices only receive test pushes.
      operationId: getPushConfig
      security: []
      responses:
        '200': {description: Web push configuration, content: {application/json: {schema: {$ref: '#/components/schemas/PushConfig'}}}}
        '400': {description: Invalid request, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/push/subscriptions:
    get:
      summary: List the subscribed devices
      description: Every browser that turned on notifications, oldest first, with its latest push outcome.
      operationId: listPushSubscriptions
      security: []
      responses:
        '200': {description: Subscribed devices, content: {application/json: {schema: {$ref: '#/components/schemas/PushSubscriptionList'}}}}
        '400': {description: Invalid request, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    post:
      summary: Subscribe a device
      description: >-
        Stores a browser's push subscription, the JSON of its
        `PushSubscription` (`endpoint` and `keys`). Idempotent by endpoint:
        subscribing again with a known endpoint updates its keys and label
        and returns it with 200; a new endpoint is created (201). The device
        label is read from the request's User-Agent, such as "Chrome on
        Android". The endpoint must be an https URL on a push service's host
        name. A paired device's request (its device key, the identity
        token's via "device") stores the key's id with it, so that revoking
        the key deletes the subscription; subscribing again moves an
        endpoint to the key that sent it, and a request without a device key
        (a browser) clears it.
      operationId: createPushSubscription
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PushSubscriptionRequest'}}}}
      responses:
        '200': {description: 'The endpoint was already subscribed: the device, updated', content: {application/json: {schema: {$ref: '#/components/schemas/PushSubscription'}}}}
        '201': {description: Device subscribed, content: {application/json: {schema: {$ref: '#/components/schemas/PushSubscription'}}}}
        '400': {description: 'Invalid subscription (bad_request), or no valid X-Life-OS-Actor (actor_required)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: Web push has no VAPID keys on this server (push_not_configured), content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/push/subscriptions/{subscriptionId}:
    delete:
      summary: Remove a device
      description: The device gets no more pushes. Its browser keeps its own subscription until it unsubscribes.
      operationId: deletePushSubscription
      security: []
      parameters: [{name: subscriptionId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '204': {description: Device removed}
        '400': {description: 'Invalid id, or no valid X-Life-OS-Actor (actor_required)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {description: No such device (not_found), content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/push/device-keys/{keyId}:
    delete:
      summary: Remove a revoked device key's devices
      description: >-
        Deletes every push subscription a paired device's key made. For the
        Dashboard on the private network, when the key is revoked (Settings
        → Devices, signing out everywhere, ./setup.sh sign-out-all); a
        request that carries an identity token, which every request through
        the gateway does, is refused (403 internal_only). Idempotent: 204
        with or without subscriptions.
      operationId: deleteDeviceKeySubscriptions
      security: []
      parameters: [{name: keyId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '204': {description: The key's subscriptions are gone}
        '400': {description: 'Invalid id, or no valid X-Life-OS-Actor (actor_required)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {description: Not an internal caller (internal_only), content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/push/test:
    post:
      summary: Send a test push
      description: >-
        Sends a test notification ("Test notification", opening
        /notifications) to every subscribed device, or to the one named by
        `subscriptionId`, right away and outside the delivery queue, and
        answers with each device's outcome: `sent`, `removed` (its push
        service says the subscription is gone, so it was deleted), or
        `failed` with the error. It is not stored as a notification. Works
        whether or not `webpush` is a delivery channel.
      operationId: sendPushTest
      security: []
      requestBody: {required: false, content: {application/json: {schema: {$ref: '#/components/schemas/PushTestRequest'}}}}
      responses:
        '200': {description: Each device's outcome; empty without devices, content: {application/json: {schema: {$ref: '#/components/schemas/PushTestResult'}}}}
        '400': {description: 'Invalid request (bad_request), or no valid X-Life-OS-Actor (actor_required)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {description: No such device (not_found), content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: Web push has no VAPID keys on this server (push_not_configured), content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
components:
  schemas:
    ChannelState:
      type: string
      description: >-
        ok = the latest outcome was a success; failing = the latest outcome
        was a failure (a delivery failed, or waits for a retry, after the
        latest success); idle = nothing has been delivered or failed yet.
      enum: [ok, failing, idle]
    Channel:
      type: object
      description: One configured delivery channel and the health its deliveries show.
      required: [name, state, lastSuccessAt, lastFailureAt, lastError, recentFailures, retrying, pending]
      properties:
        name: {type: string, description: 'Channel name, such as ntfy.'}
        state: {$ref: '#/components/schemas/ChannelState'}
        lastSuccessAt: {type: string, format: date-time, nullable: true, description: When a delivery through it was last sent.}
        lastFailureAt: {type: string, format: date-time, nullable: true, description: When a delivery through it last failed or was scheduled for a retry.}
        lastError: {type: string, nullable: true, description: The error of that latest failure.}
        recentFailures: {type: integer, minimum: 0, description: 'Deliveries that failed, or wait for a retry, last changed in the past 24 hours.'}
        retrying: {type: integer, minimum: 0, description: Deliveries waiting for another attempt now.}
        pending: {type: integer, minimum: 0, description: Deliveries queued for a first attempt now.}
    ChannelList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Channel'}}
    NotificationImportance:
      type: string
      description: >-
        high = something is broken or needs action now (a service went down);
        medium = worth knowing soon (Human Review, a Calendar reminder); low =
        informational, delivered silently.
      enum: [low, medium, high]
    DeliveryStatus:
      type: string
      description: >-
        pending = queued and not tried yet, or being sent now; retrying = an
        attempt failed and another is scheduled at nextAttemptAt; sent = the
        channel accepted it; failed = a permanent error, or no success within
        the maximum delivery age; skipped = deliberately not sent, for example
        because the channel is no longer configured.
      enum: [pending, sent, retrying, failed, skipped]
    Delivery:
      type: object
      description: The delivery of one notification through one channel.
      required: [channel, status, attempts, lastError, nextAttemptAt, sentAt]
      properties:
        channel: {type: string, description: 'Channel name, such as ntfy.'}
        status: {$ref: '#/components/schemas/DeliveryStatus'}
        attempts: {type: integer, minimum: 0, description: Attempts started so far.}
        lastError: {type: string, nullable: true, description: The most recent failed attempt's error.}
        nextAttemptAt: {type: string, format: date-time, nullable: true, description: When the next attempt is due (pending and retrying only).}
        sentAt: {type: string, format: date-time, nullable: true}
    Notification:
      type: object
      required: [id, title, body, importance, category, source, link, dedupeKey, occurredAt, createdAt, readAt, deliveries]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        body: {type: string, description: Plain text; empty when the title says everything.}
        importance: {$ref: '#/components/schemas/NotificationImportance'}
        category: {type: string, description: 'Dotted lowercase kind, such as calendar.reminder.'}
        source: {type: string, description: 'The producing service or client, such as calendar or dashboard.'}
        link: {type: string, nullable: true, description: 'A Life OS path to open, such as /calendar?date=2026-10-10.'}
        dedupeKey: {type: string}
        occurredAt: {type: string, format: date-time, description: When the notified thing happened (defaults to createdAt).}
        createdAt: {type: string, format: date-time, description: When Notifications received it.}
        readAt: {type: string, format: date-time, nullable: true, description: When the owner marked it read; null while unread.}
        deliveries: {type: array, items: {$ref: '#/components/schemas/Delivery'}}
    CreateNotificationRequest:
      type: object
      required: [title, importance, category, dedupeKey]
      properties:
        title: {type: string, minLength: 1, maxLength: 200, description: 'One line, without control characters; surrounding spaces are trimmed.'}
        body: {type: string, maxLength: 2000, description: 'Plain text (no HTML or Markdown); line breaks and tabs are kept.'}
        importance: {$ref: '#/components/schemas/NotificationImportance'}
        category:
          type: string
          minLength: 3
          maxLength: 100
          pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'
          description: 'Dotted lowercase kind with at least two parts, such as calendar.reminder, inbox.human_review, status.service_down, or test.manual.'
        source: {type: string, minLength: 1, maxLength: 64, pattern: '^[a-z0-9][a-z0-9._-]*$', description: The producing service. Defaults to the actor's name (see createNotification).}
        link: {type: string, minLength: 1, maxLength: 500, pattern: '^/([^/\\]|$)', description: 'A Life OS path starting with a single /, such as /inbox or /calendar?date=2026-10-10. Absolute and protocol-relative URLs are rejected.'}
        dedupeKey: {type: string, minLength: 1, maxLength: 200, description: 'Idempotency key, unique across all notifications; without control characters or surrounding spaces.'}
        occurredAt: {type: string, format: date-time, description: When the notified thing happened. Defaults to now.}
    NotificationList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Notification'}}
        nextCursor: {type: string, nullable: true, description: Set when more notifications match; pass it as cursor for the next page.}
    UnreadCount:
      type: object
      required: [count, highCount]
      properties:
        count: {type: integer, minimum: 0, description: Unread notifications.}
        highCount: {type: integer, minimum: 0, description: Unread notifications of high importance.}
    MarkAllReadRequest:
      type: object
      properties:
        before: {type: string, format: date-time, description: Only notifications created at or before this instant.}
    MarkAllReadResult:
      type: object
      required: [marked]
      properties:
        marked: {type: integer, minimum: 0, description: Notifications that were unread and are now read.}
    PushConfig:
      type: object
      required: [configured, publicKey, delivering]
      properties:
        configured: {type: boolean, description: Whether web push has VAPID keys on this server; without them nothing can subscribe.}
        publicKey: {type: string, nullable: true, description: 'The VAPID public key (base64url, an uncompressed P-256 point) to subscribe with; null when not configured.'}
        delivering: {type: boolean, description: Whether notifications are delivered by web push (webpush is a delivery channel).}
    PushSubscriptionRequest:
      type: object
      description: A browser's PushSubscription.toJSON().
      required: [endpoint, keys]
      properties:
        endpoint: {type: string, minLength: 9, maxLength: 2048, description: 'The push service URL, https, such as https://fcm.googleapis.com/fcm/send/….'}
        expirationTime: {type: number, nullable: true, description: Ignored; push services report an expired subscription with 404 or 410.}
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: {type: string, minLength: 1, maxLength: 200, description: 'The browser''s P-256 public key, base64url (65 bytes).'}
            auth: {type: string, minLength: 1, maxLength: 100, description: 'The browser''s auth secret, base64url (16 bytes).'}
    PushSubscription:
      type: object
      description: One subscribed device.
      required: [id, deviceLabel, endpoint, pushService, createdAt, lastSuccessAt, lastFailureAt, lastError, deviceKeyId]
      properties:
        id: {type: string, format: uuid}
        deviceLabel: {type: string, description: 'Read from its user agent, such as "Chrome on Android".'}
        endpoint: {type: string, description: 'Its push service URL; a browser finds its own device by it.'}
        pushService: {type: string, description: 'The push service''s host, such as fcm.googleapis.com.'}
        createdAt: {type: string, format: date-time}
        lastSuccessAt: {type: string, format: date-time, nullable: true, description: When a push to it was last accepted.}
        lastFailureAt: {type: string, format: date-time, nullable: true, description: When a push to it last failed.}
        lastError: {type: string, nullable: true, description: That failure's error.}
        deviceKeyId: {type: string, format: uuid, nullable: true, description: 'The paired device''s key that subscribed it; revoking the key deletes it. None for a browser.'}
    PushSubscriptionList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/PushSubscription'}}
    PushTestRequest:
      type: object
      properties:
        subscriptionId: {type: string, format: uuid, description: Only this device; every device when left out.}
    PushTestOutcome:
      type: string
      description: sent = its push service accepted the test; removed = its push service says the subscription is gone (404 or 410), so the device was removed; failed = refused or unreachable (error says why).
      enum: [sent, removed, failed]
    PushTestDeviceResult:
      type: object
      required: [subscriptionId, deviceLabel, outcome, error]
      properties:
        subscriptionId: {type: string, format: uuid}
        deviceLabel: {type: string}
        outcome: {$ref: '#/components/schemas/PushTestOutcome'}
        error: {type: string, nullable: true}
    PushTestResult:
      type: object
      required: [results]
      properties:
        results: {type: array, items: {$ref: '#/components/schemas/PushTestDeviceResult'}}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string, description: 'Machine-readable code, such as bad_request, actor_required, not_found, or push_not_configured.'}
            message: {type: string}
        request_id: {type: string}
