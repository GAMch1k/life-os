openapi: 3.0.3
info:
  title: Life OS Inbox API
  version: 1.0.0
  license: {name: UNLICENSED, url: https://life-os.local/license}
servers: [{url: http://inbox:8080}]
paths:
  /v1/backlog:
    get:
      summary: Summarize unfinished Inbox work for status surfaces
      description: Counts and timestamps from durable Inbox state only. Pending means raw or processing; retrying means a pending item already has a failed or retryable attempt (the processor starts the next attempt right away, so the latest attempt is usually processing).
      operationId: getInboxBacklog
      security: []
      responses: {'200': {description: Backlog summary, content: {application/json: {schema: {$ref: '#/components/schemas/InboxBacklog'}}}}}
  /v1/inbox-items:
    get:
      summary: List captured inbox items
      operationId: listInboxItems
      security: []
      parameters: [{name: unresolved, in: query, schema: {type: boolean, default: true}}, {name: state, in: query, schema: {type: string, enum: [raw, processing, human_review, failed, resolved, discarded]}}, {name: due, in: query, description: 'Only items without a scheduled retry or whose nextRetryAt has passed (the processor''s eligible work).', schema: {type: boolean}}, {name: cursor, in: query, schema: {type: string}}, {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}]
      responses: {'200': {description: Inbox items, content: {application/json: {schema: {$ref: '#/components/schemas/InboxItemList'}}}}, '400': {description: Invalid request}}
    post:
      summary: Capture an inbox item
      operationId: createInboxItem
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateInboxItemRequest'}}}}
      responses: {'201': {description: Captured item, content: {application/json: {schema: {$ref: '#/components/schemas/InboxItem'}}}}, '400': {description: Invalid request}}
  /v1/inbox-items/{itemId}:
    get:
      summary: Get an inbox item
      operationId: getInboxItem
      security: []
      parameters: [{name: itemId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Inbox item, content: {application/json: {schema: {$ref: '#/components/schemas/InboxItem'}}}}, '400': {description: Invalid request}, '404': {description: Inbox item not found}}
  /v1/inbox-items/{itemId}/resolve:
    post:
      summary: Resolve an inbox item
      operationId: resolveInboxItem
      security: []
      parameters: [{name: itemId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Resolved item, content: {application/json: {schema: {$ref: '#/components/schemas/InboxItem'}}}}, '400': {description: Invalid request}, '404': {description: Inbox item not found}}
  /v1/inbox-items/{itemId}/discard:
    post:
      summary: Discard an inbox item
      operationId: discardInboxItem
      security: []
      parameters: [{name: itemId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Discarded item, content: {application/json: {schema: {$ref: '#/components/schemas/InboxItem'}}}}, '400': {description: Invalid request}, '404': {description: Inbox item not found}}
  /v1/inbox-items/{itemId}/human-review:
    post:
      summary: Move a processing attempt into Human Review
      operationId: createHumanReview
      security: []
      parameters: [{name: itemId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateHumanReviewRequest'}}}}
      responses: {'200': {description: Human Review item, content: {application/json: {schema: {$ref: '#/components/schemas/InboxItem'}}}}, '400': {description: Invalid request}, '404': {description: Inbox item or attempt not found}}
  /v1/inbox-items/{itemId}/human-review/resolve:
    post:
      summary: Select a retained Human Review candidate and resume processing
      operationId: resolveHumanReview
      security: []
      parameters: [{name: itemId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ResolveHumanReviewRequest'}}}}
      responses: {'200': {description: Queued Inbox item, content: {application/json: {schema: {$ref: '#/components/schemas/InboxItem'}}}}, '400': {description: Invalid review selection}, '404': {description: Human Review item not found}}
  /v1/inbox-items/{itemId}/processing-attempts:
    get:
      summary: List traceable AI processing attempts
      operationId: listProcessingAttempts
      security: []
      parameters: [{name: itemId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Attempts, content: {application/json: {schema: {$ref: '#/components/schemas/ProcessingAttemptList'}}}}, '404': {description: Inbox item not found}}
    post:
      summary: Start a traceable processing attempt
      operationId: createProcessingAttempt
      security: []
      parameters: [{name: itemId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateProcessingAttemptRequest'}}}}
      responses: {'201': {description: Attempt, content: {application/json: {schema: {$ref: '#/components/schemas/ProcessingAttempt'}}}}, '400': {description: Invalid request}, '404': {description: Inbox item not found}, '409': {description: Duplicate idempotency key}}
  /v1/inbox-items/{itemId}/processing-attempts/{attemptId}:
    patch:
      summary: Record the outcome of an Inbox processing attempt
      operationId: updateProcessingAttempt
      security: []
      parameters: [{name: itemId, in: path, required: true, schema: {type: string, format: uuid}}, {name: attemptId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateProcessingAttemptRequest'}}}}
      responses: {'200': {description: Updated attempt, content: {application/json: {schema: {$ref: '#/components/schemas/ProcessingAttempt'}}}}, '400': {description: Invalid request}, '404': {description: Inbox item or attempt not found}}
components:
  schemas:
    InboxItem: {type: object, required: [id, content, source, state, processingMetadata, correlationId, createdAt, updatedAt], properties: {id: {type: string, format: uuid}, content: {type: string}, correlationId: {type: string, description: 'Workflow correlation id for activity events: the upstream caller''s X-Correlation-ID, or the item id when the capture starts its own workflow.'}, source: {type: string, enum: [manual, web, voice, watch, email]}, sourceMetadata: {type: object, additionalProperties: true}, mediaReferences: {type: array, items: {type: string, format: uri}}, state: {type: string, enum: [raw, processing, human_review, failed, resolved, discarded], description: 'failed: automatic processing gave up; needs operator attention.'}, processingMetadata: {type: object, additionalProperties: true}, nextRetryAt: {type: string, format: date-time, nullable: true, description: 'When a raw item that failed may be retried.'}, retryReason: {type: string, nullable: true, description: 'Why the retry is scheduled at that time, for example usage_limited or backoff.'}, resolvedAt: {type: string, format: date-time, nullable: true}, createdAt: {type: string, format: date-time}, updatedAt: {type: string, format: date-time}}}
    CreateInboxItemRequest: {type: object, required: [content, source], properties: {content: {type: string}, source: {type: string, enum: [manual, web, voice, watch, email]}, sourceMetadata: {type: object, additionalProperties: true}, mediaReferences: {type: array, items: {type: string, format: uri}}, dedupeKey: {type: string, maxLength: 255}}}
    InboxBacklog: {type: object, required: [pendingCount, retryingCount, humanReviewCount], properties: {pendingCount: {type: integer, description: Items waiting for or in automatic processing}, retryingCount: {type: integer, description: Pending items that already failed at least once and are being retried}, humanReviewCount: {type: integer}, oldestPendingAt: {type: string, format: date-time, nullable: true}, lastFailureAt: {type: string, format: date-time, nullable: true, description: When the most recent failed or retryable attempt of a pending item was recorded}, lastFailureSummary: {type: string, nullable: true}, failedCount: {type: integer, description: Items that automatic processing gave up on (operator attention)}, nextRetryAt: {type: string, format: date-time, nullable: true, description: Earliest scheduled retry}, nextRetryReason: {type: string, nullable: true}}}
    InboxItemList: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/InboxItem'}}, nextCursor: {type: string, nullable: true}}}
    ProcessingAttempt: {type: object, required: [id, status, agentName, modelProfile, actions, createdAt], properties: {id: {type: string, format: uuid}, status: {type: string, enum: [pending, processing, human_review, processed, failed, retryable]}, agentName: {type: string}, modelProfile: {type: string}, idempotencyKey: {type: string}, actions: {type: array, items: {type: object, additionalProperties: true}}, errorSummary: {type: string, nullable: true}, nextRetryAt: {type: string, format: date-time, nullable: true}, startedAt: {type: string, format: date-time, nullable: true}, completedAt: {type: string, format: date-time, nullable: true}, createdAt: {type: string, format: date-time}}}
    ProcessingAttemptList: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/ProcessingAttempt'}}}}
    CreateProcessingAttemptRequest: {type: object, required: [idempotencyKey, agentName, modelProfile], properties: {idempotencyKey: {type: string}, agentName: {type: string}, modelProfile: {type: string}}}
    UpdateProcessingAttemptRequest: {type: object, required: [status, actions], properties: {status: {type: string, enum: [processing, human_review, processed, failed, retryable], description: 'retryable returns the item to raw, eligible at nextRetryAt (immediately when absent); failed takes it out of automatic processing.'}, actions: {type: array, items: {type: object, additionalProperties: true}}, errorSummary: {type: string, nullable: true}, nextRetryAt: {type: string, format: date-time, nullable: true, description: 'Only with status retryable.'}, retryReason: {type: string, nullable: true, maxLength: 64}}}
    CreateHumanReviewRequest: {type: object, required: [attemptId, proposedAction, candidates, errorSummary], properties: {attemptId: {type: string, format: uuid}, proposedAction: {type: object, additionalProperties: true}, candidates: {type: array, items: {type: object, additionalProperties: true}}, errorSummary: {type: string}}}
    ResolveHumanReviewRequest: {type: object, required: [candidateId], properties: {candidateId: {type: string, format: uuid}}}
