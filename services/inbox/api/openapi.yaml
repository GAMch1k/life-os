openapi: 3.0.3
info:
  title: Life OS Inbox API
  version: 1.0.0
  description: >-
    Every write (POST, PUT, PATCH, DELETE) must say who makes it in the
    X-Life-OS-Actor header: `user` (the owner), `agent:<name>` (the Life OS
    AI), `system:<name>` (a Life OS component), or `dev:<name>` (a development
    tool or agent working on Life OS, such as Claude Code). Names are 1-64
    letters, digits, '.', '_', or '-'. A write without a valid actor is
    rejected with 400 and error code `actor_required`; nothing is attributed to
    the owner by default. Reads do not need the header. The public gateway
    passes only `user` and `dev:<name>`.
  license: {name: UNLICENSED, url: https://life-os.local/license}
servers: [{url: http://inbox:8080}]
paths:
  /v1/backlog:
    get:
      summary: Summarize unfinished Inbox work for status surfaces
      description: Counts and timestamps from durable Inbox state only. Pending means raw or processing; retrying means a pending item already has a failed or retryable attempt (the processor starts the next attempt right away, so the latest attempt is usually processing).
      operationId: getInboxBacklog
      security: []
      responses: {'200': {description: Backlog summary, content: {application/json: {schema: {$ref: '#/components/schemas/InboxBacklog'}}}}}
  /v1/inbox-items:
    get:
      summary: List captured inbox items
      operationId: listInboxItems
      security: []
      parameters: [{name: unresolved, in: query, schema: {type: boolean, default: true}}, {name: state, in: query, schema: {type: string, enum: [raw, processing, human_review, failed, resolved, discarded]}}, {name: due, in: query, description: 'Only items without a scheduled retry or whose nextRetryAt has passed (the processor''s eligible work).', schema: {type: boolean}}, {name: order, in: query, description: 'newest (the default) lists the latest captures first; oldest lists the earliest first, so the processor plans a backlog in the order it was captured.', schema: {type: string, enum: [newest, oldest], default: newest}}, {name: cursor, in: query, schema: {type: string}}, {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}]
      responses: {'200': {description: Inbox items, content: {application/json: {schema: {$ref: '#/components/schemas/InboxItemList'}}}}, '400': {description: Invalid request}}
    post:
      summary: Capture an inbox item
      operationId: createInboxItem
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateInboxItemRequest'}}}}
      responses: {'201': {description: Captured item, content: {application/json: {schema: {$ref: '#/components/schemas/InboxItem'}}}}, '400': {description: 'Invalid request, or no valid X-Life-OS-Actor (actor_required)'}}
  /v1/inbox-items/{itemId}:
    get:
      summary: Get an inbox item
      operationId: getInboxItem
      security: []
      parameters: [{name: itemId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Inbox item, content: {application/json: {schema: {$ref: '#/components/schemas/InboxItem'}}}}, '400': {description: Invalid request}, '404': {description: Inbox item not found}}
  /v1/inbox-items/{itemId}/resolve:
    post:
      summary: Resolve an inbox item
      operationId: resolveInboxItem
      security: []
      parameters: [{name: itemId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Resolved item, content: {application/json: {schema: {$ref: '#/components/schemas/InboxItem'}}}}, '400': {description: 'Invalid request, or no valid X-Life-OS-Actor (actor_required)'}, '404': {description: Inbox item not found}}
  /v1/inbox-items/{itemId}/discard:
    post:
      summary: Discard an inbox item
      operationId: discardInboxItem
      security: []
      parameters: [{name: itemId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Discarded item, content: {application/json: {schema: {$ref: '#/components/schemas/InboxItem'}}}}, '400': {description: 'Invalid request, or no valid X-Life-OS-Actor (actor_required)'}, '404': {description: Inbox item not found}}
  /v1/inbox-items/{itemId}/human-review:
    post:
      summary: Move a processing attempt into Human Review
      operationId: createHumanReview
      security: []
      parameters: [{name: itemId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateHumanReviewRequest'}}}}
      responses: {'200': {description: Human Review item, content: {application/json: {schema: {$ref: '#/components/schemas/InboxItem'}}}}, '400': {description: 'Invalid request, or no valid X-Life-OS-Actor (actor_required)'}, '404': {description: Inbox item or attempt not found}}
  /v1/inbox-items/{itemId}/human-review/resolve:
    post:
      summary: Select a retained Human Review candidate and resume processing
      operationId: resolveHumanReview
      security: []
      parameters: [{name: itemId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ResolveHumanReviewRequest'}}}}
      responses: {'200': {description: Queued Inbox item, content: {application/json: {schema: {$ref: '#/components/schemas/InboxItem'}}}}, '400': {description: 'Invalid review selection, or no valid X-Life-OS-Actor (actor_required)'}, '404': {description: Human Review item not found}}
  /v1/inbox-items/{itemId}/processing-attempts:
    get:
      summary: List traceable AI processing attempts
      operationId: listProcessingAttempts
      security: []
      parameters: [{name: itemId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Attempts, content: {application/json: {schema: {$ref: '#/components/schemas/ProcessingAttemptList'}}}}, '404': {description: Inbox item not found}}
    post:
      summary: Start a traceable processing attempt
      operationId: createProcessingAttempt
      security: []
      parameters: [{name: itemId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateProcessingAttemptRequest'}}}}
      responses: {'201': {description: Attempt, content: {application/json: {schema: {$ref: '#/components/schemas/ProcessingAttempt'}}}}, '400': {description: 'Invalid request, or no valid X-Life-OS-Actor (actor_required)'}, '404': {description: Inbox item not found}, '409': {description: Duplicate idempotency key}}
  /v1/inbox-items/{itemId}/processing-attempts/{attemptId}:
    patch:
      summary: Record the outcome of an Inbox processing attempt
      operationId: updateProcessingAttempt
      security: []
      parameters: [{name: itemId, in: path, required: true, schema: {type: string, format: uuid}}, {name: attemptId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateProcessingAttemptRequest'}}}}
      responses: {'200': {description: Updated attempt, content: {application/json: {schema: {$ref: '#/components/schemas/ProcessingAttempt'}}}}, '400': {description: 'Invalid request, or no valid X-Life-OS-Actor (actor_required)'}, '404': {description: Inbox item or attempt not found}}
  /v1/inbox-items/{itemId}/processing-attempts/{attemptId}/runtime:
    put:
      summary: Record the runtime state of an unfinished processing attempt
      description: Called by the processor before spawning the agent and while it runs; each call refreshes the heartbeat. A finished attempt cannot change its runtime (409).
      operationId: recordAttemptRuntime
      security: []
      parameters: [{name: itemId, in: path, required: true, schema: {type: string, format: uuid}}, {name: attemptId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AttemptRuntimeRequest'}}}}
      responses: {'200': {description: Updated attempt, content: {application/json: {schema: {$ref: '#/components/schemas/ProcessingAttempt'}}}}, '400': {description: 'Invalid request, or no valid X-Life-OS-Actor (actor_required)'}, '404': {description: Attempt not found}, '409': {description: Attempt already finished}}
  /v1/media:
    post:
      summary: Upload images for a capture
      description: >-
        Stores one to five images (JPEG, PNG, or WebP, recognized from their
        bytes; each at most INBOX_MEDIA_MAX_BYTES, 10 MiB by default) and
        returns their media references, in upload order, for a capture's
        mediaReferences. The same bytes uploaded again return the same
        reference and are stored once. HEIC photos are refused
        (heic_not_supported). Media a capture refers to is kept as long as the
        capture; an upload no capture refers to is removed after a day.
      operationId: uploadMedia
      security: []
      requestBody: {required: true, content: {multipart/form-data: {schema: {type: object, required: [images], properties: {images: {type: array, minItems: 1, maxItems: 5, items: {type: string, format: binary}}}}}}}
      responses:
        '201': {description: Stored images, content: {application/json: {schema: {$ref: '#/components/schemas/MediaList'}}}}
        '400': {description: 'No image (images_required), more than five (too_many_images), not a JPEG, PNG, or WebP image (unsupported_image), a HEIC photo (heic_not_supported), or no valid X-Life-OS-Actor (actor_required)'}
        '413': {description: An image exceeds the size limit (image_too_large)}
  /v1/media/{sha256}:
    get:
      summary: Get a capture image
      description: The image's bytes with its content type. Content-addressed, so a response never changes and may be cached privately.
      operationId: getMedia
      security: []
      parameters: [{name: sha256, in: path, required: true, description: 'The image''s SHA-256 (lowercase hex), from its inbox-media reference.', schema: {type: string, pattern: '^[0-9a-f]{64}$'}}]
      responses:
        '200': {description: The image, content: {image/jpeg: {schema: {type: string, format: binary}}, image/png: {schema: {type: string, format: binary}}, image/webp: {schema: {type: string, format: binary}}}}
        '400': {description: Not a SHA-256}
        '404': {description: Media not found}
  /v1/stale-processing-attempts:
    get:
      summary: List unfinished attempts whose runtime stopped reporting
      description: Pending or processing attempts of captures still in raw or processing whose heartbeat (or last update, for attempts without runtime tracking) is older than staleAfterSeconds, oldest first. The processor reconciles them after a crash or restart.
      operationId: listStaleProcessingAttempts
      security: []
      parameters: [{name: staleAfterSeconds, in: query, required: true, schema: {type: integer, minimum: 30, maximum: 86400}}]
      responses: {'200': {description: Stale attempts, content: {application/json: {schema: {$ref: '#/components/schemas/ProcessingAttemptList'}}}}, '400': {description: Invalid request}}
  /v1/recent-captures:
    get:
      summary: List the captures made shortly before one capture, with what processing did
      description: >-
        The processor's context for a follow-up capture ("actually oat milk"
        after "buy milk"): the owner's other captures, from every source,
        made in the `minutes` before the capture `before` was made (not that
        capture itself), newest first. Only captures processing has settled
        are listed: resolved, waiting for Human Review, or failed; raw,
        processing, and discarded captures are left out. Each carries its
        latest finished processing attempt (`outcome`): its status, error
        summary, and recorded actions, which name what was created or changed
        (the action's tool, arguments, and the owning service's result).
        `unfinished` lists, oldest first and at most `limit`, the captures of
        the same window that processing has not finished yet (raw, including
        those waiting for a retry, or processing): the processor plans a
        capture only after them, for a bounded time.
      operationId: listRecentCaptures
      security: []
      parameters:
        - {name: before, in: query, required: true, description: The capture whose predecessors to list., schema: {type: string, format: uuid}}
        - {name: minutes, in: query, description: How far back from that capture's creation to look., schema: {type: integer, minimum: 1, maximum: 120, default: 20}}
        - {name: limit, in: query, description: The most captures to list (the latest ones)., schema: {type: integer, minimum: 1, maximum: 50, default: 10}}
      responses:
        '200': {description: Recent captures, content: {application/json: {schema: {$ref: '#/components/schemas/RecentCaptureList'}}}}
        '400': {description: Invalid request}
        '404': {description: Inbox item not found}
components:
  schemas:
    InboxItem: {type: object, required: [id, content, source, state, processingMetadata, correlationId, createdAt, updatedAt], properties: {id: {type: string, format: uuid}, content: {type: string}, correlationId: {type: string, description: 'Workflow correlation id for activity events: the upstream caller''s X-Correlation-ID, or the item id when the capture starts its own workflow.'}, source: {type: string, enum: [manual, web, voice, watch, email]}, sourceMetadata: {type: object, additionalProperties: true}, mediaReferences: {type: array, description: 'The capture''s images, as inbox-media:<sha256> references (GET /v1/media/{sha256}).', items: {type: string, format: uri}}, state: {type: string, enum: [raw, processing, human_review, failed, resolved, discarded], description: 'failed: automatic processing gave up; needs operator attention.'}, processingMetadata: {type: object, additionalProperties: true}, nextRetryAt: {type: string, format: date-time, nullable: true, description: 'When a raw item that failed may be retried.'}, retryReason: {type: string, nullable: true, description: 'Why the retry is scheduled at that time, for example usage_limited or backoff.'}, resolvedAt: {type: string, format: date-time, nullable: true}, createdAt: {type: string, format: date-time}, updatedAt: {type: string, format: date-time}}}
    CreateInboxItemRequest: {type: object, required: [content, source], properties: {content: {type: string}, source: {type: string, enum: [manual, web, voice, watch, email]}, sourceMetadata: {type: object, additionalProperties: true}, mediaReferences: {type: array, maxItems: 5, description: 'Images uploaded with POST /v1/media, by the references it returned (400 invalid_media_reference or unknown_media otherwise).', items: {type: string, format: uri, pattern: '^inbox-media:[0-9a-f]{64}$'}}, dedupeKey: {type: string, maxLength: 255}}}
    Media: {type: object, required: [reference, sha256, contentType, byteSize], properties: {reference: {type: string, format: uri, description: 'inbox-media:<sha256>, for a capture''s mediaReferences.'}, sha256: {type: string}, contentType: {type: string, enum: [image/jpeg, image/png, image/webp]}, byteSize: {type: integer, format: int64}}}
    MediaList: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/Media'}}}}
    InboxBacklog: {type: object, required: [pendingCount, retryingCount, humanReviewCount], properties: {pendingCount: {type: integer, description: Items waiting for or in automatic processing}, retryingCount: {type: integer, description: Pending items that already failed at least once and are being retried}, humanReviewCount: {type: integer}, oldestPendingAt: {type: string, format: date-time, nullable: true}, lastFailureAt: {type: string, format: date-time, nullable: true, description: When the most recent failed or retryable attempt of a pending item was recorded}, lastFailureSummary: {type: string, nullable: true}, failedCount: {type: integer, description: Items that automatic processing gave up on (operator attention)}, nextRetryAt: {type: string, format: date-time, nullable: true, description: Earliest scheduled retry}, nextRetryReason: {type: string, nullable: true}}}
    InboxItemList: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/InboxItem'}}, nextCursor: {type: string, nullable: true}}}
    ProcessingAttempt: {type: object, required: [id, inboxItemId, status, agentName, modelProfile, actions, createdAt], properties: {id: {type: string, format: uuid}, inboxItemId: {type: string, format: uuid}, runtimeState: {type: string, nullable: true, enum: [spawning, running, completed, failed, timed_out, cancelled]}, runtimeOwner: {type: string, nullable: true}, runtimeSessionId: {type: string, nullable: true, description: Agent session id (Codex thread id) when the runtime reports one}, runtimeHeartbeatAt: {type: string, format: date-time, nullable: true}, status: {type: string, enum: [pending, processing, human_review, processed, failed, retryable]}, agentName: {type: string}, modelProfile: {type: string}, idempotencyKey: {type: string}, actions: {type: array, items: {type: object, additionalProperties: true}}, errorSummary: {type: string, nullable: true}, nextRetryAt: {type: string, format: date-time, nullable: true}, startedAt: {type: string, format: date-time, nullable: true}, completedAt: {type: string, format: date-time, nullable: true}, createdAt: {type: string, format: date-time}}}
    ProcessingAttemptList: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/ProcessingAttempt'}}}}
    CreateProcessingAttemptRequest: {type: object, required: [idempotencyKey, agentName, modelProfile], properties: {idempotencyKey: {type: string}, agentName: {type: string}, modelProfile: {type: string}}}
    AttemptRuntimeRequest: {type: object, required: [state, owner], properties: {state: {type: string, enum: [spawning, running, completed, failed, timed_out, cancelled]}, owner: {type: string, minLength: 1, maxLength: 200, description: Processor instance running the attempt}, sessionId: {type: string, maxLength: 200}}}
    UpdateProcessingAttemptRequest: {type: object, required: [status, actions], properties: {status: {type: string, enum: [processing, human_review, processed, failed, retryable], description: 'retryable returns the item to raw, eligible at nextRetryAt (immediately when absent); failed takes it out of automatic processing.'}, actions: {type: array, description: 'The attempt''s actions. In a processed attempt, an action that changed what an earlier capture created may name that capture as followsUp.inboxItemId (with entity and entityId); Inbox then records inbox.item.followed_up about the earlier capture, once per capture.', items: {type: object, additionalProperties: true}}, errorSummary: {type: string, nullable: true}, nextRetryAt: {type: string, format: date-time, nullable: true, description: 'Only with status retryable.'}, retryReason: {type: string, nullable: true, maxLength: 64}}}
    CreateHumanReviewRequest: {type: object, required: [attemptId, proposedAction, candidates, errorSummary], properties: {attemptId: {type: string, format: uuid}, proposedAction: {type: object, additionalProperties: true}, candidates: {type: array, items: {type: object, additionalProperties: true}}, errorSummary: {type: string}}}
    ResolveHumanReviewRequest: {type: object, required: [candidateId], properties: {candidateId: {type: string, format: uuid}}}
    RecentCapture: {type: object, required: [id, content, source, state, correlationId, createdAt], properties: {id: {type: string, format: uuid}, content: {type: string}, source: {type: string, enum: [manual, web, voice, watch, email]}, state: {type: string, enum: [resolved, human_review, failed]}, correlationId: {type: string, description: 'The capture''s workflow correlation id (see InboxItem.correlationId).'}, createdAt: {type: string, format: date-time}, resolvedAt: {type: string, format: date-time, nullable: true}, outcome: {$ref: '#/components/schemas/RecentCaptureOutcome'}}}
    RecentCaptureOutcome: {type: object, description: 'The capture''s latest finished processing attempt; absent when it has none (for example, resolved by hand).', required: [attemptId, status, actions], properties: {attemptId: {type: string, format: uuid}, status: {type: string, enum: [processed, human_review, failed]}, errorSummary: {type: string, nullable: true}, completedAt: {type: string, format: date-time, nullable: true}, actions: {type: array, description: 'The actions the attempt recorded, as the processor recorded them (tool, arguments, result).', items: {type: object, additionalProperties: true}}}}
    RecentCaptureList: {type: object, required: [items, unfinished], properties: {items: {type: array, items: {$ref: '#/components/schemas/RecentCapture'}}, unfinished: {type: array, description: 'The captures of the window that processing has not finished yet, oldest first.', items: {$ref: '#/components/schemas/UnfinishedCapture'}}}}
    UnfinishedCapture: {type: object, description: 'A capture made shortly before another one that processing has not finished yet.', required: [id, content, source, state, createdAt, updatedAt], properties: {id: {type: string, format: uuid}, content: {type: string}, source: {type: string, enum: [manual, web, voice, watch, email]}, state: {type: string, enum: [raw, processing], description: 'raw: waiting for processing, or for a retry (nextRetryAt); processing: an attempt is running.'}, createdAt: {type: string, format: date-time}, updatedAt: {type: string, format: date-time}, nextRetryAt: {type: string, format: date-time, nullable: true, description: 'When a raw capture that failed may be retried.'}}}
