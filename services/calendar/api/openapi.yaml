openapi: 3.0.3
info:
  title: Life OS Calendar API
  version: 1.0.0
  description: >-
    Every write (POST, PUT, PATCH, DELETE) must say who makes it in the
    X-Life-OS-Actor header: `user` (the owner), `agent:<name>` (the Life OS
    AI), `system:<name>` (a Life OS component), or `dev:<name>` (a development
    tool or agent working on Life OS, such as Claude Code). Names are 1-64
    letters, digits, '.', '_', or '-'. A write without a valid actor is
    rejected with 400 and error code `actor_required`; nothing is attributed to
    the owner by default. Reads do not need the header. The public gateway
    passes only `user` and `dev:<name>`.


    Timed events are instants: `startAt`/`endAt` are RFC 3339 date-times,
    stored and returned in UTC. All-day events are local dates:
    `startDate`/`endDate` (inclusive) carry no timezone and mean those days in
    the owner's timezone. Reads that compare all-day events with instants take
    a `timeZone` (an IANA name such as Europe/Berlin) and default to the
    owner's timezone configured for Calendar (LIFE_OS_TIMEZONE, else UTC).


    Calendar sources are the calendars whose events Calendar holds for an
    integration: the ICS feeds of the calendar-feeds service (ZAW among
    them) and the owner's Google calendars chosen to sync in the
    google-calendar service. Feed events are read-only through this API
    except for their reminders and priority; only their feed changes,
    cancels, or restores them, through calendar-feeds' syncs. An
    integration's events are editable here when their source accepts
    changes (and the event is not read-only on its own): the change is
    stored here and the integration writes it to its provider through the
    change feed, asynchronously; the provider's own later version wins a
    conflict. `editable` and `readOnlyReason` say what an event allows.
    Integrations also follow the events created in Life OS (such as the
    google-calendar integration exporting them to a "Life OS" calendar in
    Google).


    Reminders work like Google Calendar's notifications. Every event can
    follow its calendar's default reminders (`useDefaultReminders`) and add
    any number of its own (`reminders`, at most 10); `effectiveReminders` is
    every reminder that applies. An imported event's defaults are its
    source's `defaultReminders`; an event created in Life OS uses the owner's
    defaults from Calendar settings, one list for timed and one for all-day
    events. Calendar sends every effective reminder to the Notifications
    service when it is due (health: `GET /v1/reminders/status`).


    Every event has a `priority`, `low`, `medium`, or `high`: how important
    it is, and so the importance of its reminder notifications. An event
    without a priority of its own has its `defaultPriority`: its source's
    `defaultPriority` for an imported event, `medium` for an event created in
    Life OS. Setting an event's priority to its default makes it follow the
    default again, so an imported event follows later changes of its
    source's default unless the owner gave it another priority (refreshes
    keep that). An occurrence of a recurring event can have its own priority
    (This event).


    Recurring events work like Google Calendar's. A recurring event (a
    series) is stored once with its `recurrence` rule and listed as its
    occurrences, each identified by `occurrence.recurrenceId` (its original
    start). Changes have three scopes: **This event**
    (`PATCH /v1/events/{eventId}/occurrences/{recurrenceId}`: one
    occurrence's own changes, or `status: cancelled` to skip it), **This and
    following** (`POST .../split` to change, `POST .../truncate` to delete:
    the series ends before that occurrence), and **All events**
    (`PATCH`/`DELETE /v1/events/{eventId}`). Events created in Life OS
    (`source.kind` `manual`) recur this way, and so does an integration's
    recurring event whose rule fits this model (changed through the same
    scopes when its source accepts changes); an imported feed's recurring
    events, like an integration's rules outside the model, are stored one
    read-only event per occurrence.


    Integrations (P11-06) are separate services that give Calendar the
    events of their sources, and follow the events changed in Life OS, only
    through this API (`/v1/integrations/...`, actor `system:<integration>`);
    Calendar names no provider. They register their sources, sync each
    source's events in snapshots or deltas (`source.kind` `external`), and
    read the change feed of Life OS events and of the events of their
    sources that accept changes. See
    docs/services/calendar-integration-api.md.
  license: {name: UNLICENSED, url: https://life-os.local/license}
servers: [{url: http://calendar:8080}]
paths:
  /v1/events:
    get:
      summary: List calendar events in a time range
      description: >-
        Events that overlap `[from, to)`, soonest start first (an all-day
        event starts at midnight of its first day in `timeZone`; ties by id).
        A timed event overlaps when it starts before `to` and ends after
        `from`; an all-day event when its days, taken in `timeZone`, do.
        Cancelled events are left out unless `includeCancelled` is true. When
        more events match than `limit`, `nextCursor` is set: pass it back as
        `cursor`, with the same parameters, for the next page. A response
        without `nextCursor` is the last page. A recurring event is expanded:
        each occurrence that overlaps the range is listed in its place in the
        order, with the recurring event's `id` and fields but its own start
        and end, and `occurrence` set. An occurrence's own changes (This
        event) apply: a moved occurrence is listed at its new time (also when
        it moved into the range from outside it, and not when it moved out),
        an edited one with its own fields, both with `occurrence.modified`
        true; a skipped (cancelled) occurrence is left out unless
        `includeCancelled` is true, then listed with `status: cancelled` and
        `cancelledAt`. Non-recurring events are returned as stored.
      operationId: listEvents
      security: []
      parameters:
        - {name: from, in: query, required: true, description: Start of the range (inclusive)., schema: {type: string, format: date-time}}
        - {name: to, in: query, required: true, description: End of the range (exclusive); must be after from., schema: {type: string, format: date-time}}
        - $ref: '#/components/parameters/TimeZone'
        - $ref: '#/components/parameters/IncludeCancelled'
        - $ref: '#/components/parameters/SourceKind'
        - $ref: '#/components/parameters/SourceId'
        - $ref: '#/components/parameters/Editable'
        - $ref: '#/components/parameters/Cursor'
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200': {description: Events, content: {application/json: {schema: {$ref: '#/components/schemas/EventList'}}}}
        '400': {description: 'Invalid request, such as a range whose to is not after from, an unknown timeZone, or a malformed cursor'}
    post:
      summary: Create a calendar event
      description: >-
        Creates an active event whose source is `manual`. Imported events
        are written by Calendar's feed adapter or by integrations through
        `/v1/integrations`, not through this endpoint. An `Idempotency-Key` header makes the request
        safe to retry: an identical repeat returns the original event, and
        reusing the key with a different body returns 409.
      operationId: createEvent
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateEventRequest'}}}}
      responses:
        '201': {description: Event, content: {application/json: {schema: {$ref: '#/components/schemas/CalendarEvent'}}}}
        '400': {description: 'Invalid request, or no valid X-Life-OS-Actor (actor_required)'}
        '409': {description: The Idempotency-Key was already used with a different body}
  /v1/events/search:
    get:
      summary: Search calendar events
      description: >-
        Finds events whose title, description (notes), or location contain
        every word of `q` (case-insensitive substring match), across all
        dates unless `from`/`to` narrow the range (the same overlap rule as
        listing; either bound may be left open). The most relevant come first:
        a word found in the title weighs 3, in the location 2, in the
        description 1. Among equally relevant events, those not over yet come
        first, soonest first, then past events, most recent first. Cancelled
        events are left out unless `includeCancelled` is true. Paging works as
        for listing; the cursor also keeps the moment that splits upcoming
        from past, so later pages stay consistent. A matching recurring event
        is returned as occurrences (with `occurrence` set, as in listing):
        every occurrence in the range when both `from` and `to` are given,
        otherwise one, its next occurrence not over yet, or its last one if
        it has ended. Occurrences carry their own changes as in listing; a
        skipped occurrence is passed over (the next one represents the series)
        unless `includeCancelled` is true. Words are matched against the
        series' title, location, and description, not against one
        occurrence's own changes to them.
      operationId: searchEvents
      security: []
      parameters:
        - {name: q, in: query, required: true, description: 'Words to find, separated by spaces; at most 10 words.', schema: {type: string, minLength: 1, maxLength: 200}}
        - {name: from, in: query, description: Only events that end after this instant., schema: {type: string, format: date-time}}
        - {name: to, in: query, description: Only events that start before this instant., schema: {type: string, format: date-time}}
        - $ref: '#/components/parameters/TimeZone'
        - $ref: '#/components/parameters/IncludeCancelled'
        - $ref: '#/components/parameters/SourceKind'
        - $ref: '#/components/parameters/SourceId'
        - $ref: '#/components/parameters/Editable'
        - $ref: '#/components/parameters/Cursor'
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200': {description: Matching events, content: {application/json: {schema: {$ref: '#/components/schemas/EventList'}}}}
        '400': {description: 'Invalid request, such as an empty q, an unknown timeZone, or a malformed cursor'}
  /v1/events/{eventId}:
    get:
      summary: Get a calendar event
      description: Returns the event whatever its status, so cancelled events stay reachable as history.
      operationId: getEvent
      security: []
      parameters: [{name: eventId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Event, content: {application/json: {schema: {$ref: '#/components/schemas/CalendarEvent'}}}}
        '400': {description: Invalid request}
        '404': {description: Event not found}
    patch:
      summary: Update a calendar event
      description: >-
        Changes only the fields present in the body; a field set to null is
        cleared. Changing `allDay` switches the event between timed and
        all-day: the other kind's fields (`startAt`, `endAt`, `timeZone` or
        `startDate`, `endDate`) are cleared and the new kind's start and end
        must be given. The result is validated as a whole, as on create.
        `status: cancelled` keeps the event as history and drops it from
        listings; `status: active` restores it. An event imported from a
        feed (`source.kind` `ics`), or an integration's event that is not
        `editable` (its source does not accept changes, or it is read-only on
        its own, such as one occurrence of a rule Calendar cannot hold), is
        read-only except for `reminders`, `useDefaultReminders`, and
        `priority`: naming any other field returns 409 `managed_by_source`
        (with the reason). An editable integration event is changed here and
        its integration writes the change to its provider through the change
        feed. For a recurring event this is **All events**:
        every occurrence changes. Occurrences keep their own changes, except
        that a change of the start, the kind (`allDay`), `timeZone`, or the
        `recurrence` rule removes the changes and skips of occurrences that no
        longer exist (an occurrence exists while the series still has an
        occurrence with the same original start, its `recurrenceId`).
      operationId: updateEvent
      security: []
      parameters: [{name: eventId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateEventRequest'}}}}
      responses:
        '200': {description: Event, content: {application/json: {schema: {$ref: '#/components/schemas/CalendarEvent'}}}}
        '400': {description: 'Invalid request, or no valid X-Life-OS-Actor (actor_required)'}
        '404': {description: Event not found}
        '409': {description: 'The event kept changing concurrently (retry the update), or it is imported and the update names more than its reminders and priority (managed_by_source)'}
    delete:
      summary: Delete a calendar event
      description: 'Removes the event permanently; for a recurring event every occurrence and its own changes (**All events**). Set `status: cancelled` instead to keep it as history. Feed events and read-only integration events cannot be deleted (409 `managed_by_source`). Integrations follow the deletion through the change feed (deleting the event at the provider, or a Life OS event''s copy).'
      operationId: deleteEvent
      security: []
      parameters: [{name: eventId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '204': {description: Event deleted}
        '400': {description: 'Invalid request, or no valid X-Life-OS-Actor (actor_required)'}
        '404': {description: Event not found}
        '409': {description: 'The event is imported and read-only here (managed_by_source)'}
  /v1/events/{eventId}/occurrences/{recurrenceId}:
    get:
      summary: Get one occurrence of a recurring event
      description: >-
        The occurrence as listing returns it, with its own changes applied
        and `occurrence` set, whatever its status (a skipped occurrence has
        `status: cancelled`). 404 when the event does not repeat (`this event
        does not repeat`) or `recurrenceId` is not one of its occurrences
        (`occurrence not found`).
      operationId: getEventOccurrence
      security: []
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/RecurrenceId'
      responses:
        '200': {description: Occurrence, content: {application/json: {schema: {$ref: '#/components/schemas/CalendarEvent'}}}}
        '400': {description: Invalid request}
        '404': {description: 'Event not found (`event not found`), it does not repeat (`this event does not repeat`), or no such occurrence (`occurrence not found`)'}
    patch:
      summary: Change one occurrence of a recurring event (This event)
      description: >-
        **This event**: changes only this occurrence; the series and its
        other occurrences stay. Only the fields present change, as for
        updating an event; `description` or `location` set to null is cleared
        for this occurrence only. A new start and end keep the series' kind:
        `startAt`/`endAt` for a timed series, `startDate`/`endDate` for an
        all-day one; `allDay` other than the series' returns 400 (`an
        occurrence cannot switch between timed and all-day; change all events
        instead`), and so do `recurrence` (`recurrence belongs to the series:
        change all events, or this and following`) and `timeZone` (`timeZone
        belongs to the series: change all events, or this and following`).
        Other errors are those of updating an event, such as `endAt must be
        after startAt`. `status: cancelled` skips the occurrence (kept as history, left
        out of listings); `status: active` brings it back. A field set back to
        the series' value stops being this occurrence's own change. Returns
        the occurrence. A read-only imported event returns 409
        `managed_by_source`; an editable integration series is changed here
        and its integration writes the change to the provider's occurrence
        through the change feed.
      operationId: updateEventOccurrence
      security: []
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/RecurrenceId'
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateOccurrenceRequest'}}}}
      responses:
        '200': {description: The occurrence, content: {application/json: {schema: {$ref: '#/components/schemas/CalendarEvent'}}}}
        '400': {description: 'Invalid request (the message says what to fix), or no valid X-Life-OS-Actor (actor_required)'}
        '404': {description: 'Event not found, it does not repeat, or no such occurrence'}
        '409': {description: 'The event is imported and read-only here (managed_by_source)'}
  /v1/events/{eventId}/occurrences/{recurrenceId}/split:
    post:
      summary: Change this and following occurrences
      description: >-
        **This and following**: the series ends with the occurrence before
        this one (its `recurrence` gets `until` at that occurrence's start and
        loses `count`), and a new series (a new event id) starts at this
        occurrence with the body's changes, applied as for updating an event.
        Without a `recurrence` in the body the new series repeats like the old
        one (`recurrence: null` makes it a single event); a `count` rule is
        shared out: the old series keeps the
        occurrences before, the new one the remaining count. Times in the
        body are the new series' start and end; leave them out to start it at
        this occurrence's original time. Occurrence changes and skips from
        this occurrence on move to the new series when their occurrence still
        exists there (the same original start: no change of time, kind, time
        zone, or rule), otherwise they are dropped; the fields the body sets
        replace this occurrence's own changes to them. Returns the new series
        (201). On the series' first occurrence nothing is split: the body
        changes the series itself, as `PATCH /v1/events/{eventId}`, and the
        series is returned (200). A read-only imported event returns 409
        `managed_by_source`. For an editable integration series the new
        series belongs to the same source under the external uid
        `lifeos:<id>` until the integration has created it at the provider
        and re-keys it (`previousExternalUid`).
      operationId: splitEventSeries
      security: []
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/RecurrenceId'
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateEventRequest'}}}}
      responses:
        '200': {description: 'The occurrence is the first one: the series, changed', content: {application/json: {schema: {$ref: '#/components/schemas/CalendarEvent'}}}}
        '201': {description: The new series, content: {application/json: {schema: {$ref: '#/components/schemas/CalendarEvent'}}}}
        '400': {description: 'Invalid request (the message says what to fix), or no valid X-Life-OS-Actor (actor_required)'}
        '404': {description: 'Event not found, it does not repeat, or no such occurrence'}
        '409': {description: 'The event is imported and read-only here (managed_by_source), or it kept changing concurrently (retry)'}
  /v1/events/{eventId}/occurrences/{recurrenceId}/truncate:
    post:
      summary: Delete this and following occurrences
      description: >-
        **This and following**, deleted: the series ends with the occurrence
        before this one (its `recurrence` gets `until` at that occurrence's
        start and loses `count`), and the changes and skips of this and later
        occurrences are removed. On the series' first occurrence the whole
        series is deleted, as `DELETE /v1/events/{eventId}`. A read-only
        imported event returns 409 `managed_by_source`.
      operationId: truncateEventSeries
      security: []
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/RecurrenceId'
      responses:
        '204': {description: 'The series ends before this occurrence, or is deleted'}
        '400': {description: 'Invalid request, or no valid X-Life-OS-Actor (actor_required)'}
        '404': {description: 'Event not found, it does not repeat, or no such occurrence'}
        '409': {description: 'The event is imported and read-only here (managed_by_source)'}
  /v1/sources:
    get:
      summary: List calendar sources
      description: 'Every source an integration syncs (`kind` `external`: the ICS feeds of calendar-feeds, such as ZAW, and the Google calendars of google-calendar) and any feed Calendar still refreshed itself before the handover (`ics`), oldest first. The owner changes a source''s name, default reminders, default priority, and enabled here; its integration keeps its URL, filter, and refresh state (feeds: the calendar-feeds service, `/api/integrations/calendar-feeds/v1/feeds`; Google calendars: the google-calendar service), so those are not shown for an integration''s source. Feeds are added there, not here.'
      operationId: listSources
      security: []
      responses:
        '200': {description: Sources, content: {application/json: {schema: {$ref: '#/components/schemas/SourceList'}}}}
        '400': {description: Invalid request}
  /v1/sources/{sourceId}:
    get:
      summary: Get a calendar source
      operationId: getSource
      security: []
      parameters: [{name: sourceId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Source, content: {application/json: {schema: {$ref: '#/components/schemas/CalendarSource'}}}}
        '400': {description: Invalid request}
        '404': {description: Source not found}
    patch:
      summary: Update a calendar source
      description: >-
        Changes the owner's settings present in the body: `name`, `enabled`,
        `defaultReminders` (`null` removes them), and `defaultPriority`.
        Disabling a source stops its integration's syncs and keeps its
        events; enabling it lets the integration sync it again (calendar-feeds
        refreshes it within a minute). The URL and filter of a feed belong
        to its integration: naming `url` or `filter` here returns 409
        `managed_by_integration`.
      operationId: updateSource
      security: []
      parameters: [{name: sourceId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateSourceRequest'}}}}
      responses:
        '200': {description: Source, content: {application/json: {schema: {$ref: '#/components/schemas/CalendarSource'}}}}
        '400': {description: 'Invalid request, or no valid X-Life-OS-Actor (actor_required)'}
        '404': {description: Source not found}
        '409': {description: 'The source kept changing concurrently; retry the update (conflict). The update names url or filter, which belong to the integration that syncs the source (managed_by_integration).'}
    delete:
      summary: Delete a calendar source
      description: 'Removes the source and every event imported from it. Set `enabled: false` instead to stop syncing and keep its events. A feed is unsubscribed through calendar-feeds (which deletes its source here); a source deleted here takes its feed with it there.'
      operationId: deleteSource
      security: []
      parameters: [{name: sourceId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '204': {description: Source and its events deleted}
        '400': {description: 'Invalid request, or no valid X-Life-OS-Actor (actor_required)'}
        '404': {description: Source not found}
  /v1/settings:
    get:
      summary: Get the Calendar settings
      description: The owner's default reminders for the events they create in Life OS.
      operationId: getSettings
      security: []
      responses:
        '200': {description: Settings, content: {application/json: {schema: {$ref: '#/components/schemas/CalendarSettings'}}}}
        '400': {description: Invalid request}
    patch:
      summary: Update the Calendar settings
      description: >-
        Replaces the default reminder lists present in the body. Every Life OS
        event that uses its defaults follows the change; imported events keep
        their source's defaults.
      operationId: updateSettings
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateSettingsRequest'}}}}
      responses:
        '200': {description: Settings, content: {application/json: {schema: {$ref: '#/components/schemas/CalendarSettings'}}}}
        '400': {description: 'Invalid request, or no valid X-Life-OS-Actor (actor_required)'}
  # Reminder delivery (P12-04).
  /v1/reminders/status:
    get:
      summary: Get the reminder delivery health
      description: >-
        Whether Calendar sends reminders (it needs the Notifications service),
        how far it has handled them, and its last run, success, and error, for
        the Status page. Every effective reminder of every active event and
        occurrence is sent when due; one due while Calendar was down is sent
        late within the grace window and otherwise recorded in Activity as
        missed.
      operationId: getReminderStatus
      security: []
      responses:
        '200': {description: Reminder delivery health, content: {application/json: {schema: {$ref: '#/components/schemas/ReminderDeliveryStatus'}}}}
        '400': {description: Invalid request}
  # Integration API (P11-06).
  /v1/integrations/{integration}/sources:
    get:
      summary: List an integration's sources
      description: >-
        Every source registered for the integration, oldest first, including
        those Calendar's in-process adapter still syncs (`inProcess`). Only
        the integration itself (actor `system:<integration>`) or a dev tool
        (`dev:<name>`) may call it; any other actor, or none, gets 403
        `forbidden`.
      operationId: listIntegrationSources
      security: []
      parameters:
        - $ref: '#/components/parameters/Integration'
      responses:
        '200': {description: Sources, content: {application/json: {schema: {$ref: '#/components/schemas/IntegrationSourceList'}}}}
        '400': {description: An invalid integration name}
        '403': {description: 'The actor is not system:<integration> or dev:<name> (forbidden)'}
  /v1/integrations/{integration}/sources/{externalId}:
    get:
      summary: Get one of an integration's sources
      operationId: getIntegrationSource
      security: []
      parameters:
        - $ref: '#/components/parameters/Integration'
        - $ref: '#/components/parameters/ExternalSourceId'
      responses:
        '200': {description: Source, content: {application/json: {schema: {$ref: '#/components/schemas/IntegrationSource'}}}}
        '400': {description: An invalid integration name or external id}
        '403': {description: 'The actor is not system:<integration> or dev:<name> (forbidden)'}
        '404': {description: The integration has no source with this external id}
    put:
      summary: Register or update an integration's source
      description: >-
        Idempotent by (integration, externalId): the first call adds the
        source (201, enabled), later ones update it (200). `provider`
        and `readOnly` always take the request's values. `name`,
        `defaultReminders`, and `defaultPriority` are also the owner's
        settings (renamed in the Dashboard, for example): each changes only
        when the integration sends a value other than the one it last sent,
        so a Google calendar renamed in Google renames the source, while an
        owner's rename stays until the source itself is renamed. Leaving
        `defaultReminders` or `defaultPriority` out says nothing about them.
        `enabled` is the owner's alone. The source's events have
        `source.kind` `external`. A source Calendar's in-process adapter
        still syncs (`inProcess`, the sources from before the integration
        services) cannot be registered, synced, or deleted here (409
        `source_in_process`) until the release that switches that adapter
        off hands it over.
      operationId: registerIntegrationSource
      security: []
      parameters:
        - $ref: '#/components/parameters/Integration'
        - $ref: '#/components/parameters/ExternalSourceId'
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RegisterIntegrationSourceRequest'}}}}
      responses:
        '200': {description: 'The source, updated or unchanged', content: {application/json: {schema: {$ref: '#/components/schemas/IntegrationSource'}}}}
        '201': {description: 'The source, added', content: {application/json: {schema: {$ref: '#/components/schemas/IntegrationSource'}}}}
        '400': {description: 'Invalid request (invalid_source, the message says what to fix), or no valid X-Life-OS-Actor (actor_required)'}
        '403': {description: 'The actor is not system:<integration> or dev:<name> (forbidden)'}
        '409': {description: 'Calendar''s in-process adapter still syncs the source (source_in_process)'}
    delete:
      summary: Delete an integration's source
      description: Removes the source and every event imported from it.
      operationId: deleteIntegrationSource
      security: []
      parameters:
        - $ref: '#/components/parameters/Integration'
        - $ref: '#/components/parameters/ExternalSourceId'
      responses:
        '204': {description: Source and its events deleted}
        '400': {description: 'Invalid request, or no valid X-Life-OS-Actor (actor_required)'}
        '403': {description: 'The actor is not system:<integration> or dev:<name> (forbidden)'}
        '404': {description: The integration has no source with this external id}
        '409': {description: Calendar's in-process adapter still syncs the source (source_in_process)}
  /v1/integrations/{integration}/sources/{externalId}/sync:
    post:
      summary: Sync the events of an integration's source
      description: >-
        Writes one batch of the source's events, keyed by `externalUid`, in
        one transaction, and returns what changed. Repeating a batch changes
        nothing. `snapshot` lists every event of the source: a stored event
        it leaves out is cancelled and marked `removedFromSourceAt` (kept as
        history, restored if it comes back), except as `window` says.
        `delta` lists only new and changed events, with the external uids
        of events the source no longer has in `deleted` (handled like events
        a snapshot leaves out). The owner's own reminders and priority of an
        imported event survive every sync: an item's `reminders` replace the
        event's only while the owner has not changed them, and an item
        without `priority` leaves the event's alone. With `feedCursor` the
        sync is refused (409 `unhandled_changes`, nothing changes) while the
        change feed holds changes to the source's events after that cursor
        made by anyone but the integration, so a sync never overwrites an
        edit made in Life OS that the integration has not yet written to the
        provider. A disabled source refuses syncs (409 `source_disabled`),
        keeping its events.
      operationId: syncIntegrationSource
      security: []
      parameters:
        - $ref: '#/components/parameters/Integration'
        - $ref: '#/components/parameters/ExternalSourceId'
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SyncIntegrationSourceRequest'}}}}
      responses:
        '200': {description: What the batch changed, content: {application/json: {schema: {$ref: '#/components/schemas/SyncIntegrationSourceResult'}}}}
        '400': {description: 'Invalid batch: invalid_sync_request, invalid_item, invalid_exception, or duplicate_uid, with a message naming the item and what to fix; or no valid X-Life-OS-Actor (actor_required)'}
        '403': {description: 'The actor is not system:<integration> or dev:<name> (forbidden)'}
        '404': {description: The integration has no source with this external id}
        '409': {description: 'The source is disabled (source_disabled), Calendar''s in-process adapter still syncs it (source_in_process), an empty snapshot with emptyGuard would remove upcoming events (empty_snapshot), or the change feed holds edits after feedCursor that the integration has not handled (unhandled_changes)'}
  /v1/integrations/changes:
    get:
      summary: Follow the changes of events made in Life OS
      description: >-
        The change feed of the events an integration may write elsewhere:
        Life OS events (`source.kind` `manual`, such as for the Life OS
        calendar in Google), and the events of sources integrations sync
        that accept changes (`readOnly` false), whose edits in Life OS (the
        Dashboard, the AI) the integration writes to the provider: such an
        edit reaches the provider asynchronously, and the integration
        resolves conflicts with the provider's own versions. Each entry is
        one event with its current state (`event` with its occurrence
        `exceptions`) or a tombstone (`deleted`), its `source` identity for
        an integration's event, and `actors`, who changed it, so an
        integration can skip the changes it made itself (its own syncs
        included). Deleting a source deletes its events without entries.
        Changes come in commit order; several changes of one event within a
        page are one entry. `scope` `own` (the default for `system:<name>`)
        leaves out the events of other integrations' sources. Without
        `cursor` the feed starts with a snapshot (`phase` `snapshot`): every
        followed event as it is now, by id; its last page (`hasMore` false)
        returns a cursor that continues with the changes made since the
        snapshot started, so nothing is missed. Pass `nextCursor` back as `cursor` (store it after
        handling the page); `hasMore` true means more entries are waiting.
        Entries are kept for CALENDAR_CHANGE_RETENTION_DAYS (30 by default):
        a cursor older than that gets 410 `cursor_expired`; start again
        without a cursor (`GET /v1/events?sourceKind=manual` also lists the
        Life OS events). Only `system:<name>` and `dev:<name>` actors may
        read it; any other actor, or none, gets 403 `forbidden`.
      operationId: listChanges
      security: []
      parameters:
        - {name: cursor, in: query, description: The previous page's nextCursor; leave out to start with a snapshot., schema: {type: string, maxLength: 200}}
        - {name: limit, in: query, description: 'At most this many changes (snapshot: events) per page.', schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
        - {name: scope, in: query, description: '`own`: Life OS events and the events of the reading integration''s own sources (`system:<name>` only; its default). `all`: also those of every other integration (the default for `dev:<name>`).', schema: {type: string, enum: [own, all]}}
      responses:
        '200': {description: Changes, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeFeedPage'}}}}
        '400': {description: 'A malformed cursor (invalid_cursor), limit, or scope (own needs a system:<name> actor)'}
        '403': {description: 'The actor is not system:<name> or dev:<name> (forbidden)'}
        '410': {description: 'The changes after the cursor were pruned (cursor_expired); start again without a cursor'}
components:
  parameters:
    TimeZone: {name: timeZone, in: query, description: 'IANA timezone (for example Europe/Berlin) in which all-day dates are compared with instants. Defaults to the owner''s timezone configured for Calendar.', schema: {type: string, minLength: 1, maxLength: 64}}
    IncludeCancelled: {name: includeCancelled, in: query, description: Also return cancelled events (including those removed by their source)., schema: {type: boolean, default: false}}
    SourceKind: {name: sourceKind, in: query, description: 'Only events from this kind of source; `manual` lists the events created in Life OS, `external` those an integration brought in.', schema: {$ref: '#/components/schemas/EventSourceKind'}}
    SourceId: {name: sourceId, in: query, description: Only events imported from this source., schema: {type: string, format: uuid}}
    Editable: {name: editable, in: query, description: 'Only events that can be changed through this API (`editable`): Life OS events and events of integrations'' sources that accept changes (unless read-only on their own, such as one occurrence of a rule Calendar cannot hold); not feed events or the events of sources that do not accept changes. The AI looks for the events to change this way.', schema: {type: boolean, default: false}}
    EventId: {name: eventId, in: path, required: true, schema: {type: string, format: uuid}}
    RecurrenceId: {name: recurrenceId, in: path, required: true, description: 'The occurrence''s `occurrence.recurrenceId` from a listing (URL-encoded): an RFC 3339 instant for a timed series (2026-10-12T16:00:00Z), a date for an all-day one (2026-10-24).', schema: {type: string, minLength: 1, maxLength: 64}}
    Cursor: {name: cursor, in: query, description: The previous page's nextCursor. Opaque; only valid with the parameters it was returned for., schema: {type: string}}
    Integration: {name: integration, in: path, required: true, description: 'The integration service, such as `google-calendar` or `calendar-feeds`: lower-case letters, digits, and dashes. Its actor is `system:<integration>`.', schema: {type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$'}}
    ExternalSourceId: {name: externalId, in: path, required: true, description: 'The source''s id in the integration (URL-encoded), such as a Google calendar''s id.', schema: {type: string, minLength: 1, maxLength: 1024}}
  schemas:
    Weekday:
      type: string
      enum: [MO, TU, WE, TH, FR, SA, SU]
      description: A day of the week, as in iCalendar (MO is Monday).
    Recurrence:
      type: object
      description: >-
        Repeats the event every `interval` days, weeks, months, or years from
        its start, as an iCalendar (RFC 5545) rule. A timed event keeps its
        wall-clock time in its `timeZone` (else the owner's timezone) across
        daylight saving changes. Weekly repeats on the start's weekday, or on
        each of `byWeekday` (which must include the start's weekday in the
        event's timezone; all-day: its startDate's). Monthly repeats on the
        start's day of the month and skips months without it (the 31st);
        yearly on the start's date: an all-day event on 17 September repeats
        annually on September 17, such as a birthday (29 February only in leap
        years). The series ends at `until`, the latest start of an occurrence
        (inclusive; an all-day series compares its dates with until's date in
        the owner's timezone; not before the event's start), or after `count`
        occurrences, or never; not both. Errors (400): `recurrence frequency
        must be daily, weekly, monthly, or yearly`, `recurrence interval must
        be at least 1`, `recurrence byWeekday is only for weekly recurrence`,
        `recurrence byWeekday days must be MO, TU, WE, TH, FR, SA, or SU`,
        `recurrence byWeekday must include the weekday the event starts on
        (Saturday)` (naming that weekday), `recurrence count must be between 1 and 1000`,
        `recurrence takes until or count, not both`, `recurrence until must
        not be before the event starts`.
      required: [frequency, interval]
      properties:
        frequency: {type: string, enum: [daily, weekly, monthly, yearly]}
        interval: {type: integer, minimum: 1}
        until: {type: string, format: date-time, nullable: true, description: 'The latest start of an occurrence (inclusive). Not with count.'}
        count: {type: integer, minimum: 1, maximum: 1000, nullable: true, description: 'Ends after this many occurrences ("ends after N times"). Not with until.'}
        byWeekday: {type: array, nullable: true, minItems: 1, maxItems: 7, items: {$ref: '#/components/schemas/Weekday'}, description: 'Weekly only: the days of the week it repeats on, including the start''s weekday. Returned in week order (MO first), each day once; absent means the start''s weekday.'}
    EventOccurrence:
      type: object
      description: >-
        Set on an item that is one occurrence of a recurring event, as listing,
        search, and the occurrence endpoints return them. The item's `id` and
        fields are the recurring event's (update or delete it to change every
        occurrence), with this occurrence's start and end, and with this
        occurrence's own changes applied (see `modified`).
      required: [seriesId, recurrenceId, modified]
      properties:
        seriesId: {type: string, format: uuid, description: The recurring event this is an occurrence of (the same as the item's id).}
        recurrenceId: {type: string, description: 'The occurrence''s original start, unique within its series and kept when the occurrence is moved: an RFC 3339 instant in UTC for timed events, a date (YYYY-MM-DD) for all-day events.'}
        modified: {type: boolean, description: 'This occurrence has its own changes (This event): title, description, location, start and end, reminders, or priority differ from the series''. A skipped occurrence shows `status: cancelled` instead.'}
    ExternalReference:
      type: object
      deprecated: true
      description: Legacy provider reference, kept for compatibility. New code uses `source`.
      required: [provider, externalId]
      properties: {provider: {type: string}, externalId: {type: string}}
    EventSourceKind:
      type: string
      enum: [manual, ics, google, external]
      description: '`manual`: created in Life OS (the Dashboard, MCP, or a capture). `external`: brought in by an integration (see `/v1/integrations`; `source.provider` and `source.name` say from where). `ics`: imported by Calendar itself from an ICS/iCal feed, until those sources are handed over to their integration. `google`: legacy, no longer used (Google Calendar is the google-calendar integration, `external`).'
    EventSource:
      type: object
      description: Where the event comes from. Set when the event is created; updates never change it.
      required: [kind]
      properties:
        kind: {$ref: '#/components/schemas/EventSourceKind'}
        sourceId: {type: string, format: uuid, nullable: true, description: 'The Calendar source (feed or connected calendar) the event was imported from; null for manual events.'}
        name: {type: string, nullable: true, description: 'The name of that source, such as "ZAW", as it is now (renaming the source renames it here); null for manual events. Set by Calendar in responses.'}
        integration: {type: string, nullable: true, description: 'The integration the source belongs to, such as google-calendar; null for manual events. Set by Calendar in responses.'}
        provider: {type: string, nullable: true, description: 'The label of the source''s provider, such as Google or ZAW, for "<provider> · <name>"; null for manual events. Set by Calendar in responses.'}
        readOnly: {type: boolean, nullable: true, description: 'Whether the source accepts changes to its events (see `editable` for this event); null for manual events. Set by Calendar in responses.'}
        externalUid: {type: string, nullable: true, description: 'The event''s identity in its source; null for manual events. For an ICS event, its UID; one occurrence of a recurring ICS event is imported as its own event, `<UID>#<RECURRENCE-ID>`, where the RECURRENCE-ID is its original start (20261017T040000Z, or 20261017 for an all-day event). For a Google event, its Google event id; one occurrence of a recurring Google event imported as its own event is `<id>_<original start>` as Google names its instances (`<id>_20261017T040000Z`, or `<id>_20261017` for an all-day event).'}
    EventStatus:
      type: string
      enum: [active, cancelled]
      description: '`cancelled` events are kept as history but left out of listings and search unless asked for. An occurrence of a recurring event is cancelled when its series is or when it is skipped on its own.'
    EventPriority:
      type: string
      enum: [low, medium, high]
      description: 'How important an event is; the importance of its reminder notifications.'
    Reminder:
      type: object
      description: >-
        Calendar sends a notification for each effective reminder when it
        is due. `relative`: `minutesBefore` the event starts (an
        all-day event starts at midnight of its first day, owner-local).
        `localTime`: at `localTime` (HH:MM on the owner's wall clock) on the
        day `daysBefore` days before the event's start date in the owner's
        timezone, resolved when the reminder is due so daylight saving changes
        are respected. Example: a pickup on 17 November with `{"kind":
        "localTime", "daysBefore": 1, "localTime": "19:00"}` reminds on 16
        November at 19:00.
      required: [kind]
      properties:
        kind: {type: string, enum: [relative, localTime]}
        minutesBefore: {type: integer, minimum: 0, maximum: 40320, description: Required for relative (and only there); at most 28 days.}
        daysBefore: {type: integer, minimum: 0, maximum: 28, description: Required for localTime (and only there); 0 is the event's own day.}
        localTime: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: Required for localTime (and only there); 24-hour HH:MM.}
    CalendarEvent:
      type: object
      required: [id, title, allDay, reminders, useDefaultReminders, defaultReminders, effectiveReminders, priority, defaultPriority, status, source, editable, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        description: {type: string, nullable: true, description: Free-form notes or details.}
        location: {type: string, nullable: true}
        allDay: {type: boolean}
        startAt: {type: string, format: date-time, nullable: true, description: Start instant (UTC) of a timed event.}
        endAt: {type: string, format: date-time, nullable: true, description: 'End instant (UTC) of a timed event, exclusive.'}
        startDate: {type: string, format: date, nullable: true, description: First day of an all-day event.}
        endDate: {type: string, format: date, nullable: true, description: Last day (inclusive) of an all-day event.}
        timeZone: {type: string, nullable: true, description: 'IANA timezone a timed event was scheduled in (for example an ICS TZID); a display hint. Null for all-day events and when unknown.'}
        recurrence: {$ref: '#/components/schemas/Recurrence'}
        reminders: {type: array, items: {$ref: '#/components/schemas/Reminder'}, description: 'The event''s own reminders, added to its defaults when `useDefaultReminders` is true.'}
        useDefaultReminders: {type: boolean, description: Whether the event's default reminders apply as well as its own.}
        defaultReminders: {type: array, items: {$ref: '#/components/schemas/Reminder'}, description: 'The default reminders for this event, whether or not it uses them: its source''s `defaultReminders` for an imported event, else the owner''s defaults for timed or all-day events (Calendar settings). Read-only.'}
        effectiveReminders: {type: array, items: {$ref: '#/components/schemas/Reminder'}, description: 'Every reminder that applies: `defaultReminders` when `useDefaultReminders` is true, then the event''s own `reminders`, each reminder once. A notifier triggers each of them. Read-only.'}
        priority: {allOf: [{$ref: '#/components/schemas/EventPriority'}], description: 'The event''s priority, the importance of its reminder notifications: its own (for an occurrence, its own or else the series''), else `defaultPriority`.'}
        defaultPriority: {allOf: [{$ref: '#/components/schemas/EventPriority'}], description: 'The priority of the event without one of its own: its source''s `defaultPriority` for an imported event, else `medium`. Read-only.'}
        occurrence: {$ref: '#/components/schemas/EventOccurrence'}
        status: {$ref: '#/components/schemas/EventStatus'}
        cancelledAt: {type: string, format: date-time, nullable: true, description: When the event was cancelled; set exactly when status is cancelled.}
        removedFromSourceAt: {type: string, format: date-time, nullable: true, description: 'When an imported event disappeared from its source (or its source''s filter came to exclude it), which also cancels it; null for manual events and while the event is in its source.'}
        source: {$ref: '#/components/schemas/EventSource'}
        editable: {type: boolean, description: 'Whether the event can be changed through this API beyond its reminders and priority: Life OS events, and events of integrations'' sources that accept changes (such as Google calendars the account may edit) unless read-only on their own (`readOnlyReason`); not feed events, events of sources that do not accept changes, or occurrences of a rule Calendar cannot hold.'}
        readOnlyReason: {type: string, nullable: true, description: 'Why the event is not editable, for the owner; null when it is.'}
        externalReference: {$ref: '#/components/schemas/ExternalReference'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CreateEventRequest:
      type: object
      description: 'A timed event needs startAt and endAt (endAt after startAt); an all-day event needs startDate and endDate (endDate not before startDate) and takes no timeZone.'
      required: [title, allDay]
      properties:
        title: {type: string, minLength: 1}
        description: {type: string}
        location: {type: string}
        allDay: {type: boolean}
        startAt: {type: string, format: date-time}
        endAt: {type: string, format: date-time}
        startDate: {type: string, format: date}
        endDate: {type: string, format: date}
        timeZone: {type: string, description: IANA timezone of a timed event.}
        recurrence: {$ref: '#/components/schemas/Recurrence'}
        reminders: {type: array, maxItems: 10, items: {$ref: '#/components/schemas/Reminder'}, description: 'The event''s own reminders, added to its defaults; leave out for none.'}
        useDefaultReminders: {type: boolean, default: true, description: 'Whether the default reminders apply as well; false (with no `reminders`) means no reminders at all.'}
        priority: {allOf: [{$ref: '#/components/schemas/EventPriority'}], description: Leave out for the default (medium).}
        externalReference: {$ref: '#/components/schemas/ExternalReference'}
    UpdateEventRequest:
      type: object
      minProperties: 1
      properties:
        title: {type: string, minLength: 1}
        description: {type: string, nullable: true}
        location: {type: string, nullable: true}
        allDay: {type: boolean}
        startAt: {type: string, format: date-time, nullable: true}
        endAt: {type: string, format: date-time, nullable: true}
        startDate: {type: string, format: date, nullable: true}
        endDate: {type: string, format: date, nullable: true}
        timeZone: {type: string, nullable: true}
        recurrence: {type: object, allOf: [{$ref: '#/components/schemas/Recurrence'}], nullable: true, description: 'Replaces the rule. Null stops the event repeating (on a split: the new series does not repeat).'}
        reminders: {type: array, nullable: true, maxItems: 10, items: {$ref: '#/components/schemas/Reminder'}, description: 'Replaces the event''s own reminders. Null returns the event to its defaults alone: no own reminders, and `useDefaultReminders` true unless the body sets it.'}
        useDefaultReminders: {type: boolean, description: Turns the default reminders on or off; the event's own reminders stay.}
        priority: {allOf: [{$ref: '#/components/schemas/EventPriority'}], description: 'The event''s priority; its `defaultPriority` makes it follow its default again. Also allowed on an imported event.'}
        status: {$ref: '#/components/schemas/EventStatus'}
    UpdateOccurrenceRequest:
      type: object
      minProperties: 1
      description: >-
        One occurrence's own changes. The start and end keep the series' kind
        (`startAt`/`endAt` for a timed series, `startDate`/`endDate` for an
        all-day one). `reminders: null` gives the occurrence no own reminders
        and turns its defaults on unless the body sets `useDefaultReminders`.
      properties:
        title: {type: string, minLength: 1}
        description: {type: string, nullable: true}
        location: {type: string, nullable: true}
        allDay: {type: boolean, description: 'Must be the series'' allDay: an occurrence cannot switch between timed and all-day.'}
        startAt: {type: string, format: date-time}
        endAt: {type: string, format: date-time}
        startDate: {type: string, format: date}
        endDate: {type: string, format: date}
        reminders: {type: array, nullable: true, maxItems: 10, items: {$ref: '#/components/schemas/Reminder'}}
        useDefaultReminders: {type: boolean}
        priority: {allOf: [{$ref: '#/components/schemas/EventPriority'}], description: 'This occurrence''s priority; the series'' priority makes it follow the series again.'}
        status: {$ref: '#/components/schemas/EventStatus'}
    EventList: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/CalendarEvent'}}, nextCursor: {type: string, nullable: true, description: Set when more events match; pass it as cursor for the next page.}}}
    CalendarSourceKind:
      type: string
      enum: [ics, external]
      description: '`external`: a source an integration syncs (see `/v1/integrations`), which keeps its own URL, filter, and refresh state, such as a feed of calendar-feeds. `ics`: a feed Calendar downloaded itself before the handover to calendar-feeds (P11-08); none remain after its migration, and P11-09 drops the kind.'
    SourceFilter:
      type: object
      description: >-
        Which feed events to import. A term matches an event when it equals
        one of the event's CATEGORIES or occurs in its SUMMARY (both
        case-insensitive). With `include` terms, only events matching one of
        them are imported; then events matching an `exclude` term are
        dropped. Empty lists import everything. Empty for a source an
        integration syncs: a feed's filter is calendar-feeds'.
      required: [include, exclude]
      properties:
        include: {type: array, maxItems: 50, items: {type: string, minLength: 1, maxLength: 100}}
        exclude: {type: array, maxItems: 50, items: {type: string, minLength: 1, maxLength: 100}}
    SourceRefreshOutcome:
      type: string
      enum: [imported, not_modified, failed]
      description: '`imported`: the feed was downloaded and its events reconciled. `not_modified`: the server confirmed the feed is unchanged (ETag/Last-Modified). `failed`: the refresh failed; the events from the last good refresh are kept.'
    SourceRefreshCounts:
      type: object
      description: What the last reconciling refresh did.
      required: [feedEvents, imported, inserted, updated, removed, restored, unchanged]
      properties:
        feedEvents: {type: integer, description: Events (occurrences) in the feed.}
        imported: {type: integer, description: Feed events kept by the filter.}
        inserted: {type: integer}
        updated: {type: integer}
        removed: {type: integer, description: 'Future events no longer in the feed (or now filtered out): cancelled and marked removedFromSourceAt.'}
        restored: {type: integer, description: Events back in the feed after having been removed.}
        unchanged: {type: integer}
        skipped: {type: integer, description: Feed events that could not be read (such as a missing start) and were left out.}
    SourceRefreshState:
      type: object
      description: 'The refresh schedule and last outcome of a feed Calendar refreshed itself (`lastOutcome` and `lastCounts` are absent before the first refresh). Read-only. Empty (no outcome, no failures) for a source an integration syncs: its integration keeps that state (a feed''s is calendar-feeds'' `refresh`).'
      required: [consecutiveFailures, refreshing]
      properties:
        nextRefreshAt: {type: string, format: date-time, nullable: true, description: 'When the source is refreshed next (daily at the quiet hour, sooner after a failure).'}
        lastAttemptAt: {type: string, format: date-time, nullable: true}
        lastSuccessAt: {type: string, format: date-time, nullable: true}
        lastOutcome: {$ref: '#/components/schemas/SourceRefreshOutcome'}
        lastError: {type: string, nullable: true, description: Why the last refresh failed; null after a success.}
        consecutiveFailures: {type: integer, description: Failed refreshes since the last success; drives the retry backoff.}
        lastCounts: {$ref: '#/components/schemas/SourceRefreshCounts'}
        etag: {type: string, nullable: true, description: 'The feed''s ETag from the last download, sent back as If-None-Match.'}
        lastModified: {type: string, nullable: true, description: 'The feed''s Last-Modified from the last download, sent back as If-Modified-Since.'}
        refreshing: {type: boolean, description: A refresh is running now.}
    CalendarSource:
      type: object
      required: [id, kind, name, url, enabled, filter, defaultReminders, defaultPriority, refresh, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        kind: {$ref: '#/components/schemas/CalendarSourceKind'}
        name: {type: string, description: 'The label shown with the source''s events, such as "ZAW".'}
        url: {type: string, description: 'The feed URL of a feed Calendar refreshed itself (before the handover); empty for a source an integration syncs (its integration keeps the URL).'}
        enabled: {type: boolean, description: 'The owner''s switch: a disabled source is not synced (its integration''s syncs are refused); its events stay as they are.'}
        integration: {type: string, nullable: true, description: 'The integration the source belongs to, such as calendar-feeds.'}
        externalId: {type: string, nullable: true, description: The source's id in its integration.}
        provider: {type: string, nullable: true, description: 'The label of the source''s provider, such as ZAW or ICS.'}
        readOnly: {type: boolean, description: Whether the source accepts changes to its events.}
        preset: {type: string, nullable: true, description: 'Set (such as `zaw`) for a feed Calendar refreshed itself and configured from its environment, before the handover; null for a source an integration syncs (calendar-feeds keeps its preset).'}
        filter: {$ref: '#/components/schemas/SourceFilter'}
        defaultReminders: {type: array, nullable: true, items: {$ref: '#/components/schemas/Reminder'}, description: 'Default reminders for this source''s events: every event that uses its defaults gets them, together with its own (for example the evening before a waste pickup, `{"kind":"localTime","daysBefore":1,"localTime":"19:00"}`). Null means none.'}
        defaultPriority: {allOf: [{$ref: '#/components/schemas/EventPriority'}], description: 'The priority of this source''s events that have none of their own; medium unless set.'}
        refresh: {$ref: '#/components/schemas/SourceRefreshState'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time, description: When the configuration last changed.}
    UpdateSourceRequest:
      type: object
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        url: {type: string, minLength: 1, maxLength: 2048, description: 'Not changeable here: a feed''s URL and filter belong to its integration (409 managed_by_integration).'}
        enabled: {type: boolean}
        filter: {$ref: '#/components/schemas/SourceFilter'}
        defaultReminders: {type: array, nullable: true, maxItems: 10, items: {$ref: '#/components/schemas/Reminder'}, description: Replaces the default reminders; null removes them.}
        defaultPriority: {allOf: [{$ref: '#/components/schemas/EventPriority'}], description: 'Replaces the default priority; the source''s events without one of their own follow it.'}
    SourceList: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/CalendarSource'}}}}
    ReminderDefaults:
      type: object
      description: The owner's default reminders for the events they create in Life OS.
      required: [timed, allDay]
      properties:
        timed: {type: array, maxItems: 10, items: {$ref: '#/components/schemas/Reminder'}, description: 'For timed events, such as `{"kind":"relative","minutesBefore":30}`.'}
        allDay: {type: array, maxItems: 10, items: {$ref: '#/components/schemas/Reminder'}, description: 'For all-day events, such as `{"kind":"localTime","daysBefore":1,"localTime":"19:00"}`.'}
    CalendarSettings:
      type: object
      required: [defaultReminders, updatedAt]
      properties:
        defaultReminders: {$ref: '#/components/schemas/ReminderDefaults'}
        updatedAt: {type: string, format: date-time, nullable: true, description: When the settings last changed; null while they never have.}
    UpdateSettingsRequest:
      type: object
      minProperties: 1
      properties:
        defaultReminders:
          type: object
          minProperties: 1
          description: The lists to replace; a list left out stays.
          properties:
            timed: {type: array, maxItems: 10, items: {$ref: '#/components/schemas/Reminder'}}
            allDay: {type: array, maxItems: 10, items: {$ref: '#/components/schemas/Reminder'}}
    # Reminder delivery (P12-04).
    ReminderDeliveryStatus:
      type: object
      required: [enabled, intervalSeconds, graceMinutes, handledThrough, lastRunAt, lastSuccessAt, lastError, lastErrorAt, lastSentAt]
      properties:
        enabled: {type: boolean, description: 'Whether Calendar sends reminders: false when NOTIFICATIONS_SERVICE_URL is not set.'}
        intervalSeconds: {type: integer, description: How often due reminders are looked for.}
        graceMinutes: {type: integer, description: 'How late a reminder may still be sent (marked "(late)") after Calendar was down; older ones are recorded as missed.'}
        handledThrough: {type: string, format: date-time, nullable: true, description: 'Every reminder due up to this instant has been sent, recorded as missed, or refused by Notifications; null before the first run.'}
        lastRunAt: {type: string, format: date-time, nullable: true, description: When a run last started.}
        lastSuccessAt: {type: string, format: date-time, nullable: true, description: When a run last finished without an error.}
        lastError: {type: string, nullable: true, description: 'The last run error, kept until the next one: current when lastErrorAt is after lastSuccessAt.'}
        lastErrorAt: {type: string, format: date-time, nullable: true}
        lastSentAt: {type: string, format: date-time, nullable: true, description: When a run last sent a reminder.}
    # Integration API (P11-06).
    IntegrationSource:
      type: object
      required: [id, integration, externalId, provider, name, enabled, readOnly, inProcess, defaultReminders, defaultPriority, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid, description: 'The source''s id in Calendar: its events carry it as `source.sourceId`.'}
        integration: {type: string}
        externalId: {type: string}
        provider: {type: string, description: 'The label shown for the source, such as Google, ZAW, or ICS.'}
        name: {type: string, description: 'The name shown with its events (the owner may have changed it).'}
        enabled: {type: boolean, description: The owner's switch; a disabled source refuses syncs and keeps its events.}
        readOnly: {type: boolean, description: 'Whether the source accepts changes to its events. Those of a source that does are editable in Life OS like Life OS events (unless read-only on their own, see SourceEvent `readOnlyReason`), and each change comes through the change feed for the integration to write to the provider; a read-only source''s events allow only their reminders and priority.'}
        inProcess: {type: boolean, description: 'Calendar''s in-process adapter still syncs the source (a source from before the integration services); it cannot be synced through this API until it is handed over.'}
        defaultReminders: {type: array, nullable: true, items: {$ref: '#/components/schemas/Reminder'}, description: Default reminders of the source's events; null means none.}
        defaultPriority: {$ref: '#/components/schemas/EventPriority'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    IntegrationSourceList: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/IntegrationSource'}}}}
    RegisterIntegrationSourceRequest:
      type: object
      required: [name, provider, readOnly]
      properties:
        name: {type: string, minLength: 1, maxLength: 500, description: 'The source''s name in the integration, such as the Google calendar''s name.'}
        provider: {type: string, minLength: 1, maxLength: 50, description: 'The label shown for the source, such as Google or ZAW.'}
        readOnly: {type: boolean, description: Whether the source accepts changes to its events.}
        defaultReminders: {type: array, nullable: true, maxItems: 10, items: {$ref: '#/components/schemas/Reminder'}, description: 'The source''s own default reminders (null: none). Leave out when the source has none to say.'}
        defaultPriority: {allOf: [{$ref: '#/components/schemas/EventPriority'}], description: Leave out when the source has none to say (new sources get medium).}
    SourceEventReminders:
      type: object
      description: The reminders the source gives an event, like Google Calendar's notifications.
      required: [useDefault, reminders]
      properties:
        useDefault: {type: boolean, description: The event follows the source's default reminders.}
        reminders: {type: array, maxItems: 10, items: {$ref: '#/components/schemas/Reminder'}, description: The event's own reminders.}
    SourceEventPriority:
      type: string
      enum: [low, medium, high, default]
      x-enum-varnames: [SourcePriorityLow, SourcePriorityMedium, SourcePriorityHigh, SourcePriorityDefault]
      description: 'An event''s own priority as its source gives it; `default`: none of its own, so it follows the source''s `defaultPriority`.'
    OccurrenceChanges:
      type: object
      description: >-
        The fields one occurrence of a series overrides, as Calendar stores
        them; absent fields follow the series. `description` or `location`
        null clears it for the occurrence. A moved occurrence gives both
        ends: `startAt` and `endAt` for a timed series, `startDate` and
        `endDate` (inclusive) for an all-day one.
      properties:
        title: {type: string, minLength: 1, maxLength: 500}
        description: {type: string, nullable: true, maxLength: 10000}
        location: {type: string, nullable: true, maxLength: 500}
        startAt: {type: string, format: date-time}
        endAt: {type: string, format: date-time}
        startDate: {type: string, format: date}
        endDate: {type: string, format: date}
        reminders: {type: array, maxItems: 10, items: {$ref: '#/components/schemas/Reminder'}}
        useDefaultReminders: {type: boolean}
        priority: {$ref: '#/components/schemas/EventPriority'}
    SourceEventException:
      type: object
      description: 'One occurrence of a series changed or skipped (Google''s changed or cancelled instances, EXDATEs). It must skip the occurrence or change something.'
      required: [recurrenceId]
      properties:
        recurrenceId: {type: string, minLength: 1, maxLength: 64, description: 'The occurrence''s original start: an RFC 3339 instant in UTC for a timed series (2026-10-12T16:00:00Z), a date for an all-day one (2026-10-24).'}
        cancelled: {type: boolean, default: false, description: The occurrence is skipped.}
        changes: {$ref: '#/components/schemas/OccurrenceChanges'}
    SourceEvent:
      type: object
      description: >-
        One event of a source as the integration has it. A timed event needs
        `startAt` and `endAt` (after it); an all-day event `startDate` and
        `endDate` (inclusive, not before it) and no `timeZone`. A series has
        its `recurrence` (Calendar's model; a rule outside it is sent as one
        event per occurrence) and its occurrences' own changes and skips in
        `exceptions`. Validated like events created in Life OS.
      required: [externalUid, title, allDay]
      properties:
        externalUid: {type: string, minLength: 1, maxLength: 2048, description: 'The event''s identity in the source, unique within it, such as a Google event id or an ICS UID.'}
        previousExternalUid: {type: string, minLength: 1, maxLength: 2048, description: 'The uid the event had in Calendar until now, to give it the uid the source knows it by: an event Calendar created in the source (the new series of a split, `lifeos:<id>`) once the integration has created it at the provider. Ignored when Calendar has no event with it, or already has one with externalUid.'}
        title: {type: string, minLength: 1, maxLength: 500}
        description: {type: string, nullable: true, maxLength: 10000}
        location: {type: string, nullable: true, maxLength: 500}
        allDay: {type: boolean}
        startAt: {type: string, format: date-time, nullable: true}
        endAt: {type: string, format: date-time, nullable: true}
        startDate: {type: string, format: date, nullable: true}
        endDate: {type: string, format: date, nullable: true}
        timeZone: {type: string, nullable: true, description: The IANA timezone a timed event is scheduled in.}
        status: {allOf: [{$ref: '#/components/schemas/EventStatus'}], description: '`cancelled`: the source cancelled the event (kept as cancelled history). Default active.'}
        recurrence: {type: object, allOf: [{$ref: '#/components/schemas/Recurrence'}], nullable: true}
        exceptions: {type: array, maxItems: 1000, items: {$ref: '#/components/schemas/SourceEventException'}, description: A series' changed or skipped occurrences.}
        reminders: {$ref: '#/components/schemas/SourceEventReminders'}
        priority: {$ref: '#/components/schemas/SourceEventPriority'}
        readOnlyReason: {type: string, nullable: true, minLength: 1, maxLength: 500, description: 'Set when the event cannot be changed in Life OS although its source accepts changes (such as one occurrence of a rule Calendar cannot hold): why, as shown to the owner. Its reminders and priority stay changeable.'}
    SyncWindow:
      type: object
      description: >-
        Which stored events the batch speaks for; at most one of the two.
        `start`: the source lists its events from this instant on (Google's
        time window): a stored event that ended before it is history the
        source no longer lists and stays as it is. `upcomingOnly`: the source
        lists only events still to come (many ICS feeds): a stored event that
        started before now is neither removed nor rewritten, unless the
        batch moves it into the future.
      properties:
        start: {type: string, format: date-time}
        upcomingOnly: {type: boolean, default: false}
    SyncIntegrationSourceRequest:
      type: object
      required: [mode, items]
      properties:
        mode: {type: string, enum: [snapshot, delta]}
        items: {type: array, maxItems: 10000, items: {$ref: '#/components/schemas/SourceEvent'}, description: 'Every event of the source (snapshot), or the new and changed ones (delta).'}
        deleted: {type: array, maxItems: 10000, items: {type: string, minLength: 1, maxLength: 2048}, description: 'delta only: the external uids of events the source no longer has. Unknown ones are ignored.'}
        window: {$ref: '#/components/schemas/SyncWindow'}
        emptyGuard: {type: boolean, default: false, description: 'snapshot only: a snapshot without items is refused (409 empty_snapshot, nothing changes) while the source still has upcoming active events, such as when a feed comes back empty by mistake.'}
        feedCursor: {type: string, maxLength: 200, description: 'The change-feed cursor (phase changes) the integration has handled: the sync is refused (409 unhandled_changes) while the feed has changes to this source''s events after it made by anyone else. Leave out for a read-only source.'}
    SyncIntegrationSourceResult:
      type: object
      required: [mode, received, inserted, updated, removed, restored, unchanged]
      properties:
        mode: {type: string, enum: [snapshot, delta]}
        received: {type: integer, description: Items in the batch.}
        inserted: {type: integer}
        updated: {type: integer}
        removed: {type: integer, description: 'Events cancelled and marked removedFromSourceAt: left out of a snapshot, or deleted in a delta.'}
        restored: {type: integer, description: Removed events back in the source.}
        unchanged: {type: integer}
    OccurrenceException:
      type: object
      description: One occurrence of a series with its own changes or skipped (This event).
      required: [recurrenceId, cancelled, changes, updatedAt]
      properties:
        recurrenceId: {type: string, description: 'The occurrence''s original start (see `occurrence.recurrenceId`).'}
        cancelled: {type: boolean, description: The occurrence is skipped.}
        cancelledAt: {type: string, format: date-time, nullable: true}
        changes: {$ref: '#/components/schemas/OccurrenceChanges'}
        updatedAt: {type: string, format: date-time}
    ChangeFeedSource:
      type: object
      description: Where an integration's event belongs, so the integration knows where to write it.
      required: [sourceId, integration, externalId, externalUid]
      properties:
        sourceId: {type: string, format: uuid}
        integration: {type: string}
        externalId: {type: string, description: The source's id in the integration.}
        externalUid: {type: string, description: 'The event''s uid in the source (`lifeos:<id>` for an event Calendar created there, such as the new series of a split, until the integration gives it its own uid).'}
    ChangeFeedEntry:
      type: object
      required: [eventId, deleted, actors, changedAt, exceptions]
      properties:
        eventId: {type: string, format: uuid}
        source: {type: object, allOf: [{$ref: '#/components/schemas/ChangeFeedSource'}], nullable: true, description: 'An integration''s event: its source identity (also for a tombstone); null for a Life OS event.'}
        deleted: {type: boolean, description: 'The event no longer exists (a tombstone): `event` is null.'}
        event: {type: object, allOf: [{$ref: '#/components/schemas/CalendarEvent'}], nullable: true, description: 'The event as it is now (as GET /v1/events/{eventId} returns it); null when deleted.'}
        exceptions: {type: array, items: {$ref: '#/components/schemas/OccurrenceException'}, description: 'A series'' occurrence changes and skips as they are now; empty otherwise.'}
        actor: {type: string, nullable: true, description: 'Who made the latest change, as in X-Life-OS-Actor (user, agent:<name>, system:<name>, dev:<name>); null in a snapshot.'}
        actors: {type: array, items: {type: string}, description: 'Everyone who made the changes this entry stands for, each once; empty in a snapshot. An integration skips an entry as its own write only when it is the only actor.'}
        changedAt: {type: string, format: date-time, description: 'When the latest change was made (in a snapshot: the event''s updatedAt).'}
        sequence: {type: integer, format: int64, nullable: true, description: The feed position of the latest change; null in a snapshot.}
    ChangeFeedPage:
      type: object
      required: [items, nextCursor, hasMore, phase]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ChangeFeedEntry'}}
        nextCursor: {type: string, description: Pass it back as cursor for what follows; always set.}
        hasMore: {type: boolean, description: 'More entries of this phase are waiting now. On a snapshot page, false means the snapshot is complete: every followed event it did not list no longer exists, and nextCursor continues with changes.'}
        phase: {type: string, enum: [snapshot, changes], description: 'Whether the items are a snapshot (every followed event as it is now) or changes since the cursor.'}
