# Overlay for tools/smoke-retry-schedule only: runs the processor's Codex
# calls through tools/fixtures/codex-limit-simulator.
services:
  processor:
    environment:
      LIFE_OS_CODEX_COMMAND: /opt/lifeos-sim/codex-limit-simulator
    volumes:
      - type: bind
        source: ${LIFE_OS_SIM_DIR:?set by tools/smoke-retry-schedule}
        target: /opt/lifeos-sim
        read_only: true
