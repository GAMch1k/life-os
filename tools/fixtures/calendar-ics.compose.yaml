# Overlay for the Calendar feed browser tests only, on the verification stack
# (LIFE_OS_VERIFY_OVERLAYS=tools/fixtures/calendar-ics.compose.yaml): serves
# the feeds the tests write to $LIFE_OS_E2E_ICS_DIR at http://ics-fixture/ and
# lets this stack's calendar-feeds fetch them over http from a private
# address. Never use it for the deployed stack:
# CALENDAR_FEEDS_ALLOW_PRIVATE_URLS turns off calendar-feeds' protection
# against reaching internal services.
services:
  calendar-feeds:
    environment:
      CALENDAR_FEEDS_ALLOW_PRIVATE_URLS: "true"
  ics-fixture:
    image: nginx:1.28-alpine
    volumes:
      - type: bind
        source: ${LIFE_OS_E2E_ICS_DIR:?set to the directory the browser tests write feeds to}
        target: /usr/share/nginx/html
        read_only: true
    networks: [backend]
